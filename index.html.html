ace items if necessary.","Examine and ensure all brackets, fixings, fan enclosure and housing to be secure. Check bolts for corrosion. Tighten and replace as necessary. Report on condition of supports.","Inspect shaft and bearings for wear corrosion and tightness. Repair or replace bearings as necessary.","Check shaft and bearings for end play. Report on condition. Replace bearings if necessary.","Examine motor to shaft alignment. Adjust if necessary.","Check bearing locking collars, retighten and repair as necessary.","Test bearings for wear and shaft end play. Report findings.","Check motor RPM. Record data. Compare with commissioning figures or design data. Report significant change.","Lubricate motor according to the manufacturer's recommendations.","Examine and ensure that motor ventilation airways are clear. Remove all dirt and dust by vacuum cleaning.","Check motor isolation mounts and fixings. Tighten as necessary.","Remove dirt accumulation from wheel and housing.","Check wheel, housing, and bolts and set screws for tightness.","Inspect flexible connections for leaks. Re-tighten brackets or gaskets as necessary. Replace a defective connection.","Ensure duct hangers rigidity and tightness. Tighten as necessary. Inspect condition of brackets, hangers, and bolts. Report accordingly.","Check and ensure correct operation of all switches, controls and controllers.","Examine and report on condition of all associated wiring facilities and wiring. Ensure security of termination.","Carry out insulation resistance and earth continuity tests. Report results.","Check voltage and amperage. Record data. Report any significant error."]}},"ME-36":{"name":"Water Filter","frequencies":{"Weekly":["Clean the filter outside casing","Check the filters cartridges. Replace or clean as necessary.","Check the pipe work connections for leakage or crack. Repair as required."]}},"ME-37":{"name":"Fire Pump and Jockey Pump","frequencies":{"Safety Precautions":["Carefully read and understand the warning and instructions contained in the safety section and the manufacturer manual before performing any maintenance procedure.","For types of engine oil, oil cooler, fuel, grease, refer to manufacturer’s recommendations.","Walk around inspection-inspect engine for leaks and loose connections.","Engine crank case-check oil level.","Cooling system-check coolant level.","Water separator-drain water and sediment.","Engine air cleaner-check service indicator.","Visually externally inspect pump drive shaft and seal. Report any defects.","Check each pump operation via control panel, and automatic control. Report any defects.","Ensure correct operation of all indicators, audible and visual alarms. Repair or replace any faulty item.","Clutch control level-lubricate fitting.","Pilot bearing and fly wheel clutch (standard)-lubricate fittings.","Fly whell clutch (heavy duty)-check oil level."],"Monthly":["Carry out tasks as detailed for Weekly.","Examine pump unit and adjacent pipe work together with associated connections for leaks and/or corrosion, report findings.","Clean pump, motor and base."],"Quarterly":["Carry out tasks as detailed for Monthly.","Report any excessive noise or vibration or rough operation.","Examine and record suction and delivery pressures. Report any defects.","Examine and test all associated isolation and check valves for full and free travel, checking for leakage or corrosion. Adjust or repack valve glands as required. Lubricate valve stems as necessary, removing all deposits.","Ensure security of all brackets, supports and fixings.","Check for scale formation, deterioration, or corrosion at suction end, and piping. Report on condition.","Check for end play of shaft. Report on condition, and advise on any remedial work.","Check for presence of dirt, moisture and other accumulations.","Lubricate bearings as per manufacturer's recommendations.","Test motor RPM.","Check all connections, and report conditions. Repair damage or necessary.","Check and ensure correct operation of controls, controllers and switches.","Test motor voltage17 and amperage.","Scheduled Oil Sampling (S.O.S-Obtain).","Engine Oil and Filter(s)-Replace.","Fuel Filters-Replace final and clean primary.","Cooling System-Replace supplemental additive element, if equipped, or add supplemental coolant additive (conditioner).","Radiators Fins-Inspect/Clean.","Belts and Hoses-Inspect/Replace.","Engine Air Cleaner-Clean/Replace element.","Batteries-Clean/Check electrolyte level.","Valve Lash (At First Oil Change Only)-Check/Adjust.","Fuel Tank-Drain water and sediment."],"Bi-Annually":["Carry out tasks as detailed for Quarterly.","Check for inadequate lubrication, or overheated bearings. Inspect lubrication system and ensure oil rings turning freely with shaft. Repair as necessary.","Drain used lubricant.","Wash oil wells on bearings with an approved solution.","Repair or replace defective oil rings.","Refill oil wells with proper lubricant. Refer to manufacturer's catalogue for type of lubricants.","There is to be no under or over lubrication, dilution, or overheating of the lubricants.","Check for lubrication leaks. Repair or replace bearings as necessary."],"Annually":["Carry out tasks as detailed for Bi-annually.","Examine and ensure motor ventilation airways are clear, remove all dirt and dust by vacuum cleaner.","Check coupling assembly. Examine bolts torque with a torque wrench set to the manufacturer's recommendations. Any bolts which are suspected to loose or fracture during normal operation are to be replaced with new nuts and bolts of the correct specification.","Check and tighten holding down bolts as required. Report on condition.","Overhaul pump as per manufacturer's recommendations.","Examine and report condition of all associated electrical facilities, ensuring security of terminals.","Carry out earth continuity test. Test insulation of motor windings. Advise on the necessity of any remedial work needed.","Engine Protective Devices-Inspect/Check.","Engine Mounts-Inspect/Check.","Vibration Damper-Inspect/Check.","Turbocharger (if Equipped)-Ispect for proper operation.","Valve Lash-Check/Adjust.","Water Separator-Replace element.","PCV Valve-Check/Clean. 8.00 Flywheel Clutch (Heavy Duty)-Replace oil.","Fuel Nozzles-Test.","Governor Set Point and Low Idle Speed-Check/Adjust.","Fuel Pump/Governor Housing-Drain Water.","Thermostat-Replace.","Cooling System Hose and PCV Hoses-Replace.","Cooling System-Clean and Flush.","Alternator-Inspect/Rebuild or Exchange.","Water Pump-Inspect/Rebuild or Exchange.","Starting Motor-Inspect/Rebuild or Exchange.","Turbocharger (If Equipped)-Inspect/Rebuild or Exchange.","Flywheel Ring Gear-Inspect/Check.","Fan Drive and Belt Tightened Assembly-Inspect/Check.","SR 4 Generator and Voltage Regulator (If Equipped)- Clean/Inspect/Lubricate.","Alternator, Cylinder Head Assembly, Connecting Rods, Pistons, Turbocharger (If Equipped), Oil Pump, Oil Pump Releif Valve, Fuel Ratio Control and Timing Advance-Inspect/Rebuild or Exchange.","Crankshaft Bearings, Crankshaft Seals and Piston Rings-Install new.","Crankshaft, Camshaft, Camshaf Followers and Camshaft Bearings, Damper and Cylinder Block-Inspect.","Fuel Nozzles, Fuel Injection Pump and Governor-Test.","Oil cooler and ATAAC Aftercooler Core (If Equipped)-Clean/Test.","Coolant Analysis-Obtain."]}},"ME-38":{"name":"Fuel Storage Tanks and Fuel Pump","frequencies":{"Bi-Annually":["Examine and ensure all lids and covers are correctly located.","Examine overflows and vents for obstruction, leave in free condition, and ensure security of all fixings and supports.","Examine fuel level; ensure correct operation level control sensors.","Examine tank and associated pipework connections for leaks, repair as required.","Check access ladder. Ensure rigidity. Repair and report as necessary.","Examine internal conditions of tank. Inspect surfaces for signs of deposits. Report findings.","After inspection, replace manhole cover using new gaskets. Clean and grease bolts before replacement.","Cleaning is to be carried out when inspection reveals that this is necessary, in order to remove dirt, scale or sludge. This is also necessary to carry out repairs to the tank, fittings or lining.","Inspect fixings and linkages of level sensors. Check for damage or corrosion.","Inspect level sensors for damage, pressure of fuel in their compartments. Repair or replace if necessary.","Clean any spillage of fuel in the premises."],"Annually":["Carry out tasks as detailed for Bi-annually.","Test all valves, ensure full and free travel and correct settings, check for leakage, adjust or replace valve glands as may be required, remove all deposits and lubricate valve stems.","Examine all exposed pipe work for damage, repairing any damaged sections."]}},"ME-39":{"name":"Grease Interceptor","frequencies":{"Weekly":["Clean the interceptor in order to maintain proper operating efficiency. Follow the manufacturer’s instructions to perform this process.","Remove solids that collect in the interceptor thru settling and remove grease.","Check the air relief port in order to be clear."]}},"ME-40":{"name":"Oil Interceptor","frequencies":{"Weekly":["Clean the interceptor in order to maintain proper operating efficiency. Follow the manufacturer’s instructions to perform this process.","Remove solids that collect in the interceptor thru settling and remove oil.","Check the air relief port in order to be clear."]}},"ME-41":{"name":"Submersible Pumps","frequencies":{"Safety Precautions":["Disconnect the power supply to the pump and pit before servicing, whether for periodic inspections or emergency repairs.","In case of severe vibration or unusual noise, shut off the pump at once, then determine the cause.","If frequent tripping of overload protection device occurs a qualified electrician should be called to analyze the correct problem.","If sump covers are removed provide warning signs and barriers to prevent injury to personnel.","Do not raise, lower, or support the unit by means of the electrical power cable, or the moisture sensor cable."],"Monthly":["Check each pump operation via control panel Hand/Off/Auto switch. Report findings.","Ensure correct operation of all control panel indicator lamps. Replace any faulty lamp as necessary."],"Quarterly":["Carry out tasks as detailed for Monthly.","Examine and test all associated isolation and check valves for full and free travel, checking for leakage. Adjust or repack valve glands as required. Lubricate valves stems as necessary.","Ensure pit covers are safe and not deteriorated or damaged.","Clean out cover seating rebate, check seals or re-grease as required and refit covers. Remove any surplus grease and ensure that holding bolts (if fitted) are secure.","Clean the sump of accumulated abrasive particles.","Clean the interior of control cabinet of oil, dirt and moisture.","Remove rust spots and spots from the control cabinet. Repaint all bare spots.","Inspect unit operation. Report any excessive noise or vibration or any rough operation logging on load motor current.","Check pump motor stator housing and seal chamber for presence of liquid being pumped. If it exists, inspect for worn or damaged seals, O-rings, etc. Replace defective items.","Check and ensure that pump inlet is clear and free from obstruction, repair and clean inlet strainer as necessary. Thoroughly flush with water until it becomes clear.","Check for inadequate suction, discharge and shut-off heads against normal operating standards as per Manufacturer’s manuals.","Check for end play of shaft motor. Report on condition, and advise on any necessary remedial work.","Check for presence of dirt, moisture and other accumulations. Clean as necessary.","Check for evidence of strain on pump casing.","Check and ensure correct operation of all flexible hoses (if applicable) and connections, repairing or advising on the necessity to replace damaged components.","Inspect failure to start when switch makes contact. Repair as necessary.","Inspect float switches and control cables. Check for cuts or damages caused by debris entering system. Check for attack by corrosive material entering the system. Check for condition of clamps and supporting pipe. Adjust as necessary. Report on condition. Advise on need of any remedial work.","Check condition of alarm system. Ensure correct high and low level alarm18.","Check condition of contacts of electrical equipment. Repair or replace as necessary.","Ensure correct operation of all level control; float switches, or probes. Check for bend rods, binding or other damages. Adjust or replace as necessary."],"Annually":["Check pump base guides for wear. Report on condition.","Clean impeller. Inspect for any damage, cracks or breaks. Report on condition. Advise on the necessity of any remedial work.","Rotate the impeller by hand to insure that it turns freely. If not check for wear or damage on ball bearings, or shaft. Replace defective bearings. Report on condition of shaft.","Inspect level of oil in the seal chamber by unscrewing the plug. Add oil to the manufacturer's recommendations if necessary.","Examine condition of all associated wiring. Test for electrical security of terminals. Repair as necessary.","Carry out insulation test on motor windings. Report results. Advise on the necessity of any remedial action."]}},"ME-42":{"name":"GRP Tanks","frequencies":{"As Required":["GRP Tank shall be inspected from time to time to ensure that overflow and warning pipes are clear from blockage. That covers are adequate and securely fixed and that there are no signs of leakage or deterioration likely to result in leakage.","GRP tank storing more than 1000 litres of drinking shall be inspected at least once every six months, those storing less than 1000 litres drinking water at least once every year."]}},"ME-43":{"name":"Plumbing,  piping network  (Domestic  Cold  Water, Drinking Water, Hot Water)","frequencies":{"Monthly":["Check all exposed pipe work, flanges, connections, etc. for leakage, damage, or corrosion. Report defect and repair as necessary.","Check alignment of expansion bellows and lugs where applicable. Report any defects. Check guide points for wear and freedom of pipe movement, grease guide rollers if applicable."],"Quarterly":["Carry out tasks as detailed for Monthly.","Check all pipe support brackets for security, and tighten as necessary. Report conditions of supports.","Check condition of all anti-vibration mounts. Report any defects.","Check condition of all insulation and covering (on hot water piping), paying particular attention to the integrity of the vapour seal reports any defects.","Check operation of valves, stop cocks, drain cocks, etc. Valves should be fully closed then fully opened (Note the number of turns to fully close, so that valve can be reset to its original position). If operation of valve is stiff, lubricate as necessary, repeat opening and closing until clear, and then return valve to its original position. Report any irregularities.","Examine all valve glands packing for leakage and adjust or repack as required."],"Annually":["Carry out tasks as detailed for Quarterly.","Check pipe work identification tags remain secure, report any defects.","Check for integrity of fire stopping where pipes pass through walls etc. report any defects."]}},"ME-44":{"name":"Rain Water, Sanitary Drainage and Vent Systems","frequencies":{"Bi-Annually":["Check security of wall fixings and pipe joints.","Check connections to outlets (floor drains, roof drains etc…) for fixings and leakage. Re-fix if necessary.","Check exposed pipes for cracks or leaks, and report any defects.","Check drain connections and access plates for leaks and report all defects.","Remove roof vent cowls where fitted, clean and replace.","Remove all silt, dirt and debris from outlets and check joints for signs of leakage and report all defects.","Flush out installation and inspect for leaks. Report any damage to walls and structure.","Inspect all cleanouts and access covers for leakage around joints. Report on all defects.","Inspect ceiling hangers; tighten loose bolts insuring slope. Report condition of hangers.","Report all items requiring remedial works.","Check all branch waste and drain connections for blockage. Repair and report as necessary.","Remove grating or access plates where fitted.","Clean any silt build up from pipe and traps.","Replace grating or cover. Inspect and report on all defects."],"Annually":["Carry out tasks as detailed for Bi-annually.","Inspect manholes and catch pits.","Remove manhole or catch pit cover and provide warning signs and barriers to prevent public injury.","Remove all grease or silt build-up within manhole or catch pit and flush out.","Rod through and hose drain runs as required and check flow throughout, advise on condition of installation.","Examine step irons, where fitted, and report on security and condition.","Remove rodding eye cover plates to branch drain connections, where fitted. Check for and remove any obstructions. Replace rodding eye cover plates and replace any damaged gaskets.","Clean covers and frames; clean out lifting keyholes and wire brush to remove rust and scale.","Re-grease manhole or catch pit cover and frame. Replace or refit gaskets, where fitted, and refit cover. Ensure that all covers have correct sealing.","Inspect and report all defects.","Report any evidence of vermin infestation."]}},"ME-45":{"name":"Plumbing Fixtures","frequencies":{"Monthly":["Flush all WC’s to provide a change of water.","Check for any defects in flush mechanisms and drainage. Report any defects.","Examine hose bib gland packing; adjust or repack as required. Check free travel of valve. Lubricate valve stem. Check hose for cracks & leakage. Repair or replace defective items.","Run hot and cold taps for a minimum of 1 minute to ensure full change of water in supply systems.","Check for any defects in drainage system. Report any defects.","Flush all urinals","Check for any defects in drainage. Report any defects.","Clean stainless steel and bronze tone surfaces with mild detergent and water. Wipe dry with a soft cloth.","Check water flow for clogging or blockage. Repair waterline regulation by removing mineral deposits from the orifice with a small round files not over 1/8” diameter or small diameter wire. If orifice is clean purge air from all water lines (steady stream assures all air is removed). Replace orifice if necessary.","Check bubbler streams height. Adjust height by inserting screw driver blade into bubbler cartridge adjusting screw and turn to modify stream height. If the stream height has not been modified clean bubbler cartridge assembly.","Clean cabinet side louvers at outlet side of condenser.","Clean condenser fins with a brush, air hose or vacuum cleaner.","Check all connections for leaks.","Check electrical connections. Tighten if necessary.","Check voltage and amperage. Report any significant error."],"Quarterly":["Carry out tasks as detailed for Monthly.","Strip, thoroughly clean and sterilise all shower head(s) and pipe work in a solution of 50 PPM free chlorine, upon re-assembly replace any faulty or damaged parts and ensure correct operation.","3.00 Run each hot shower for 15 minutes to ensure removal of any contamination."],"Bi-Annually":["Carry out tasks as detailed for Quarterly.","Remove access panel to flush tank (if fitted).","Check tightness of seat and flap securing bolts for European water closets and adjust as required.","Flush and check all round bowl rim action, report any defects.","Check action and ensure correct operation of flush tank.","Test and ensure satisfactory operation of tank fill times, correct water level, and correct flush time per unit.","Check security of all fixings and brackets.","Examine joint seal between pan and flush pipe and between pan and drain, report on condition.","Test and report on condition of siphon assembly, advise on the necessity for any remedial works.","Check floor connection, ensure stability of all fixings, and carry out adjustments or repair as necessary.","Report any damage to sanitary ware and all associated equipment.","Examine and ensure correct operation of taps, mixer taps assemblies, wastes and overflows.","Ensure correct operation of tap closure and free spindle movement. Replace any defective tap washers or seals as necessary.","Replace or take up any valve gland seals as required.","Examine and check for correct fitting of plug, chain or other outflow control device, adjusting or advise on the necessity to replace any faulty items.","Check rate of outflow and operation of overflow, if sluggish clean the traps and associated pipe work. Replace by new seals as necessary.","Examine and ensure security of fixings, carry out adjustments or repairs as necessary.","Report any damage to sanitary ware and all associated equipment.","Remove trap, clean and replace with new seals as necessary.","Check plug fit and security of chain.","Check drain down rate and drain off rate of overflow.","Operate taps; confirm shut off and freedom of spindle movement. Replace washers or seals as necessary.","Inspect and report on all defects."],"Annually":["Carry out tasks as detailed for Bi-annually.","Examine and ensure integrity of the shower unit fixings, repairing any defects as necessary.","Examine the valve assembly(s), replacing any defective seals. Testing and ensuring correct operation of mixer if applicable.","Examine the flexible and associated pipe work, replacing if defective the hose and/or washers.","Test the rate of drain outflow, if slow strip and clean shower drain trap.","Inspect and report on all defects."]}},"ME-46":{"name":"FM200 Suppression System","frequencies":{"Weekly":["Check FM 200 cylinder’s pressure. If pressure gauge indicates a pressure loss of more than 10% (after adjusting for temperature), then recharge the cylinders.","Check for rust and/or corrosion of any part of the system. Clean and repaint the rusty or corroded element immediately."],"Monthly":["Carry out the tasks as detailed for Weekly.","Inspect all components of the system for damage or missing parts. Repair and/or replace as necessary.","Ensure access to hazard areas, manual pull stations, discharge nozzles and cylinders are not obstructed. Remove unacceptable obstruction.","Check FM-200 cylinder weights and pressures.","Inspect the flexible actuation hoses for loose fittings, damaged threads, cracks, distortions, cuts, dirt and frayed wire braid. Tighten loose fittings; replace hoses having stripped threads or other damage. Clean parts as necessary. Inspect adapters, couplings and tees at cylinder pilot outlets for tightness. Tighten coupling of necessary. Replace damaged parts.","Inspect cylinder pressure operated control heads for physical damage, deterioration, corrosion, distortion, cracks, dirt and loose couplings. Tighten loose couplings. Replace damaged caps. Replace control head if damage is found. Clean if necessary.","Inspect cylinder electric control head/s for physical damage, corrosion or dirt. Check control head/s flexible electrical line for wears and damage. Check control head/s for loose coupling. If necessary, tighten coupling. Check that indicator is in “SET position, pull pin is installed in manual lever, and seal wire is intact. Replace control head if damage. Clean if necessary.","Inspect cylinder and valve assembly for leakage, physical damage such as cracks, dents distortion and worn parts. Check burst disc and pressure gauges for damage. Replace damaged gauges or burst disc if necessary. If gauge pressure is not normal, remove and recharge the cylinder or cylinder valve, replace the cylinder. Clean the cylinder and associated parts as directed by the manufacturer.","Inspect cylinder brackets, straps, cradles and mounting hardware for loose, damaged or broken parts. Check these parts for corrosion, oil, grease, grime, etc. Tighten loose hardware. Replace damaged parts. Clean if necessary.","Inspect flexible discharge hoses for loose fittings, damaged threads, cracks, rust, kinks, distortion and frayed wire braid. Tighten loose fittings and repair hoses with stripped threads. Clean if necessary.","Inspect discharge nozzle for dirt and physical damage. Replace damaged nozzles. Clean as directed by the manufacturer.","Inspect pull stations for cracks, broken or cracked glass plate, dirt or distortion. Replace damaged glass. Replaced station if damage is found. Clean if necessary.","Inspect pressure switches for deformations, cracks or other damage. Replace switch if damage is found. Clean if necessary.","Check for physical damage and/or missing items. Repair and/or replace as necessary."],"Bi-Annually":["Carry out the tasks as detailed for Monthly.","Test pressure switches as directed by the manufacturer.","Test electrical control heads as directed by the manufacturer.","Carry out the tasks as detailed for Bi-annually.","Blow out distribution piping as directed by the manufacturer.","Carry out the tasks as detailed for every 2 years.","Performed a hydrostatic pressure test for the cylinders and flexible hose. Follow the manufacturer’s instructions regarding the results of test/s."]}},"ME-47":{"name":"Water Fire Fighting Pipe work including Zone Valves, Landing Valves, and multiple Jet Controls","frequencies":{"Quarterly":["Check and ensure that valves are fully open and all control test and isolating valves are in correct operating position.","Check and ensure that valves and test valves are secure by straps and locks, replace any damaged or deteriorating items.","Remove and clean water alarm motor strainer, check for and rectify any leaks on re-instalment; renew seals and gaskets as required.","Carry out sprinkler alarm test by first seeing that the valves are fully open and opening the test valve. Note time taken for the alarm to sound. Allow the alarm to ring for approximately 30 seconds to ascertain that it is not ringing intermittently, adjust/repair as necessary.","Examine gate, all test, drain, control and isolating valves, ensure full and free travel, checking for leakage, adjust or repack valve glands as required, clean, remove all deposits and lubricate valve stem.","Test and ensure the security of all pipe brackets and supports.","Check the glass bulb of the jet controls. Repair or replace as necessary.","Provide a test certificate giving details of all test and inspections carried out together with details of any defects noted and remedial action taken. The person carrying out the particular task must sign the record.","Check and ensure correct operation of all flow alarm switches, actuators, supervisory switches.","Check all terminal connection. Repair as necessary.."],"Annually":["Carry out tasks as detailed for Quarterly.","Clean all components of zone valve. Check paint work for corrosion. Clean and repaint as necessary.","Examine and report on condition of all associated wiring. Ensure security of terminals.","Carry out insulation resistance and earth continuity tests. Record results","Carry out tasks as detailed for Annually.","Check and overhaul all valves.","Flush out pipe work and report any solid contamination or corrosion encountered"]}},"ME-49":{"name":"Portable and Automatic Fire Extinguishers","frequencies":{"Safety Precautions":["Extinguishing powder extinguishers should be opened only in a dry room, and for the minimum time necessary for examination, to minimize the effect of atmospheric moisture on the powder.","Only extinguishers containing the same type of extinguishing powder should be opened and examined at any one time, and the examination should be carried out in a clean room using clean dry receptacles. All traces of extinguishing powder should be removed before using the receptacle again.","Hydrostatic proof pressure testing must only be performed with the container suitably bunkered to prevent damage to equipment and bodily injury in the event of container failure. Observe all safety precautions, regulations and practices when working with pressurized equipment. Qualified personnel in accordance with CGA pamphlet C-1 and NFPA-10 should perform testing.","Before servicing and recharging, ensure cylinder is completely depressurized by activating cylinder valve and then slowly opening discharge valve.","The charging system must be used and inspected frequently to ensure that all components function properly and accurately. Use of any other charging system can cause property damage, serious bodily injury, or both."],"Monthly":["Ensure that fire extinguishers are located in their proper position, and are not discharged, lost pressure, or suffered obvious damage, by checking the following: - Hose and nozzle for obstruction (for portable). - Tamper seal to be intact. - Extinguisher body externally for corrosion. - Pressure gauge reading19, or alternatively weigh the unit and compare weight with the data on extinguisher label. Replace defective fire extinguishers."],"Annually":["Carry out tasks as detailed for Monthly.","Examine the extinguisher body externally using an illuminating probe. A corroded or damaged extinguisher should be taken out of service and replaced by a serviced extinguisher.","Examine and verify that the pressure-indicating device is reading the internal pressure correctly.","Examine the nozzle and hose for blockage and clean if necessary (for portable).","Examine the hose for wear and replace if not in good condition (for portable).","Check the operating and discharge mechanism. Rectify or replace if necessary. Replace the safety clip or fit new wire seal.","Examine and unblock the vent holes in the cap, if necessary.","Examine condition of all washers; replace if not in good condition.","Complete date and sign record card on cylinder.","Check charge date. If more than five years have elapsed, dispose contents in an appropriate manner. Perform a hydrostatic test on cylinder. Recharge extinguisher in accordance with the manufacturer's recommendations."]}},"ME-50":{"name":"Fire Sprinklers","frequencies":{"Safety Precautions":["It is recommended that a qualified inspector inspect the water spray fixed systems for fire protection."],"Quarterly":["Examine all sprinkler heads associated pipe work connections for leaks. Repair as required.","Examine sprinkler heads. Replace sprinklers showing signs of corrosion; ensure that all heads have correct freedom of action, report condition. Ensure a minimum of 500-mm clear space in areas of high piled combustible stock and report.","Clean and remove all dust and dirt from sprinkler heads, advise on all sprinkler heads, which have been painted.","Examine and ensure sprinkler-working pressures are being maintained.","Provide a test certificate giving details of all test and inspections carryout together with details of any defects noted and remedial action taken. The person carrying out the particular task must sign the record."]}},"ME-51":{"name":"Fire Hose Reel","frequencies":{"Safety Precautions":["Extinguishing powder extinguishers should be opened only in a dry room, and for the minimum time necessary for examination, to minimize the effect of atmospheric moisture on the powder.","Only extinguishers containing the same type of extinguishing powder should be opened and examined at any one time, and the examination should be carried out in a clean room using clean dry receptacles. All traces of extinguishing powder should be removed before using the receptacle again.","Hydrostatic proof pressure testing must only be performed with the container suitably bunkered to prevent damage to equipment and bodily injury in the event of container failure. Observe all safety precautions, regulations and practices when working with pressurized equipment. Qualified personnel in accordance with CGA pamphlet C-1 and NFPA-10 should perform testing.","Before servicing and recharging, ensure cylinder is completely depressurized by activating cylinder valve and then slowly opening discharge valve.","The charging system must be used and inspected frequently to ensure that all components function properly and accurately. Use of any other charging system can cause property damage, serious bodily injury, or both."],"Monthly":["Initiate a field survey on all fire hose reels, to visually inspect obvious damages. Report and repair defects. Repair as necessary.","2.00 Ensure that fire extinguishers are located in their proper position, and are not discharged, lost pressure, or suffered obvious damage, by checking the following: - Hose and nozzle for obstruction. - Tamper seal to be intact. - Extinguisher body externally for corrosion. - Pressure gauge reading, or alternatively weigh the unit and compare weight with the data on extinguisher label. Replace defective fire extinguishers."],"Bi-Annually":["Carry out tasks as detailed for Monthly.","Examine and report on the condition of each hose and reel assembly. Repair as needed.","Check and report on the condition of unit, ensuring stability and security of fixings, advising on the necessity to replace any faulty components.","Inspect and report on nozzle conditions, ensure correct operation, advise on units damaged or requiring replacement.","Pull out the hose to its full extension, ensure correct operation of valve, check for and rectify any leaks, report condition.","Flush through the discharge a quantity of water, check and report flow rate. Ensure that flow rate is adequate and equals or exceeds design criteria.","Check operation of pressure restricting angle valve. Check for leakage. Adjust or repack valve as necessary.","Check operation of flow switches, repair or adjust any faulty operation.","Test all manually operated valves for full and free travel. Check for leakage. Adjust and repack valve glands or replace valve seals as required. Clean and remove all deposits. Lubricate as necessary.","Reset valves and hose rack. Leave in full working order. Indicate on each hose rack label date of test.","Clean and inspect surface and door of the fire hose cabinet. Report on condition.","Check glass for cracks. Replace any damaged door."],"Annually":["Carry out tasks as detailed for Bi-annually.","Examine the extinguisher body externally using an illuminating probe. A corroded or damaged extinguisher should be taken out of service and replaced by a serviced extinguisher.","Examine and verify that the pressure-indicating device is reading the internal pressure correctly.","Examine the nozzle and hose for blockage and clean if necessary.","Examine the hose for wear and replace if not in good condition.","Check the operating and discharge mechanism. Rectify or replace if necessary. Replace the safety clip or fit new wire seal.","Examine and unblock the vent holes in the cap, if necessary.","Examine condition of all washers; replace if not in good condition.","Complete date and sign record card on cylinder.","Check charge date. If more than five years have elapsed, dispose contents in an appropriate manner. Perform a hydrostatic test on cylinder. Recharge extinguisher in accordance with the manufacturer's recommendations."]}},"ME-52":{"name":"Liquefied Petroleum Gas System (Including Piping and Valves)","frequencies":{"Safety Precautions":["Following the manufacturer’s instructions and warnings is mandatory for personnel involved in the operation and maintenance of this system.","Do not try to inspect the system before reading thoroughly the safe handling procedures described by the manufacturer.","The involved personnel should use the properly applied standard safety equipment.","The persons doing this job are qualified to administer artificial respiration. A fresh air mask and associated equipment to provide air should be available at the job site.","Pipe coating personnel should wear proper apparel. Neoprene-coated canvas gloves with tight wrists, an oil cloth or leather apron, high shoes, goggles, and a cartridge respirator are recommended.","Maintenance team should be equipped with appropriate equipment, handtools, gas stopping devices, fittings, leak repair clamps, handfire extinguishers, first aid kits, instruments for locating pipe."],"Weekly":["Check Pressure regulating valves; ensure their proper functioning. Repair or replace as required."],"Monthly":["Carry out tasks as detailed for weekly.","Check for prevention and removal of stoppages: water, dusts, gums,","Check for prevention of overpressure conditions."],"Quarterly":["Carry out tasks as detailed for Monthly.","Check for the proper operation of plug valves. Repair or replace as necessary.","Check pipe connections for any sign of leakage. Repair as necessary.","Check and clean pressure gauges. Make sure that gauges registers/dials are legible. Repair or replace as necessary."],"Bi-Annually":["Carry out tasks as detailed for Monthly.","Check and ensure security of all fixings, brackets, framework and supports.","Check all component parts of gas system for damage. Replace any damaged items. Report any defects.","Check and ensure security of all pipe work.","Check and ensure security of all labels. Repair as necessary.","Report findings.","Check and ensure correct operation of all pressure switches, controls, solenoid control and valves. Replace defective items."]}},"ME-53":{"name":"Hot Water Storage Tanks","frequencies":{"Safety Precautions":["For your safety, be aware, this water tank is capable of producing hot water at temperature sufficient enough to cause scalding injury."],"Monthly":["Visually inspect external case and pipe work connections for leaks. Repair as required.","Drain out two gallons of water from the water heater to control the build up of sediment at the base of the storage tank.","Check pressure relief valve for correct operation. Ensure it is not blocked. Adjust settings. Replace valves suspected to malfunction during operation.","Check water temperature controls, and compare with thermostat. Adjust thermostat as necessary."],"Bi-Annually":["Carry out tasks as detailed under Monthly.","Examine the internal condition of the tank to be free from corrosion and deposits of scale. Report findings.","Test the relief valve on the vessel by raising the working pressure to the set pressure. Refer to manufacturer’s recommendations to perform this process.","Remove scale deposits on the tubes manually using “combing wire” or by chemical treatment. After de-scaling it is important to neutralise the trace of solution left on the battery with alkali.","Inspect level sensors for damages. Repair or replace if necessary","Examine all valves and all exposed pipe work for damage, repair any damage sections."]}},"ME-54":{"name":"Foam Fire Fighting Extinguishing System","frequencies":{"Weekly":["Check foam cylinder’s pressure. If pressure gauge indicates a pressure loss of more than 10% (after adjusting for temperature), then recharge the cylinders.","Check for rust and/or corrosion of any part of the system. Clean and repaint the rusty or corroded element immediately."],"Monthly":["Carry out the tasks as detailed for Weekly.","Inspect all components of the system for damage or missing parts. Repair and/or replace as necessary.","Ensure access to hazard areas, manual pull stations, discharge nozzles and cylinders are not obstructed. Remove unacceptable obstruction.","Check foam cylinder weights and pressures.","Inspect the flexible actuation hoses for loose fittings, damaged threads, cracks, distortions, cuts, dirt and frayed wire braid. Tighten loose fittings; replace hoses having stripped threads or other damage. Clean parts as necessary. Inspect adapters, couplings and tees at cylinder pilot outlets for tightness. Tighten coupling of necessary. Replace damaged parts.","Inspect cylinder pressure operated control heads for physical damage, deterioration, corrosion, distortion, cracks, dirt and loose couplings. Tighten loose couplings. Replace damaged caps. Replace control head if damage is found. Clean if necessary.","Inspect cylinder electric control head/s for physical damage, corrosion or dirt. Check control head/s flexible electrical line for wears and damage. Check control head/s for loose coupling. If necessary, tighten coupling. Check that indicator is in “SET position, pull pin is installed in manual lever, and seal wire is intact. Replace control head if damage. Clean if necessary.","Inspect cylinder and valve assembly for leakage, physical damage such as cracks, dents distortion and worn parts. Check burst disc and pressure gauges for damage. Replace damaged gauges or burst disc if necessary. If gauge pressure is not normal, remove and recharge the cylinder or cylinder valve, replace the cylinder. Clean the cylinder and associated parts as directed by the manufacturer.","Inspect cylinder brackets, straps, cradles and mounting hardware for loose, damaged or broken parts. Check these parts for corrosion, oil, grease, grime, etc. Tighten loose hardware. Replace damaged parts. Clean if necessary.","Inspect flexible discharge hoses for loose fittings, damaged threads, cracks, rust, kinks, distortion and frayed wire braid. Tighten loose fittings and repair hoses with stripped threads. Clean if necessary.","Inspect discharge nozzle for dirt and physical damage. Replace damaged nozzles. Clean as directed by the manufacturer.","Inspect pull stations for cracks, broken or cracked glass plate, dirt or distortion. Replace damaged glass. Replaced station if damage is found. Clean if necessary.","Inspect pressure switches for deformations, cracks or other damage. Replace switch if damage is found. Clean if necessary.","Check water connection."],"Bi-Annually":["Carry out the tasks as detailed for Monthly.","Test pressure switches as directed by the manufacturer.","Test electrical control heads as directed by the manufacturer.","Carry out the tasks as detailed for Bi-annually.","Blow out distribution piping as directed by the manufacturer.","Carry out the tasks as detailed for every 2 years.","Performed a hydrostatic pressure test for the cylinders and flexible hose. Follow the manufacturer’s instructions regarding the results of test/s."]}},"ME-55":{"name":"Fertilizer Injector","frequencies":{"Weekly":["Check overall visual inspection.","Record all data that maintenance was completed.","Check working order of pistons and piston motor by listening to the pumping sounds as it runs.","Check of proper suction of solution by listening to the clicking pistons and/or blue water from hose end.","Check dosing indicator for proper PPM's.","Check for leaks in the vicinity of the black nut under the body & between bell housing &body.","Check the inlet suction tube for air leaks.","Check that suction tube and strainer are not blocked or clogged with each change of stock tank.","Check that water flow is not flowing back into the stock container by watching level of stock. The suction tube may also be filled with water and not fertilizer.","Bleed air from unit with first use and after fertilizer stock tank change (This is done by slowly opening water supply valve and pressing black button on top after steady flow of water comes out slowly open water inlet valve to permitted maximum flow.)"],"Monthly":["Carry out tasks as detailed for weekly.","Check Bell housing for damage, proper positioning and presence.","Do not use tools when servicing or disassembling unit.","Rinse injection areas occasionally after using the unit (To do this, insert suction tube into container of clear water and inject for 3-5 minutes and Soak entire disassembled unit in soapy water prior to installing after non use period.)","Check and ensure correct operation of all flexible connections, repairing or advising on the necessity of replacing damaged components.","Check condition of all associated insulation and covering. Repair and report any defects.","Inspect all piping supports for soundness and effective support of load."],"Quarterly":["Carry out tasks as detailed for Monthly.","Check for contaminated, worn, or missing check valve parts and replace.","Check if check valve seal is present, is not dirty or worn.","Check if plunger seal is present, is not dirty or worn. Also check for wearing of injection stem as per Manufacturer’s recommendation.","Check that diffuser seal (in the body) is positioned correctly and is not damaged.","Check bell housing for damage, proper positioning and presence.","Check motor, injection, and dosing seals to ensure precise injection and replace as needed."],"Bi-Annually":["Carry out tasks as detailed for Quarterly."],"Annually":["Carry out tasks as detailed for Bi-Annually.","Check the filter for blockage, wearing or missing parts."]}},"ME-56":{"name":"Packaged Terminal Air-Conditioning Units","frequencies":{"As Required":["Disconnect the power supply to the unit whether for periodic inspections or emergency repairs."],"Weekly":["Inspect unit for any problems, including noise, sealing, leaks, insulation, bearings, drains, etc.","Examine the air filters; if clogged, clean or change the filters when the specific alarm comes on inspect for break up and correct sealing.","Check cleanliness of grilles (if fitted).","Inspect unit for any problems, including noise, sealing, leaks, insulation, bearings, drains…","Check fan mounting, cleanliness and operation.","Check operating pressures, if not correct check for leaks.","Check voltage and amperage. Record any error.","Visually check entire unit and ensure correct operation."],"Monthly":["Carry out tasks as detailed for Weekly.","Deleted.","Check drains and ensure they are clear.","Check that the electrical connection on motor and electric heater is tight.","Check pipe work and insulation condition and fixing.","Check operation of compressor crankcase heater according to manufacturer’s recommendations.","Check operation of all pressure switches and safety devices.","Check refrigerant temperatures.","Check if the flow of the condensate to the main drain is free. Repair or renew as required."],"Quarterly":["Carry out tasks as detailed for Monthly.","Check fan mounting, cleanliness and operation.","Check unit for rust especially around cooling and humidifying sections.","Check pipe work connections for leaks also condition of local insulation.","Check oil and eliminators if fitted, for built-up of dust, and scale in the case of the latter. Clean with stiff brush if dirty.","Isolate switch gears and controls and inspect contactors, relays etc. for signs of overheating or arcing.","Check operation of electric heater ME-15cut-out.","Check pressure drops air and compare with commissioning details","Check operation of all safety devices such as airflow switches etc.","Check electrical connections. Tighten if necessary.","Check condensing unit for rust. Clean as necessary.","Ensure that condenser section is free from dirt, debris. Clean and remove any debris.","Check compressor is securely fixed, anti-vibration mounts are tight and oil level is correct.","Examine fan and motor bearings for overheating adjust to ensure suitable lubrication according to manufacturer’s instructions."],"Bi-Annually":["Carry out tasks as detailed for Quarterly.","Clean unit inside and out with vacuum cleaner and wipe down with damp cloth. Rectify any paint damage externally."]}},"ME-57":{"name":"Oil Pits","frequencies":{"As Required":["Oil pits shall be inspected from time to time to ensure that the pit is clean and the covers are adequate and securely fixed and that there are no leakage or deterioration likely to result in leakage."]}},"ME-58":{"name":"Polyethylene Water Tanks","frequencies":{"As Required":["Polyethylene tank shall be inspected from time to time to ensure that overflow and warning pipes are clear from blockage. That covers are adequate and securely fixed and that there are no signs of leakage or deterioration likely to result in leakage.","Polyethylene tank storing more than 1000 litres of drinking shall be inspected at least once every six months, those storing less than 1000 litres drinking water at least once every year."]}},"ME-59":{"name":"Venturi Air Valve","frequencies":{"Quarterly":["Visually inspect entire unit, report on condition and carry out remedial works as required.","Check for undue noise, vibration or rattling. Report and adjust as necessary.","Ensure all brackets and fixings are secure. Check bolts for corrosion. Tighten and replace as necessary. Report on condition of supports.","Ensure all sensors and actuators are functioning correctly. Report and re-set as appropriate. Replace any defective item.","Inspect flexible connections for leaks. Re-tighten brackets or gaskets as necessary. Replace a defective connection.","Ensure rigidity and tightness of duct hangers. Tighten as necessary. Inspect condition of brackets, hangers and bolts. Report accordingly.","Inspect duct insulation paying particular attention to the vapour seal. Repair damaged areas.","Check the differential static pressure across the terminal from inlet to discharge outlet. If it exceeds the required value check for leaks","Check damper operation. Repair necessary. Refer to manufacturer instruction for performing this operation.","Examine and report on condition of all associated wiring facilities and wiring. Ensure security of termination."],"Bi-Annually":["Carry out tasks as detailed for Quarterly.","Clean out external and internal dust and dirt from the unit."],"Annually":["Carry out tasks as detailed for Bi-annually.","Check paint work for corrosion. If present determine and report cause. Clean, wire brush and repaint as necessary.","Check and calibrate all control devices."]}},"ME-60":{"name":"Medical Gas Cylinder","frequencies":{"As Required":["Following the manufacturer’s instructions and warnings is mandatory for personnel involved in the operation and maintenance of medical gas cylinders.","Do not try to inspect the cylinders before reading thoroughly the safe handling procedures described by the manufacturer.","The involved personnel should use properly applied standard safety equipment.","The persons doing this job are qualified to administer artificial respiration.","A fresh air mask and associated equipment to provide air should be available at the job site.","Maintenance team should be equipped with appropriate equipment, hand tools, gas stopping devices, fittings, leak repair clamps, hand fire extinguishers and first aid kits.","Cylinders should be stored in upright in a secure, weather proof, well ventilated area, never stored next to salt or corrosive chemicals or source of heat.","The cylinders should be secured by means of brackets, chains or belts above the midpoint but below the shoulder to prevent toppling.","Shall be stored so that cylinders are used in the order in which they are received, the cylinders should not be stored longer than one year without use.","The floor should be level and constructed of concrete or other non-combustible material.","Cylinders should not be picked up by the cap.","The store should have an adequate means of access, to facilitate delivery and collection of cylinders.","So far as practicable, lighting and electrical equipment should be sited in a safe position, remote from the cylinder storage.","The storage area should be clearly identified i.e. by use of compressed gases warning sign.","Lubricants should be avoided. Only lubricants that are made for oxygen service and specified by the equipment supplier should be used.","Always use clean hands or gloves when assembling oxygen equipment i.e. when changing cylinders.","Medical Gas Pressure Reducing Regulators should be handled with care and replaced every 5 years - sooner if damaged.","Separate or identify full and empty cylinders"],"Weekly":["Check flow meters, service valve, safety valves, pressure regulators for any sign of leakage. Repair as necessary and as recommended by manufacturer.","Clean pressure gauges, form dust, dirt, and make sure gauges registers are legible. Repair or replace gauges as required."],"Monthly":["Carry out tasks as detailed for weekly.","Check pipe connection for any leakages. Repair as necessary.","Check the integrity of the cylinders’ shed. Repair and paint as necessary."],"Bi-Annually":["Carry out tasks as detailed for Monthly.","Check and ensure security of all fixings, brackets, framework and supports.","Check all component parts of gas system and cylinders for damage, replace any damaged items. Report any defects.","Check and ensure security of all pipework.","Check for leak prevention, leak detection followed by repair or replacement. Follow the manufacturer’s instructions regarding the methods.","Check and ensure security of all labels. Repair as necessary.","Check the cylinders for corrosion. Repair paint as recommended by supplier/manufacturer.","Report finding."]}},"ME-61":{"name":"Vacuum Unit and Accessories","frequencies":{"Safety Precautions":["When switch is in \"OFF\" position, portion of control circuit remain energized. Disconnect power to the dryer before performing maintenance. Lock out power at main panel, and then wait ten minutes before servicing.","Do not remove the covers, loosen or remove any fittings, connections or devices when this unit is in operation. Liquid and air under pressure that are contained within this unit can cause severe injury or death.","The vacuum unit has high and dangerous voltage in the motor, the starter and control box. Before working on the electrical system, be sure to remove voltage from the system by use of a manual - disconnect - switch.","Before doing any mechanical work on the system. a) Shut the unit down b) Electrically isolate the unit by use of the manual disconnect switch in the power line to the unit. Lock and tag the switch so that it cannot be operated c) Blow down the compressor and isolate the unit from any source of air.","Use only safety solvent for cleaning the vacuum unit and auxiliary equipment.","Always replace covers and guards, after maintenance functions are completed."],"Daily":["Decant off the liquid in canister prior to operate the vacuum system."],"Weekly":["Carry out tasks as detailed for Daily.","Check for leaks in the amalgam collector, dispose of amalgam as required by the manufacturer manual."],"Monthly":["Examine pressure gauges for correct operation adjusting line pressure to correct pressure if necessary.","Examine connections for leaks; treat as specified in the manufacturer manual.","Clean the unit from accumulated dust and dirt.","Check collection trap and clean as stated by the manufacture manual.","Check for leaks in the amalgam collector, dispose of amalgam as required by the manufacturer manual.","Check pressure switches on receiver for correct settings.","Check high air temperature and sensor switch for correct operation. Repair and report as necessary."],"Quarterly":["Carry out tasks as detailed for Monthly.","Examine and ensure all safety guards are secure.","Examine intake/outlet filter(s), report on condition, replace if exhausted.","Ensure that the vacuum, motor and ancillary equipment is left in clean condition.","Examine all pipework for condition, ensure security and rectify any leaks.","Examine valves and cocks, adjust as necessary and repack as required.","Inspect vacuum unit and report any excessive noise or vibration,","Check and ensure correct operation of motor starter."],"Annually":["Carry out tasks as detailed for Quarterly.","Test and ensure safety valve operations at prescribed pressure, adjusting as required replacing any faulty/missing items.","Examine compressor/motor bearings for wear, reporting on their condition.","Clean the complete unit, de-rust and repaint as necessary.","Check that the regulating system operates properly, cleaning and adjusting as necessary.","Examine and ensure that motor ventilation airways are clear and remove all dirt/dust by vacuum cleaner.","Wipe down all panels/casing and report on their condition.","Clean out external and internal dust from the vacuum unit and control panel.","Check all paintwork for corrosion, if present determine and report on cause, clean and repaint as necessary.","Check that regulating system operates correctly, cleaning and adjusting as necessary.","Inspect all receiver, pipework and equipment supports for tightness and security and report.","Examine and report on the condition of all associated wiring and ensure security of terminations.","Carry out insulation resistance and earth continuity tests and report results.","Inspect starter contactors.","Fit test gauges and calibrate all safety switches/devices.","Test and ensure correct operation of all indicator lamps, replacing any faulty components.","Test and ensure that all pressure controls and associated components are operating correctly. Re-calibrate as required logging all settings."]}},"ME-62":{"name":"Steam Humidifier","frequencies":{"Safety Precautions":["Review the manual before you start the service process.","Once the unit is installed and prior to start up, disconnect the water line. Turn on the water supply and flush the line into a bucket. Reconnect the water line."],"Bi-Annually":["Examine and ensure correct operation of the unit. Report any damage.","2.00 Unplug the power cord from the source and allow the water to cool for at least 30 minutes prior to removal.","3.00 Turn off the water supply at the saddle tapping valve.","4.00 Remove the cable assembly wire plug from the top of the control housing. Drain the water with the manual drain valve. NOTE: The drain valve will be hot if the humidifier has not been allowed to cool.","Disconnect the water and drain lines. NOTE: Some water may drain out of the water line. Have a small container ready to catch the water. NOTE: Although the water has been drained, some water may still remain in the humidifier reservoir along with sediment. Be careful not to tip the unit over when removing it from the duct.","Scrape all mineral deposits from the baffle and wash baffle off.","Remove the Anode from the baffle plate and replace. Operating the unit without the Anode will degrade the performance and increase maintenance.","Use a putty knife to scrape the minerals from the sides and bottom of the water reservoir. DO NOT scrape on the small temperature probe, or the heater element. Use a soft emory cloth or stiff nylon brush. If necessary, fill the tank with vinegar and let it sit for several hours or even overnight allowing the scale to soften and making it easier to remove.","Carefully scrape the Water Level Probe to remove mineral deposits. Use soft emory cloth if necessary. Clean the Water Probe Insulator, inside the pan, with a cloth and 50-50 mixture of water and vinegar, rinse with fresh water. Inspect for any mineral deposits on the insulator. Repeat cleaning if necessary and thoroughly dry.","Use a small nylon brush to clean deposits off the heater element and thermistor probe. Be careful not to damage any of the components.","Rinse out the reservoir. Be careful to keep water off of the wiring compartment and the front cover of the humidifier.","Allow the unit to dry thoroughly before using, reinstall the tank baffle and tighten the screws. Re-install the unit in the duct and connect the water line and the drain lines.","Turn on the water supply. Inspect the water connections and drain fittings for leaks.","Test and ensure correct operation of controllers and associated components. Adjust or recalibrate as necessary."]}},"ME-63":{"name":"Water Tanks","frequencies":{"Monthly":["Visually inspect external case and pipe work connections for leaks. Repair as required.","Drain out two gallons of water from the storage tank to control the build up of sediment at the base of the storage tank.","Check overflow valve for correct operation. Ensure it is not blocked. Adjust settings. Replace valves suspected to malfunction during operation.","Replacement of filters when pressure drop exceeds limits. Refer to manufacturer handbook."],"Bi-Annually":["Carry out tasks as detailed under Monthly.","Examine the internal condition of the tank to be free from corrosion and deposits of scale. Report findings.","Inspect level sensors for damages. Repair or replace if necessary.","Examine all valves and all exposed pipe work for damage, repair any damage sections."]}},"ME-64":{"name":"RODI Unit/Carbon Filters","frequencies":{"Monthly":["Replacement of the tank vent filter on a monthly basis.","Replacement of cartridge filters when pressure drop exceeds 10% as compared to start-up value.","Replacement of chlorine removal carbon filters when breakthrough chlorine tests reveal any residual chlorine. The carbon filter cartridge should be changed at least every six months regardless of test results.","Replacement of RO membrane when differential pressure increases by more than 10 psi as compared to start-up value. It is not recommended to clean the RO membrane because dangerous chemicals and cumbersome cleaning equipment are required.","Replacement of both UV lamps after every 7,500 hours of use, or one year, whichever occurs first.","Inspection and cleaning of quartz UV lamp sleeves once per year."]}},"ME-65":{"name":"Condensate Return Unit","frequencies":{"Monthly":["Check pump operation via control panel. Report findings.","Check pump operation for undue noise and vibration. Report findings.","Check bearing temperature with an accurate temperature device; ensure it is below 180°F20. If hot inspect for over lubrication or misalignment.","Check the direction of rotation.","Check grease lubricated bearings for moisture and oxidation. If any contamination is present, remove and clean bearings. Grease up again with the proper type grease as recommended by the manufacturer.","Inspect bearings as per Manufacturer’s recommendation.","Ensure correct operation of all control panel indicator lamps. Replace any faulty lamp as necessary.","Deleted.","Tighten all terminal connections and main cable in the motor and pro-star."],"Quarterly":["Carry out tasks as detailed for Monthly.","Check for leaks at fittings and around flanges and connections. Repair any leak and replace any defective part.","Examine and test for full and free travel, checking for any leakage.","Check the screen of the strainer for build-up of solid material. Clean as required.","Check operation of valves. Valves should be fully closed then fully opened (Note the number of turns to fully close, so that valve can be reset to its original position). If operation of valve is stiff, lubricate as necessary, repeat opening and closing until clear, and then return valve to its original position.","Ensure correct operation.","Check for inadequate suction, discharge and shut-off heads against commissioning data. Pump and motor assemblies shall be mounted on top of receiver so that they can be removed for inspection without draining the receiver.","Check for inadequate lubrication and overheated bearings21. Inspect lubricating system. Repair as necessary.","Check grease lubricated bearings for saponification. Inspect grease for whitish colour. If this occurs, wash bearings with a bearing cleaning solvent and replace the grease with the proper type as recommended by the manufacturer.","Check for end play of shaft. Report on condition, and advise on any necessary remedial work.","Check for presence of dirt, moisture and other accumulations. Clean as necessary.","Check for noisy running. Determine cause & repair as necessary.","Check holding down bolts for rigidity and security.","Check for evidence of strain on pipes and pump casing.","Check and ensure correct operation of all flexible connections, repairing or advising on the necessity of replacing damaged components.","Check condition of all associated insulation and covering. Repair and report any defects.","Inspect all piping supports for soundness and effective support of load.","Check and record motor running current22.","Inspect and tighten the electrical terminals of condensate unit.","Check wiring insulation & flexible connections. Secure & tighten as required.","Check high discharge pressure switch and calibrate if necessary."],"Bi-Annually":["Carry out tasks as detailed for Quarterly.","Check shaft or shaft sleeve for scoring and eccentricity. Repair or replace as necessary.","Check / Tighten main cable terminal connections and monitoring / sensing circuits at the RTD terminal on the motor and in the pro-star relay all through."],"Annually":["Carry out tasks as detailed for Bi-Annually.","Calibrate all pressure and temperature gauges.","Check and tighten as required, report on condition of holding down bolts.","Remove rotating element and inspect for wear. Replace defective parts.","Clean out stuffing box piping. Remove any deposit or scaling.","Check seals and bearings for any damage. Adjust or replace as necessary.","Inspect pump casing and report any defect.","Test IR insulation resistance of stator windings, between phases and phase to earth using a 2500V megaohmmeter (preferably motor driven) for 60 sec. immediately after the shut down of the machine, whilst the windings are hot and dry. The temperature should be recorded and IR measurements converted to a base temperature for future comparison. Always disconnect all voltage sources, surge arrestors, capacitors, or other low insulation sources before making a test. Lead-in cables can be tested as pa","Clean dust and dirt on the motor stator.","Examine and report condition of all associated wiring facility and wiring, ensuring security of termination.","Inspect and clean all circuit breaker contact surfaces.","Check and clean enclosures, switches and push buttons.","Carry out tasks as detailed for Annually.","Clean out and renew the grease. An un-vented bearing should be packed only half full. (Sealed bearings need no attention for 5 years.)","Retighten all connections and test."]}},"ME-66":{"name":"Waste Anesthezing Gas Disposal Unit","frequencies":{"Daily":["Daily inspections shall be made during each shift for the following: • Leaks from gas supply lines and connections. • Leaks within the anesthesia machine and breathing System. • Leaks from flow meters and vaporizers. • Leaks between subject and facemask. • Leaks from around the tracheal tubing • Leaks from breathing bags and pop-off valves. • Spills of liquid anaesthetics."]}},"ME-67":{"name":"Gas System","frequencies":{"Safety Precautions":["Following the manufacturer’s instructions and warnings is mandatory for personnel involved in the operation and maintenance of this system.","Do not try to inspect the system before reading thoroughly the safe handling procedures described by the manufacturer.","The involved personnel should use properly applied standard safety equipment.","The persons doing this job are qualified to administer artificial respiration. A fresh air mask and associated equipment to provide air should be available at the job site.","Pipe coating personnel should wear proper apparel. Neoprene-coated canvas gloves with tight wrists, an oil cloth or leather apron, high shoes, goggles, and a cartridge respirator are recommended.","Maintenance team should be equipped with appropriate equipment, handtools, gas stopping devices, fittings, leak repair clamps, handfire extinguishers, first aid kits, instruments for locating pipe."],"Weekly":["Check filler valve, service valve, safety valves, rain plug pressure regulators for any sign of leakage. Repaire as necessary and as recommended by manufacturer.","Clean pressure gauges, level gaunes form dust, dirt, and make sure gauges registers are legible. Repair or replace gauges as required."],"Monthly":["Carry out tasks as detailed for weekly.","Check pipe connection for any leakages. Repair as necessary.","Check the integrity of the gas tank shed. Repair, point, structure as necessary."],"Bi-Annually":["Carry out tasks as detailed for Monthly.","Check and ensure security of all fixings, brackets, framework and supports.","Check all component parts of gas system for damage, replace any damaged items. Report any defects.","Check and ensure security of all pipework.","Check for leak prevention, leak detection followed by repair or replacement. Follow the manufacturer’s instructions regarding the methods.","Check and ensure security of all labels. Repair as necessary.","Check the gas tank shell for corrosion. Repair paint as recommended by supplier/manufacturer","Report finding."]}},"ME-68":{"name":"Electric Water Heaters","frequencies":{"Safety Precautions":["For your safety, be aware, this water heater is capable of producing hot water at a temperature sufficient enough to cause scalding injury.","Hydrogen gas can be produced in a hot water system served by this heater that has not been used for a long period of time (generally two weeks or more). Hydrogen gas is extremely flammable. To reduce the risk of injury under these conditions, it is recommended that the hot water faucet be opened for several minutes, before using any electrical appliance connected to the hot water system. If hydrogen is present, there will probably be an unusual sound such as air escaping through the pipe as the"],"Monthly":["Visually inspect external case and pipe work connections.","Drain out two gallons of water from the water heater to control the build up of sediment at the base of the storage tank.","Check pressure relief valve for correct operation. Ensure it is not blocked. Adjust settings. Replace valves suspected to malfunction during operation.","Check water temperature controls, and compare with thermostat. Adjust thermostat as necessary.","Check temperature setting of the high temperature cut-out."],"Annually":["Carry out tasks as detailed under Monthly.","Check valves operation. Ensure full and free travel. Lubricate as necessary. Ensure shut off valve to be open during operation.","Drain the heater until water runs clear to avoid noisy operation and lime and sediment build-up.","Check electrical supply rating to be correct."]}},"ME-69":{"name":"Pipes for Potable Water Network","frequencies":{"Biweekly and upon Consultant Instructions":["Water quality testing to be undertaken to the potable water network. It should be carried out at least once every two weeks and within the limits specified by the WHO standards or by relevant codes. Samples are to be taken variously, but not limited to the following locations: downstream the potable water ground tanks, downstream the elevated tank, and in various locations in the network.","Assess the collected data and if water quality issues arise, take appropriate measures in coordination with the contractor to find the source and solutions to the problem and then disinfect all the potable water pipes and facilities","Check visually for leakage by walking along pipe routing.","If defects are detected, such as sunken or flooded areas or ground cracks along pipelines route, take appropriate measures in coordination with the consultant.","Replace broken pressure pipes as detailed in exhibit.","Flush and disinfect pipes after repairs. A minimum velocity of 0.8m/s has to be attained in all pipes to be flushed according to the AWWA manual M3 for distribution main flushing and cleaning. Follow the latest AWWA C-651 standards and/or local country codes for water mains disinfection.","Keep complete records as detailed in exhibit 1.","Check all exposed pipe work and connections for leakage or damage.","Report defects and repair as necessary in coordination with the Consultant. Flush and disinfect pipes after repairs if found necessary.","Keep complete records as detailed in exhibit 1."]}},"ME-70":{"name":"Directly  Buried  Gate  Valve  for  Potable  water,\nDrinking   water,   Irrigation   (main   lines),   Internal Firefighting, and External Firefighting Networks","frequencies":{"Bi-Annually":["Check operation of gate valves. Valves should be fully closed then fully opened, (note the number of turns to fully close, so that valve can be reset to its original position).","If operation of valves is stiff, clean the valve threads from foreign debris, lubricate as necessary, repeat opening and closing until clear, and then return valve to its position. Report any irregularities.","Fully opened valves should not be jammed-tight on the backseat. Always back-off a quarter turn from the fully opened position.","Examine all valves for leakage and adjust as required.","Clean buried gate valves surface box cover and wire brush to remove rust. Re-grease to ensure smooth opening and locking of cover. Adjust cover height to match with ground level, where applicable.","Keep complete records as detailed in exhibit 1."]}},"ME-71":{"name":"Isolation, Washout, and Combination Air Valves in Chambers   for   Potable   water,   Drinking   water, Irrigation  (main  lines),  Internal  Firefighting,  and External Firefighting Networks","frequencies":{"Bi-Annually":["Inspect from surface to detect any possible problems such as: • condition of the cover, including defects such as signs of rocking, and frame leakage, • cover above or below the pavement level.","If operation of valves is stiff, clean the valve threads from foreign debris, lubricate as necessary, repeat opening and closing until clear, and then return valve to its position. Report any irregularities.","Fully opened valves should not be jammed-tight on the backseat. Always back-off a quarter turn from the fully opened position.","Examine all valves for leakage and adjust as required.","Keep complete records as detailed in exhibit 1."],"Annually":["Remove cover and provide warning signs and barriers to prevent public injury."]}},"ME-72":{"name":"Isolation, Washout, and Combination Air Valves in Utility  Tunnel  for  Potable  water,  Drinking  water, Irrigation  (main  lines),  Internal  Firefighting,  and External Firefighting Networks","frequencies":{"Monthly":["Check operation of gate valves. Valves should be fully closed then fully opened, (note the number of turns to fully close, so that valve can be reset to its original position).","If operation of valves is stiff, clean the valve threads from foreign debris, lubricate as necessary, repeat opening and closing until clear, and then return valve to its position. Report any irregularities.","Fully opened valves should not be jammed-tight on the backseat. Always back-off a quarter turn from the fully opened position.","Examine all valves for leakage and adjust as required.","Open the washout valve until getting clear water to the nearest tunnel washout sump.","Keep complete records as detailed in exhibit 1."]}},"ME-73":{"name":"Elevated Tank for Potable Water Network","frequencies":{"Monthly":["Visually inspect the tank structure and piping from outside for leakage. Check locations where pipes are connected to the tank wall for possible leakage. Apply repairs as necessary if problems are found.","Check the operation of the altitude valve if water is found flowing through the overflow pipe.","Check operation of butterfly valves. Valves should be fully closed then fully opened at least once per month to prevent the disc from seizing to the seat. Note the number of turns to fully close, so that valve can be reset to its original position. Check fasteners for evidence of loosening. If valve operation is stiff, lubricate as necessary, repeat opening and closing until clear, and then return valve to its position. Report any irregularities.","Inspect all valves in the altitude valve chamber against leakage and adjust as required.","Keep complete records as detailed in exhibit 1.","Isolate the tank from the network by closing the butterfly valves on the inlet and outlet pipes. Potable water network shall be fed directly from the Potable water pump station during the period of repair.","Open the washout valve to completely drain water from the tank. Make sure that valve operation is normal and flow through the overflow pipe is not choked. Manually clean the overflow pipe from the tank till the storm water manhole if necessary. Care should be taken to avoid over flooding the storm water lines downstream.","Clean and remove any solid materials and debris from the bottom of tank.","Check the condition of the structure from inside (concrete structure, steel ladders, etc…) and apply repairs as necessary and as directed by the consultant.","Check that the pipes inside the tank are well mounted and protected against rust. Check the inlet condition of the washout and overflow pipe for clogging"]}},"ME-74":{"name":"Altitude Valve for Elevated Potable Water Tank","frequencies":{"Monthly":["Visually inspect the altitude valve and all valves in the chamber for leakage. Check leaks at fittings and around flanges and connections. Apply repairs as necessary if problems are found.","Check the Y-Strainer for buildup solid material and clean as required.","Check that the reservoir sensing line is properly connected to the valve.","Make sure that the altitude pilot mechanism is connected to the system and is working properly. Check the components for leakage and repair as necessary.","Keep complete records as detailed in exhibit 1.","Inspect all the valves, connections, and fittings in the chamber for leakage and repair as required.","Isolate the Altitude valve from the system by closing the butterfly valve upstream. The shutoff valve in the sensing line to the reservoir must be closed too.","Release pressure from the altitude valve cover and diaphragm before disassembling the valve according to the manufacturer’s instructions. Count the number of turns required to disassemble the altitude control spring so it can be reset to the same reservoir liquid level shut-off point.","Inspect the valve inner parts and pilot system components and repair or replace as necessary.","Reassemble the altitude valve and pilot system. Clean the Y-Strainer for buildup solid material. Flush the reservoir sense line and make sure it is not clogged. Make sure that air is removed from valve cover and the pilot system at all high points before putting the valve back to service.","Monitor the operation of the valve with the water level in the tank and fine tune the pilot control system as necessary. Fine tune the closing time of the valve as necessary.","Return to the chamber for inspection daily for a week or more (upon consultant directions) to make sure that the system is working properly and the required water levels in the tank are attained (highest and lowest levels).","Keep complete records as detailed in exhibit 1."]}},"ME-75":{"name":"Underground  Tanks  for  Potable  Water,  Internal Firefighting, and External Firefighting Networks","frequencies":{"Monthly":["Visually inspect the tank structure and piping from outside for leakage. Check locations where pipes are connected to the tank wall for possible leakage. Apply repairs as necessary if problems are found.","Check the operation of the float valve if water is found flowing through the overflow pipe.","Check operation of butterfly valves. Valves should be fully closed then fully opened at least once per month to prevent the disc from seizing to the seat. Note the number of turns to fully close, so that valve can be reset to its original position. Check fasteners for evidence of loosening. If valve operation is stiff, lubricate as necessary, repeat opening and closing until clear, and then return valve to its position. Report any irregularities.","Inspect all valves installed on inlet and outlet pipes against leakage and adjust as required.","Keep complete records as detailed in exhibit 1.","Annual maintenance has to be done for one tank while the other is in operation.","Close the butterfly valve on the inlet pipe of the tank under maintenance while closing the butterfly valves on the outlet pipes of the other tank. This shall allow the tank under maintenance to drain before the scheduled main
