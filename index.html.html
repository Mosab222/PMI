tenance time without wasting water.","Isolate the tank from the network by closing the butterfly valves on the outlet pipes. Potable water and firefighting networks shall be fed from the other tank during the period of repair.","Open the washout valve to completely drain water from the tank. Make sure that valve operation is normal and flow through the drainage pipe till the washout lift station is not choked. Repair if necessary.","Clean and remove any solid materials and debris from the bottom of tank.","Check the condition of the structure from inside (concrete structure, baffles, ladders, covers, etc…) and apply repairs as directed by the consultant."]}},"ME-76":{"name":"Float Valve for Underground Potable Water Tanks and Drinking Water Tank","frequencies":{"Monthly":["Visually inspect the float valve and make sure that the float is connected to the valve and the float rod is not bet or broken and is in good condition. Apply repairs as necessary if problems are found.","Manually raise the float and try to close the valve. Make sure that the float s free to move with water level changes. This should be done slowly to avoid surging the pipeline. Check that the valve closes tight when the float is held to the position of highest water level. Remove air from valve cover if it vibrates while closing. Apply repairs as necessary if problems were found.","Keep complete records as detailed in exhibit 1.","Isolate the float valve from the system by closing the butterfly valve upstream.","Disassemble the valve according to the manufacturer’s instructions. Mark the setting of the float mechanism lever so it can be reset to the same reservoir liquid level shut-off point.","Inspect the valve inner parts, valve positioning, and operating control components. Repair or replace as necessary.","Reassemble the valve and the float mechanism. Make sure that the float is free to move with water level changes before putting the valve back to service.","Monitor the operation of the valve with the water level in the tank and fine tune the float lever as necessary.","Return to the valve for inspection daily for 3 days or more (upon consultant directions) to make sure that the system is working properly and the required water levels in the tank are attained (highest and lowest levels).","Keep complete records as detailed in exhibit 1."]}},"ME-77":{"name":"Water Meter","frequencies":{"Monthly":["Check operation of water meter. Report any irregularities.","Lubricate and maintain in accordance with manufacturer’s instructions.","Keep complete records as detailed in exhibit 1."]}},"ME-78":{"name":"Pipes for Drinking Water Network","frequencies":{"Annually":["Flush all pipes in the system. A minimum velocity of 0.8/s has to be attained in all pipes to be flushed according to the AWWA manual M3 for distribution main flushing and cleaning. Mechanical cleaning might be needed if flushing is not sufficient. Water discharged out of the system during flushing has to be directed to the storm water drainage system. Care should be taken not to over flood the storm drainage lines downstream."]}},"ME-79":{"name":"Drinking Water Tank","frequencies":{"Monthly":["Visually inspect the tank structure and piping from outside for leakage. Apply repairs as necessary if problems are found.","Check the operation of the float valve if water is found flowing through the overflow pipe.","Inspect all valves installed on inlet and outlet pipes against leakage and adjust as required.","Keep complete records as detailed in exhibit 1.","Annual maintenance has to be done for one tank while the other is in operation.","Close the gate valve on the inlet pipe of the tank under maintenance while closing the butterfly valves on the outlet pipes of the other tank. This shall allow the tank under maintenance to drain before the scheduled maintenance time without waste of treated water.","Isolate the tank from the network by closing the gate valves on the outlet pipes. Drinking water network shall be fed from the other tank during the period of repair.","Open the washout valve to completely drain water from the tank. Make sure that valve operation is normal and flow through the drainage pipe till the washout lift station is not choked. Repair if necessary.","Clean and remove any solid materials and debris from the bottom of tank.","Check the condition of the structure from inside (concrete structure, baffles, ladders, covers, etc…) and apply repairs as directed by the consultant.","Check that the pipes inside the tank are well mounted and protected against rust. Inspect the locations where pipes are connected to the tank wall for possible leakage. Check the inlet condition of the washout and overflow pipe for clogging and rust and repair as necessary. Flush the overflow pipe to the nearest stormwater manhole. Check the condition of flap valve and re- grease if necessary."]}},"ME-80":{"name":"Pipes for External Firefighting, Internal Firefighting, and Irrigation Networks","frequencies":{"Monthly":["Check all exposed pipe work and connections for leakage or damage.","Report defects and repair as necessary in coordination with the Consultant. Flush pipes after repairs if necessary."]}},"ME-81":{"name":"Above Ground Fire Hydrant","frequencies":{"Bi-Annually":["Check the hydrant for perpendicular setting and inspect the hydrant footing.","Remove outlet nozzle caps and check for seat leakage visually at each valve on wet barrel hydrants.","If leakage is observed, tighten outlet nozzles or replace o-rings or gaskets. If leakage cannot be corrected with the tools at hand disassemble the hydrant for repair in coordination with the consultant. Replace damaged parts and also parts which indicate wear corrosion, or show signs of incipient failure.","Check operation of fire hydrants. Hydrant valves should be fully closed then fully opened. If operation of valves is stiff, lubricate as necessary, repeat opening and closing until clear, and then return valve to its position. Report any irregularities.","Open the hydrant and flush to remove foreign material from the interior and lateral piping. Attach a section of a hose to the outlet cap to direct the hydrant water to the nearest drain if necessary.","Perform hydrant flow test according to the consultant instructions. Check pressure and flow of hydrant and report the results for further evaluation of network capacity and performance.","Check for any exterior obstruction which may interfere with hydrant use in fire emergency.","Clean the exterior of the hydrant and repaint if deemed necessary.","Make sure that the auxiliary valve on the supply pipe to the hydrant is in the wide open position before leaving the site.","Keep complete records as detailed in exhibit 1."]}},"ME-82":{"name":"Under Ground Fire Hydrant","frequencies":{"Bi-Annually":["Clean cover and frame, clean out lifting keyholes and wire brush to remove rust and scale. Check cover is flushed with finished ground level ad in suitable condition. Inspect the hydrant inside the chamber for settlement and perpendicular setting.","Remove outlet nozzle caps and check for seat leakage visually at each valve. If leakage is observed, tighten outlet nozzles or replace o-rings or gaskets. If leakage cannot be corrected with the tools at hand disassemble the hydrant for repair in coordination with the consultant. Replace damaged parts and also parts which indicate wear corrosion, or show signs of incipient failure.","Check operation of fire hydrant. Hydrant valves should be fully closed then fully opened. If operation of valves is stiff, lubricate as necessary, repeat opening and closing until clear, and then return valve to its position. Report any irregularities.","Open the hydrant and flush to remove foreign material from the interior and lateral piping. Attach a section of a hose to the outlet cap to direct the hydrant water to the nearest drain if necessary.","Perform hydrant flow test according to the consultant instructions. Check pressure and flow of hydrant and report the results for further evaluation of network capacity and performance.","Check for any exterior obstruction which may interfere with hydrant use in fire emergency.","Clean the exterior of the hydrant and repaint if deemed necessary.","Make sure that the auxiliary valve on the supply pipe to the hydrant is in the wide open position before leaving the site.","Keep complete records as detailed in exhibit 1."]}},"ME-83":{"name":"Internal   Firefighting   Pressure   Reducing   Valve Chamber","frequencies":{"Quarterly":["Check operation of gate valves. Valves should be fully closed then fully opened, (note the number of turns to fully close, so that valve can be reset to its original position).","If operation of valves is stiff, clean the valve threads from foreign debris, lubricate as necessary, repeat opening and closing until clear, and then return valve to its position. Report any irregularities.","Fully opened valves should not be jammed-tight on the backseat. Always back-off a quarter turn from the fully opened position.","Inspect the operation of pressure reducing valve. Record the readings of upstream and downstream pressure gauges and report values to the consultant. Compare the downstream reading with the setup pressure of the valve and repair as necessary.","Check the wiring connections of the valves and check the connection of the pressure relief valve to the drainage pipe.","Visually inspect the pressure relief valve, look for signs that the valve has discharged. Slightly and carefully open the bypass valve to allow for high pressure to enter the system and inspect the operation of the pressure relief valve. Repair or replace as directed by the consultant.","Examine all valves, fittings, and pressure gauges in the chamber for leakage and adjust as required.","Keep complete records as detailed in exhibit 1."]}},"ME-84":{"name":"Underground Tanks for Irrigation Water Network","frequencies":{"Annually":["Annual maintenance has to be done for one tank while the other is in operation.","Close the butterfly valve on the inlet pipes of the tank under maintenance while closing the butterfly valves on the outlet pipes of the other tank. This shall allow the tank under maintenance to drain before the scheduled maintenance time without wasting water.","Isolate the tank from the network by closing the butterfly valves on the outlet pipes. Irrigation network shall be fed from the other tank during the period of repair.","Open the washout valve to completely drain water from the tank. Make sure that valve operation is normal and flow through the drainage pipe till the washout lift station is not choked. Repair if necessary.","Clean and remove any solid materials and debris from the bottom of tank.","Check the condition of the structure from inside (concrete structure, baffles, ladders, covers, etc…) and apply repairs as directed by the consultant."]}},"LC-CCTV-01":{"name":"CCTV - OUTDOOR CAMERA","frequencies":{"Monthly":["Check Fiber Optic Converter: Power, FX LINK,LINK/ACT,SPD","Check HLD29V8DNL: Lens 1/3\", 2.9-8mm, F1.3, Day / Night, Varifocal, DC Auto Iris Lens","Check Power Adapter","Check Camera IP and Connectivity","Check Fiber Optic Pigtail and Fiber Cable","Check IDF/Switch Side: a) Check Port Patching b) Check the VLAN, c) Check Giga Port Link","Check RPS in IDF","Check UPP and EPP power supply in IDF","Check Uplink of switch 2960 or 3750 Catalyst","Check Camera Housing and fan","Check UTP Cable"],"Quarterly":["Check Fiber Optic Converter: Power, FX LINK,LINK/ACT,SPD","Check HLD29V8DNL: Lens 1/3\", 2.9-8mm, F1.3, Day / Night, Varifocal, DC Auto Iris Lens","Check Power Adapter","Check Camera IP and Connectivity","Check Fiber Optic Pigtail and Fiber Cable","Check IDF/Switch Side: a) Check Port Patching, b) Check the VLAN, c) Check Giga Port Link","Check RPS in IDF","Check UPP and EPP power supply in IDF","Check Uplink of switch 2960 or 3750 Catalyst","Check Camera Housing and // STATE
// ============================================================
let lang = 'en';
let selectedCode = null;
let selectedFreq = null;
let checkedItems = {};
let uploadedImages = [];
let currentPDFBlob = null;

// ============================================================
// LANGUAGE
// ============================================================
function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.textContent.trim() === l.toUpperCase() || (l === 'ur' && b.textContent.trim() === 'اردو') || (l === 'ar' && b.textContent.trim() === 'ع')));
  const isRTL = l === 'ar' || l === 'ur';
  document.body.setAttribute('dir', isRTL ? 'rtl' : 'ltr');
  document.body.setAttribute('lang', l);
  document.querySelectorAll('[data-t]').forEach(el => {
    const key = el.getAttribute('data-t');
    if (T[l] && T[l][key]) el.textContent = T[l][key];
  });
  document.getElementById('codeSearch').placeholder = T[l].selectPlaceholder;
  if (selectedFreq) renderChecklist();
  if (selectedCode) renderFreqs();
}

function t(key) { return (T[lang] && T[lang][key]) || T.en[key] || key; }

// ============================================================
// SEARCH & DROPDOWN
// ============================================================
const allCodes = Object.keys(PMI).sort();

document.getElementById('codeSearch').addEventListener('input', function() {
  const q = this.value.trim().toUpperCase();
  if (!q) { hideDropdown(); return; }
  const matches = allCodes.filter(c =>
    c.includes(q) || PMI[c].name.toUpperCase().includes(q)
  ).slice(0, 20);
  showDropdown(matches, q);
});

document.getElementById('codeSearch').addEventListener('keydown', function(e) {
  if (e.key === 'Escape') hideDropdown();
});

document.addEventListener('click', function(e) {
  if (!e.target.closest('.search-wrapper')) hideDropdown();
});

function showDropdown(codes, q) {
  const dd = document.getElementById('dropdown');
  if (!codes.length) { hideDropdown(); return; }
  dd.innerHTML = codes.map(c => {
    const code = c.replace(q, `<span style="color:var(--accent)">${q}</span>`);
    return `<div class="dropdown-item" onclick="selectCode('${c}')">
      <span class="item-code">${c}</span>
      <span class="item-name">${PMI[c].name}</span>
    </div>`;
  }).join('');
  dd.classList.remove('hidden');
}

function hideDropdown() { document.getElementById('dropdown').classList.add('hidden'); }

function selectCode(code) {
  selectedCode = code;
  selectedFreq = null;
  checkedItems = {};
  hideDropdown();
  document.getElementById('codeSearch').value = '';

  document.getElementById('badgeCode').textContent = code;
  document.getElementById('badgeName').textContent = PMI[code].name;
  document.getElementById('eqBadge').classList.remove('hidden');

  renderFreqs();
  document.getElementById('freqCard').classList.remove('hidden');
  document.getElementById('checklistCard').classList.add('hidden');
  document.getElementById('photoCard').classList.add('hidden');
}

function clearSelection() {
  selectedCode = null; selectedFreq = null; checkedItems = {};
  document.getElementById('eqBadge').classList.add('hidden');
  document.getElementById('freqCard').classList.add('hidden');
  document.getElementById('checklistCard').classList.add('hidden');
  document.getElementById('photoCard').classList.add('hidden');
  document.getElementById('codeSearch').value = '';
  document.getElementById('codeSearch').focus();
}

// ============================================================
// FREQUENCY
// ============================================================
function renderFreqs() {
  if (!selectedCode) return;
  const freqs = Object.keys(PMI[selectedCode].frequencies);
  const grid = document.getElementById('freqGrid');
  grid.innerHTML = freqs.map(f =>
    `<button class="freq-btn ${f === selectedFreq ? 'active' : ''}" onclick="selectFreq('${f}')">${lang === 'ar' ? T.ar.freqLabel(f) : f}</button>`
  ).join('');
}

function selectFreq(freq) {
  selectedFreq = freq;
  checkedItems = {};
  renderFreqs();
  renderChecklist();
  document.getElementById('checklistCard').classList.remove('hidden');
  document.getElementById('photoCard').classList.remove('hidden');
  setTimeout(() => document.getElementById('checklistCard').scrollIntoView({behavior:'smooth', block:'start'}), 100);
}

// ============================================================
// CHECKLIST
// ============================================================
function renderChecklist() {
  if (!selectedCode || !selectedFreq) return;
  const tasks = PMI[selectedCode].frequencies[selectedFreq] || [];
  document.getElementById('checklistTitle').textContent = `${selectedCode} — ${PMI[selectedCode].name}`;
  document.getElementById('checklistMeta').textContent = selectedFreq;

  const list = document.getElementById('taskList');
  list.innerHTML = tasks.map((task, i) => `
    <div class="task-item ${checkedItems[i] ? 'checked' : ''}" onclick="toggleTask(${i})" id="task-${i}">
      <div class="task-checkbox"></div>
      <span class="task-num">${String(i+1).padStart(2,'0')}</span>
      <span class="task-text">${task.replace(/\n/g,' ').trim()}</span>
    </div>
  `).join('');

  updateStats(tasks.length);
}

function toggleTask(i) {
  checkedItems[i] = !checkedItems[i];
  const el = document.getElementById(`task-${i}`);
  el.classList.toggle('checked', checkedItems[i]);
  const tasks = PMI[selectedCode].frequencies[selectedFreq] || [];
  updateStats(tasks.length);
}

function toggleAll() {
  const tasks = PMI[selectedCode].frequencies[selectedFreq] || [];
  const allChecked = Object.values(checkedItems).filter(Boolean).length === tasks.length;
  tasks.forEach((_, i) => { checkedItems[i] = !allChecked; });
  renderChecklist();
  document.getElementById('toggleAllBtn').setAttribute('data-t', allChecked ? 'checkAll' : 'uncheckAll');
  document.getElementById('toggleAllBtn').textContent = allChecked ? t('checkAll') : t('uncheckAll');
}

function updateStats(total) {
  const done = Object.values(checkedItems).filter(Boolean).length;
  const left = total - done;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statDone').textContent = done;
  document.getElementById('statLeft').textContent = left;
  document.getElementById('progressBar').style.width = total ? `${(done/total)*100}%` : '0%';
}

// ============================================================
// IMAGES
// ============================================================
function handleImages(files) {
  const remaining = 10 - uploadedImages.length;
  if (remaining <= 0) { showToast(t('maxPhotos'), 'error'); return; }
  const toAdd = Array.from(files).slice(0, remaining);
  toAdd.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      uploadedImages.push(e.target.result);
      renderImages();
    };
    reader.readAsDataURL(file);
  });
  if (files.length > remaining) showToast(t('maxPhotos'), 'error');
}

function renderImages() {
  const grid = document.getElementById('imgGrid');
  const count = document.getElementById('imgCount');
  count.textContent = uploadedImages.length ? `${uploadedImages.length}/10 photos added` : '';
  grid.innerHTML = uploadedImages.map((src, i) => `
    <div class="img-thumb">
      <img src="${src}" alt="Photo ${i+1}">
      <button class="img-thumb-del" onclick="removeImage(${i})">✕</button>
    </div>
  `).join('');
}

function removeImage(i) { uploadedImages.splice(i, 1); renderImages(); }

dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('drag-over'); handleImages(e.dataTransfer.files); });

// ============================================================
// PDF GENERATION
// ============================================================
async function generatePDF() {
  const wo = document.getElementById('woInput').value.trim();
  if (!wo) { showToast(t('noWO'), 'error'); return; }
  if (!selectedCode) { showToast(t('noCode'), 'error'); return; }
  if (!selectedFreq) { showToast(t('noFreq'), 'error'); return; }

  const btn = document.getElementById('pdfBtn');
  btn.disabled = true;
  btn.innerHTML = '<span>⏳</span> <span>Generating...</span>';

  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    const W = 210, margin = 15, contentW = W - margin * 2;

    // Colors
    const dark = [10, 12, 16];
    const accent = [0, 212, 170];
    const light = [240, 244, 248];
    const mid = [139, 149, 163];

    // ---- HEADER ----
    doc.setFillColor(...dark);
    doc.rect(0, 0, W, 48, 'F');
    doc.setFillColor(...accent);
    doc.rect(0, 46, W, 2, 'F');

    doc.setTextColor(...accent);
    doc.setFontSize(22); doc.setFont('helvetica', 'bold');
    doc.text('PMI SYSTEM', margin, 20);

    doc.setTextColor(...mid);
    doc.setFontSize(9); doc.setFont('helvetica', 'normal');
    doc.text('Preventive Maintenance Inspection Report', margin, 28);

    // WO badge
    doc.setFillColor(0, 212, 170, 0.15);
    doc.setDrawColor(...accent);
    doc.roundedRect(margin, 33, 80, 10, 2, 2, 'FD');
    doc.setTextColor(...accent);
    doc.setFontSize(9); doc.setFont('helvetica', 'bold');
    doc.text(`WO: ${wo}`, margin + 4, 39.5);

    // Date
    const now = new Date();
    const dateStr = now.toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'});
    doc.setTextColor(...mid);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
    doc.text(dateStr, W - margin, 39.5, { align: 'right' });

    // ---- EQUIPMENT INFO ----
    let y = 58;
    doc.setFillColor(24, 28, 35);
    doc.roundedRect(margin, y, contentW, 24, 3, 3, 'F');

    doc.setTextColor(...accent);
    doc.setFontSize(8); doc.setFont('helvetica', 'bold');
    doc.text('EQUIPMENT', margin + 6, y + 7);

    doc.setTextColor(...light);
    doc.setFontSize(11); doc.setFont('helvetica', 'bold');
    doc.text(selectedCode, margin + 6, y + 14);

    doc.setTextColor(...mid);
    doc.setFontSize(9); doc.setFont('helvetica', 'normal');
    const nameLines = doc.splitTextToSize(PMI[selectedCode].name, contentW - 50);
    doc.text(nameLines[0], margin + 6, y + 20);

    // Frequency badge
    doc.setFillColor(...accent);
    doc.roundedRect(W - margin - 45, y + 6, 45, 12, 3, 3, 'F');
    doc.setTextColor(0, 0, 0);
    doc.setFontSize(9); doc.setFont('helvetica', 'bold');
    doc.text(selectedFreq, W - margin - 22.5, y + 13.5, { align: 'center' });

    // ---- CHECKLIST ----
    y += 32;
    const tasks = PMI[selectedCode].frequencies[selectedFreq] || [];
    const done = Object.values(checkedItems).filter(Boolean).length;

    doc.setTextColor(...accent);
    doc.setFontSize(8); doc.setFont('helvetica', 'bold');
    doc.text('CHECKLIST', margin, y);
    doc.setTextColor(...mid);
    doc.text(`${done}/${tasks.length} completed`, W - margin, y, { align: 'right' });
    y += 4;

    // Progress bar
    doc.setFillColor(37, 41, 50);
    doc.roundedRect(margin, y, contentW, 3, 1, 1, 'F');
    if (tasks.length) {
      doc.setFillColor(...accent);
      doc.roundedRect(margin, y, contentW * (done/tasks.length), 3, 1, 1, 'F');
    }
    y += 8;

    // Tasks
    for (let i = 0; i < tasks.length; i++) {
      if (y > 270) { doc.addPage(); y = 20; }
      const isChecked = !!checkedItems[i];
      const rowH = 10;

      doc.setFillColor(isChecked ? 0 : 24, isChecked ? 201 : 28, isChecked ? 122 : 35);
      doc.setGlobalAlpha(isChecked ? 0.08 : 1);
      doc.roundedRect(margin, y, contentW, rowH, 2, 2, 'F');
      doc.setGlobalAlpha(1);

      // Checkbox
      if (isChecked) {
        doc.setFillColor(0, 201, 122);
        doc.roundedRect(margin + 3, y + 2, 6, 6, 1, 1, 'F');
        doc.setTextColor(0, 0, 0);
        doc.setFontSize(8); doc.setFont('helvetica', 'bold');
        doc.text('✓', margin + 4.5, y + 7);
      } else {
        doc.setDrawColor(47, 53, 66);
        doc.roundedRect(margin + 3, y + 2, 6, 6, 1, 1, 'D');
      }

      // Number
      doc.setTextColor(...mid);
      doc.setFontSize(7); doc.setFont('helvetica', 'normal');
      doc.text(String(i+1).padStart(2,'0'), margin + 12, y + 6.5);

      // Task text
      const taskText = tasks[i].replace(/\n/g,' ').trim();
      const truncated = taskText.length > 110 ? taskText.substring(0, 110) + '…' : taskText;
      doc.setTextColor(isChecked ? 100 : 220, isChecked ? 110 : 225, isChecked ? 120 : 230);
      if (isChecked) {
        // strikethrough simulation
        doc.setFontSize(8);
        doc.text(truncated, margin + 19, y + 6.5);
        const tw = doc.getTextWidth(truncated);
        doc.setDrawColor(...mid);
        doc.line(margin + 19, y + 5.5, margin + 19 + tw, y + 5.5);
      } else {
        doc.setFontSize(8);
        doc.text(truncated, margin + 19, y + 6.5);
      }

      y += rowH + 1.5;
    }

    // ---- PHOTOS ----
    if (uploadedImages.length > 0) {
      if (y > 200) { doc.addPage(); y = 20; }
      else y += 8;

      doc.setFillColor(...dark);
      doc.rect(0, y - 4, W, 12, 'F');
      doc.setTextColor(...accent);
      doc.setFontSize(8); doc.setFont('helvetica', 'bold');
      doc.text('EQUIPMENT PHOTOS', margin, y + 4);
      y += 14;

      const imgW = (contentW - 8) / 3;
      const imgH = imgW * 0.75;
      let col = 0;

      for (const imgData of uploadedImages) {
        if (col === 3) { col = 0; y += imgH + 4; }
        if (y + imgH > 275) { doc.addPage(); y = 20; col = 0; }
        const x = margin + col * (imgW + 4);
        try {
          doc.addImage(imgData, 'JPEG', x, y, imgW, imgH, undefined, 'MEDIUM');
          doc.setDrawColor(...accent);
          doc.roundedRect(x, y, imgW, imgH, 2, 2, 'D');
        } catch(e) {}
        col++;
      }
    }

    // ---- FOOTER ----
    const pageCount = doc.getNumberOfPages();
    for (let p = 1; p <= pageCount; p++) {
      doc.setPage(p);
      doc.setFillColor(24, 28, 35);
      doc.rect(0, 288, W, 9, 'F');
      doc.setTextColor(...mid);
      doc.setFontSize(7); doc.setFont('helvetica', 'normal');
      doc.text(`PMI System  ·  ${wo}  ·  ${selectedCode}`, margin, 293.5);
      doc.text(`Page ${p} / ${pageCount}`, W - margin, 293.5, { align: 'right' });
    }

    // Save
    const filename = `${wo}_${selectedCode}.pdf`;
    doc.save(filename);
    currentPDFBlob = doc.output('blob');
    currentPDFBlob._filename = filename;
    showToast('✅ ' + t('pdfReady'));
  } catch(e) {
    console.error(e);
    showToast(t('pdfError'), 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<span>📄</span> <span data-t="savePDF">' + t('savePDF') + '</span>';
  }
}

    }

    doc.save(filename);

  }
}

// ============================================================
// TOAST
// ============================================================
function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}
