<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMI System — Preventive Maintenance Inspection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;500;600;700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root {
  --bg: #0a0c10;
  --bg2: #111318;
  --bg3: #181c23;
  --border: #252932;
  --border2: #2f3542;
  --accent: #00d4aa;
  --accent2: #0099ff;
  --accent3: #ff6b35;
  --text: #e8ecf0;
  --text2: #8b95a3;
  --text3: #555f6e;
  --success: #00c97a;
  --warning: #ffb038;
  --radius: 12px;
  --shadow: 0 8px 32px rgba(0,0,0,0.4);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Sora', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

body[dir="rtl"] { font-family: 'Cairo', sans-serif; }
body[lang="ur"] { font-family: 'Cairo', sans-serif; }

/* Background grid */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,212,170,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,170,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

.container { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 24px 20px 80px; }

/* Header */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 40px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  gap: 16px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 14px;
}

.logo-icon {
  width: 44px; height: 44px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  box-shadow: 0 0 20px rgba(0,212,170,0.3);
}

.logo-text h1 {
  font-size: 18px; font-weight: 700;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  letter-spacing: -0.5px;
}
.logo-text p { font-size: 11px; color: var(--text3); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 2px; }

/* Language switcher */
.lang-switcher {
  display: flex; gap: 6px; align-items: center;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 50px; padding: 4px;
}
.lang-btn {
  padding: 6px 14px; border-radius: 50px; border: none;
  background: transparent; color: var(--text2);
  font-size: 12px; cursor: pointer; transition: all 0.2s;
  font-family: inherit; font-weight: 500;
}
.lang-btn.active {
  background: var(--accent); color: #000;
  font-weight: 600;
}
.lang-btn:hover:not(.active) { color: var(--text); background: var(--border); }

/* Card */
.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px;
  margin-bottom: 20px;
  transition: border-color 0.2s;
}
.card:hover { border-color: var(--border2); }

.card-label {
  font-size: 10px; font-weight: 600;
  letter-spacing: 2px; text-transform: uppercase;
  color: var(--accent); margin-bottom: 12px;
}

/* Work order input */
.wo-row { display: flex; gap: 12px; align-items: flex-end; }
.input-group { flex: 1; }
.input-group label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 8px; font-weight: 500; }
.input-field {
  width: 100%; background: var(--bg3); border: 1px solid var(--border2);
  border-radius: 8px; color: var(--text); padding: 12px 16px;
  font-family: 'DM Mono', monospace; font-size: 14px;
  transition: all 0.2s; outline: none;
}
.input-field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,212,170,0.1); }
.input-field::placeholder { color: var(--text3); }

/* Code search */
.search-wrapper { position: relative; }
.search-input {
  width: 100%; background: var(--bg3); border: 1px solid var(--border2);
  border-radius: 8px; color: var(--text); padding: 14px 16px 14px 44px;
  font-family: 'DM Mono', monospace; font-size: 15px; font-weight: 500;
  transition: all 0.2s; outline: none; letter-spacing: 1px;
}
.search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,212,170,0.1); }
.search-icon {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  font-size: 16px; color: var(--text3); pointer-events: none;
}
[dir="rtl"] .search-icon { left: auto; right: 14px; }
[dir="rtl"] .search-input { padding: 14px 44px 14px 16px; }

/* Dropdown */
.dropdown {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0;
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: 10px; overflow: hidden;
  box-shadow: var(--shadow); z-index: 100;
  max-height: 280px; overflow-y: auto;
  animation: dropIn 0.15s ease;
}
@keyframes dropIn { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }

.dropdown-item {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 16px; cursor: pointer; transition: background 0.15s;
  border-bottom: 1px solid var(--border);
}
.dropdown-item:last-child { border-bottom: none; }
.dropdown-item:hover { background: var(--bg3); }

.item-code {
  font-family: 'DM Mono', monospace; font-size: 13px;
  font-weight: 500; color: var(--accent);
  background: rgba(0,212,170,0.08); padding: 4px 10px;
  border-radius: 6px; white-space: nowrap; min-width: 72px; text-align: center;
}
.item-name { font-size: 13px; color: var(--text2); flex: 1; line-height: 1.4; }

/* Selected equipment badge */
.eq-badge {
  display: flex; align-items: center; gap: 12px;
  background: rgba(0,212,170,0.06); border: 1px solid rgba(0,212,170,0.2);
  border-radius: 10px; padding: 14px 18px; margin-top: 14px;
}
.eq-badge-code { font-family: 'DM Mono', monospace; font-weight: 600; color: var(--accent); font-size: 16px; }
.eq-badge-name { font-size: 13px; color: var(--text2); flex: 1; }
.eq-clear { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 18px; padding: 2px 6px; border-radius: 4px; transition: color 0.2s; }
.eq-clear:hover { color: var(--accent3); }

/* Frequency selector */
.freq-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.freq-btn {
  padding: 8px 16px; border-radius: 8px;
  border: 1px solid var(--border2); background: var(--bg3);
  color: var(--text2); font-family: inherit; font-size: 12px;
  cursor: pointer; transition: all 0.2s; font-weight: 500;
}
.freq-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(0,212,170,0.05); }
.freq-btn.active { border-color: var(--accent); background: rgba(0,212,170,0.12); color: var(--accent); font-weight: 600; }

/* Checklist */
.checklist-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.checklist-title { font-size: 14px; font-weight: 600; color: var(--text); }
.checklist-meta { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; }
.check-progress {
  height: 3px; background: var(--border); border-radius: 2px; margin-bottom: 20px; overflow: hidden;
}
.check-progress-bar {
  height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 2px; transition: width 0.4s ease;
}

.task-item {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 14px 16px; border-radius: 8px;
  border: 1px solid var(--border);
  margin-bottom: 8px; cursor: pointer;
  transition: all 0.2s; background: var(--bg3);
  user-select: none;
}
.task-item:hover { border-color: var(--border2); background: var(--bg2); }
.task-item.checked { border-color: rgba(0,201,122,0.3); background: rgba(0,201,122,0.04); }

.task-checkbox {
  width: 20px; height: 20px; min-width: 20px;
  border-radius: 6px; border: 2px solid var(--border2);
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; margin-top: 1px;
  background: var(--bg);
}
.task-item.checked .task-checkbox {
  border-color: var(--success); background: var(--success);
}
.task-checkbox::after {
  content: '✓'; font-size: 12px; font-weight: 700;
  color: #000; opacity: 0; transform: scale(0.5); transition: all 0.15s;
}
.task-item.checked .task-checkbox::after { opacity: 1; transform: scale(1); }

.task-num { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text3); min-width: 28px; margin-top: 2px; }
.task-text { font-size: 13px; color: var(--text2); line-height: 1.6; flex: 1; }
.task-item.checked .task-text { color: var(--text3); text-decoration: line-through; }

/* Image upload */
.img-upload-area {
  border: 2px dashed var(--border2); border-radius: 10px;
  padding: 24px; text-align: center; cursor: pointer;
  transition: all 0.2s; background: var(--bg3);
}
.img-upload-area:hover, .img-upload-area.drag-over {
  border-color: var(--accent); background: rgba(0,212,170,0.04);
}
.img-upload-icon { font-size: 28px; margin-bottom: 8px; }
.img-upload-text { font-size: 13px; color: var(--text2); }
.img-upload-sub { font-size: 11px; color: var(--text3); margin-top: 4px; }
.img-count { font-size: 11px; color: var(--accent); margin-top: 6px; font-family: 'DM Mono', monospace; }

.img-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-top: 14px; }
.img-thumb {
  position: relative; aspect-ratio: 1;
  border-radius: 8px; overflow: hidden; border: 1px solid var(--border);
}
.img-thumb img { width: 100%; height: 100%; object-fit: cover; }
.img-thumb-del {
  position: absolute; top: 4px; right: 4px;
  background: rgba(0,0,0,0.7); border: none; color: #fff;
  width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
  font-size: 12px; display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
}
.img-thumb-del:hover { background: var(--accent3); }

/* Action buttons */
.actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 24px; }
.btn {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 22px; border-radius: 10px; border: none;
  font-family: inherit; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all 0.2s; text-decoration: none;
}
.btn-primary { background: linear-gradient(135deg, var(--accent), #00b890); color: #000; }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,212,170,0.3); }
.btn-secondary { background: var(--bg3); border: 1px solid var(--border2); color: var(--text2); }
.btn-secondary:hover { border-color: var(--accent2); color: var(--accent2); }
.btn-share { background: linear-gradient(135deg, #25d366, #128c7e); color: #fff; }
.btn-share:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(37,211,102,0.3); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

/* Stats bar */
.stats-bar {
  display: flex; gap: 20px; padding: 14px 20px;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 10px; margin-bottom: 16px;
}
.stat { text-align: center; flex: 1; }
.stat-val { font-family: 'DM Mono', monospace; font-size: 22px; font-weight: 500; color: var(--accent); }
.stat-lbl { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

/* Toast */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: 10px; padding: 12px 20px; font-size: 13px;
  box-shadow: var(--shadow); z-index: 9999; transition: transform 0.3s ease;
  display: flex; align-items: center; gap: 8px;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { border-color: var(--success); }
.toast.error { border-color: var(--accent3); }

/* Hidden */
.hidden { display: none !important; }

/* Section divider */
.section { margin-bottom: 20px; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text3); }

/* Responsive */
@media (max-width: 600px) {
  .header { flex-direction: column; align-items: flex-start; }
  .wo-row { flex-direction: column; }
  .stats-bar { gap: 10px; }
  .stat-val { font-size: 18px; }
}
</style>
</head>
<body>

<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <div class="logo-icon">🔧</div>
      <div class="logo-text">
        <h1 data-t="appTitle">PMI System</h1>
        <p data-t="appSub">Preventive Maintenance Inspection</p>
      </div>
    </div>
    <div class="lang-switcher">
      <button class="lang-btn active" onclick="setLang('en')">EN</button>
      <button class="lang-btn" onclick="setLang('ar')">ع</button>
      <button class="lang-btn" onclick="setLang('ur')">اردو</button>
    </div>
  </div>

  <!-- Step 1: Work Order -->
  <div class="card section">
    <div class="card-label" data-t="step1">Step 1 — Work Order</div>
    <div class="wo-row">
      <div class="input-group" style="flex:1">
        <label data-t="woLabel">Work Order Number</label>
        <input type="text" id="woInput" class="input-field" placeholder="e.g. WO-2024-001" />
      </div>
    </div>
  </div>

  <!-- Step 2: Equipment Code -->
  <div class="card section">
    <div class="card-label" data-t="step2">Step 2 — Equipment Code</div>
    <div class="search-wrapper">
      <span class="search-icon">⌕</span>
      <input type="text" id="codeSearch" class="search-input" placeholder="Type code or name (e.g. EL-01, Generator...)" autocomplete="off" />
      <div class="dropdown hidden" id="dropdown"></div>
    </div>
    <div class="eq-badge hidden" id="eqBadge">
      <span class="eq-badge-code" id="badgeCode"></span>
      <span class="eq-badge-name" id="badgeName"></span>
      <button class="eq-clear" onclick="clearSelection()" title="Clear">✕</button>
    </div>
  </div>

  <!-- Step 3: Frequency -->
  <div class="card section hidden" id="freqCard">
    <div class="card-label" data-t="step3">Step 3 — Frequency</div>
    <div class="freq-grid" id="freqGrid"></div>
  </div>

  <!-- Step 4: Checklist -->
  <div class="card section hidden" id="checklistCard">
    <div class="checklist-header">
      <div>
        <div class="card-label" data-t="step4">Step 4 — Checklist</div>
        <div class="checklist-title" id="checklistTitle"></div>
      </div>
      <div class="checklist-meta" id="checklistMeta"></div>
    </div>
    <div class="check-progress"><div class="check-progress-bar" id="progressBar" style="width:0%"></div></div>
    <div id="stats-row" class="stats-bar">
      <div class="stat"><div class="stat-val" id="statTotal">0</div><div class="stat-lbl" data-t="statTotal">Total</div></div>
      <div class="stat"><div class="stat-val" id="statDone" style="color:var(--success)">0</div><div class="stat-lbl" data-t="statDone">Completed</div></div>
      <div class="stat"><div class="stat-val" id="statLeft" style="color:var(--text3)">0</div><div class="stat-lbl" data-t="statLeft">Remaining</div></div>
    </div>
    <div id="taskList"></div>

    <div style="margin-top:8px;text-align:right;">
      <button class="btn btn-secondary" onclick="toggleAll()" id="toggleAllBtn" style="padding:8px 14px;font-size:12px;" data-t="checkAll">Check All</button>
    </div>
  </div>

  <!-- Step 5: Photos -->
  <div class="card section hidden" id="photoCard">
    <div class="card-label" data-t="step5">Step 5 — Equipment Photos (Optional)</div>
    <div class="img-upload-area" id="dropZone" onclick="document.getElementById('imgInput').click()">
      <div class="img-upload-icon">📷</div>
      <div class="img-upload-text" data-t="uploadText">Click to upload or drag & drop photos</div>
      <div class="img-upload-sub" data-t="uploadSub">Maximum 10 photos · JPG, PNG</div>
      <div class="img-count" id="imgCount"></div>
    </div>
    <input type="file" id="imgInput" multiple accept="image/*" style="display:none" onchange="handleImages(this.files)">
    <div class="img-grid" id="imgGrid"></div>

    <!-- Actions -->
    <div class="actions">
      <button class="btn btn-primary" onclick="generatePDF()" id="pdfBtn">
        <span>📄</span> <span data-t="savePDF">Save PDF</span>
      </button>
      <button class="btn btn-share" onclick="sharePDF()" id="shareBtn">
        <span>📤</span> <span data-t="sharePDF">Share</span>
      </button>
    </div>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ============================================================
// DATA
// ============================================================
const PMI = {"EL-01":{"name":"Substation SSU’s, 13.8 KV Switchgears, Transformers and Package substation","frequencies":{"Daily":["Check that all meters and indicators are functioning correctly. Note readings \nand compare with those taken previously.","Check alarm indicators on the front compartment of the switchgear and \ntransformer cabinet, carry out any corrective action as necessary.","Check for overheating, vibration and undue noise etc., and report to the \nManagement for correction or repair immediately. Carry out repair as \nnecessary.","Visually inspect indicator lamps and display units, replace any faulty ones as \nnecessary, or check any wire disconnection.","Check warning and indication labels are securely in position."],"Bi-Annually":["Clean and free from dust inside and outside the switchgear or transformer \ncabinet, one at a time; using compressed air and a suitable plastic nozzle.","Check the battery and charger (following the charger instruction).","Check the electrical and mechanical operation of the MV switchgear and \ntransformer with OFF or ON load, following the manual instructions."],"Annually":["Carry out tasks as described Bi-Annually.","The switchgear and transformer rooms shall be kept as clean and free from dust \nas possible. All accumulations of dust inside the switchgear and the transformer \ncabinet should be removed by blowing with compressed air or vacuum \ncleaner, using plastic nozzles. Finish by wiping with cloth moistened in alcohol.","Check all control and power cables and busbar joints.","Check all bolts are well tightened with a torque wrench.","Check the damping of cable bundles and that no cable is passing in sharp edges or corners.","Check all fixing components especially: the cover of busbar compartment, door access, tumbler, motor drive, transformer cabinet, protection relay, auxiliary relay, indicators, push buttons and selector switches.","All metering and protection units should be checked"]}},"EL-02":{"name":"Standby Generator Set","frequencies":{"Daily":["nspect the radiator core for leaks and trash build-up.","Inspect the radiator for cracks or loose clamps. Check the coolant level with the engine stopped and cool. Inspect also the filter cap, and replace if gaskets are damaged.","Inspect the fan and accessory drive belts for cracks, breaks or other damages. Replace if necessary.","Inspect the pump for water leaks. Replace or seal pump if necessary.","Inspect the lube system for leaks such as front and rear crankshaft seals, oil pan, filters and valve covers. Check the oil level with the engine stopped.","Inspect the fuel system for leaks, loose fuel line clamps and fittings, and loose or worn hoses.","Check all electrical connections and wiring. Tighten all loose connections and repair all wiring that shows sign of wear or insulation cracking.","Drain the fuel from the water separator. Drain water and sediment from fuel storage or daily tanks when required.","Check conditions of batteries and the level of electrolyte.","Check if all guards are in place, repair or replace missing or damaged guards.","While operating, frequently observe the engine oil pressure gauge, the water temperature gauge and the air elevator indicator."],"Bi-annually (or 200 hours)":["Carry out tasks as described for daily.","Obtain an oil sample for scheduled oil sampling (S.O.S.). This sample should be taken when the oil is warm and well mixed.","Check and clean the engine air cleaner cover and body with a clean and dry cloth. Inspect the seals and install new seals if necessary. Air filter elements can be cleaned with pressure air, pressure water or detergent washing.","Test for coolant additive concentration. Inspect the radiator filler cap gasket; replace if it is damaged. Add premixed coolant water if necessary.","Inspect and clean radiator fins with high-pressure water and with the engine stopped.","Inspect all hoses for leaks due to crack, softness and loose clamps. Replace as necessary.","Clean and check electrolyte level of batteries. Clean and tighten cable clamps to battery terminals and coat with petroleum jelly or silicon lubricants.","Check the battery charger for proper operation. Replace batteries or battery cables if necessary.","Inspect the condition and adjustment of alternator belts and fan drive belts. Replace for any sign of wear.","Inspect the fan drive pulling assembly and lubricate the bearing fitting."],"Annually (or 400 hours)":["Carry out tasks as described for Bi-annually","Drain and refill the engine crank case oil with the engine stopped and replace the oil filters. Check for the presence of debris in the oil filter that may indicate of an early wear or pending failure in the engine.","Clean the stainer of the fuel lift pump and wipe sediments from the lift pump body.","Drain water and sediment from any fuel storage tanks.","Replace the fuel filters and gaskets.","Check and adjust the engine valve lash for the first 400 hours.","Check and inspect for proper operation of engine protection devices, and control panel readings."],"Every 2000 hours":["Carry out tasks as described annually.","Clean the crankcase breather system. Inspect the upper area of cylinder head for cleanliness.","Check and adjust the engine valve lash.","Check and inspect the engine mounts for deterioration and proper bolt torques.","Inspect the crankshaft vibration damper","Inspect for proper operation of the turbo charger, and inspect the turbine wheel or compressor wheel for contact with the turbocharger housing.","Inspect and test fuel injection nozzles and replace if necessary."],"Two-yearly (or every 3000 hours)":["Carry out tasks as described for every 2000 hours.","Replace all the cooling system hoses, and inspect and tighten loose clamps.","Clean and flush the cooling water system radiator.","Check the water pump seals and replace if necessary.","Replace the thermostat.","Inspect for proper operation of water pumps, alternator, and electric starting motor.","Overhaul shall be performed every 6000 hours."],"Two-weekly":["Carry out an operational test on the system.","Check and replenish fuel levels.","Check coolant, lubricating oil and battery electrolyte levels."],"Monthly":["Carry out an operational and load test on the system.","Genset should be operated on at least 50% load for 2-3 hours"]}},"EL-03":{"name":"Main Distribution Boards","frequencies":{"Weekly":["Check that all metering instruments are functioning. Note readings and compare with those taken previously.","Check that operating tools, handles, keys, etc. are readily available in switchboard.","Inspect switchboard or circuit breakers enclosure for undue heating."],"Monthly":["Carry out tasks as detailed for Weekly.","Check for undue noise, overheating or vibration, loose parts, tightness of screw/bolts and warping, and report to the management for correction or repair.","Visually check PACB’s, MCCB’s, fuse switches or isolators, for signs of arcing or burning. (Checking of the PACB may only be done if the circuit breaker is permitted to be opened for servicing and only under the instruction of the engineer in charge).","Examine resistors and devices object to overheating, where and when possible, without shutting down the essential loads. (Check with the supervising engineer).","Inspect earthing connections, power terminations and control circuits without shutting down the MDB as per Engineer’s instruction.","Remove all dust and debris inside cubicles or enclosures with the aid of a vacuum cleaner.","Check that PACB’s stored energy mechanisms are charged. Correct any defects"],"Bi-Annually":["Carry out tasks as detailed for Monthly.","Check operation of MCCB’s, PACB’s and isolators using their integral switching arrangements to ensure that mechanisms are in good order.","Check for links, bridges for sign arcing. Ensure correct grade of fuse is fitted. Correct any defects.","Check electrical and/or mechanical operation of withdrawable main PACB at a time, in the test position and in the connected position, strictly in accordance with Engineer’s instructions, when MDB is not in use"],"Annually":["Carry out tasks as detailed for Bi-annually.","Inspect electrical primary and secondary connections, cables and supports, insulation for discoloration, excessive corrosion, secure connections, clean contacts, insulation chaffing and embroiled or discoloured cable or insulator. Correct any defects.","Clean the stationary part of the switchgear with a clean cloth, use compressed dry air for inaccessible areas.","Examine all air filters for dust content, flush with water and re-coat with supercoat adhesive as recommended per manufacture.","Check that all conduits and cable gland terminations associated with the switchboard are secure.","Manually discharge (for safety) and draw out the circuit breakers, check, clean and lubricate the carriages.","Check all stationary primary disconnects for evidence of overheating and corrosion.","Inspect all circuit breakers drawout captive positions, interlocks and shutter mechanism operation.","Check anti-pump relay operation.","Check and clean insulated parts using a mild detergent, a lint free cloth, \nrinsing with clear water and dry.","Inspect arc chutes and contacts of circuit breakers, fuse-switches, isolators \nand repair or replace as per manufacturer’s procedures.","Check security of all electrical terminations and connections and tighten as \nnecessary.","Check that all barriers and guards are in place and secure.","Check that phase labels giving circuit references are securely fixed. Replace \nany missing items and update information as necessary.","Ensure that 380 Volts and any other warning labels are in position where \napplicable.","Check door interlocks and that doors can be securely closed. If lock is provided, check that it functions correctly.","Check enclosure for paintwork condition and signs of corrosion. (Correct any defects.).","Visually inspect any undervoltage relays, clean and carry out a simulation test.","Check that the rating of the circuit breakers and setting of microprocessors (MPS), overcurrent and ground fault relay are correct with respect to the loading, type of load, cabling, etc., in the design data. Report any overloading and/or loads that are up to the set rating of the breaker. Make any possible adjustments. Report need for replacements and adjustments to the management."],"Two-yearly":["Carry out tasks as detailed for Annually.","Measure insulation resistance for busducts, busbars and circuit breakers with 1000V megger, and compare with previous record. Repair as necessary.","Measure the insulation resistance of the secondary wiring selected on random basis with a 500V megger and record results. (It must not be less than 0.5 megohm).","Check continuity of all control circuits.","Measure circuit breaker contact resistance.","Carry out injection testing of all relays.","Carry out insulation resistance measurement of instrument transformers.","Clean and lubricate the circuit breaker housing safety shutter mechanisms.","Manually check the operation of the safety shutter mechanisms in accordance with manufacturer’s instruction procedures.","Inspect and clean the main isolating contact orifice bushings, using a clean, dry and non fluff cloth.","Clean the isolating contact plugs, using a carbon tetrachloride or silver polish, and under no circumstances abrasive material. Apply a thin film of silicon grease or petroleum jelly.","Clean and lubricate all moving surfaces of the position selector mechanism, including wheels, track and operating handle mechanism."]}},"EL-04":{"name":"Distribution and Final Branch Circuit Panel boards","frequencies":{"Quarterly":["Visually check all MCCB’s and/or isolators for any signs of arcing, burning or overheating. Carry out repairs as necessary.","Test any residual current devices (RCD’s) where available by using their integral test mechanism.","Check contactors for undue noise or overheating. Check indicator lights and push buttons.","Clean out dust and debris from the individual items of equipments with the aid of a vacuum cleaner.","Check the loading of all outgoing circuits and record readings."],"Bi-Annually":["Carry out tasks as detailed Quarterly.","Check the operation of all breakers, isolators, RCD’s etc. and ensure mechanisms are working in order. Correct any defaults.","Check that the rating of the MCCB is correct with regard to loading cabling, type of load etc. with particular reference to design data. Report any overloading and/or loads that are up to the set rating of the breaker. Report need for adjustment.","Check for proper fixation of all circuit breakers, security of all electrical termination and connections, and tighten as necessary.","Check that all barriers and guards are in place and secure. Adjust as necessary.","Check that all trunking, conduit or cable gland terminations associated with the panel are secure. Adjust as necessary.","Check that doors can be securely closed. If a lock is provided, check that it functions correctly.","Ensure that 380Volt and other warning labels are in position where applicable.","Check that phase discs and labels giving the panel and circuit references are securely fixed to the enclosure door. Replace or provide any missing items and update information as necessary"],"Annually":["Carry out tasks as detailed Bi-Annually.","Test earth continuity of incoming supply circuit and measure loop resistance of each panelboard.","Check all exposed cable insulation for signs of damage inside each panelboard. Correct any defects.","Check enclosures for paint work condition and signs of corrosion. Correct any defects.","With a 500V Megger, test insulation resistance between busbars, and between busbars and earth. (N.B. All circuit breakers must be in “Open” position),","Select at random two circuit breakers out of each panelboard and test its time-current curve using appropriate current injection test instrument. Report any discrepancies. (Tests are to be carried out in accordance to NFPA 70B, section 18-10, 2.4)"]}},"EL-05":{"name":"Static Uninterruptible Power Supply UPS","frequencies":{"Daily":["Check the installation and operating conditions: distance from wall, ventilation inlet and outlet, vents free, operating temperature, especially for the batteries.","Check that no faults are signalled by the lights.","The battery is automatically checked by the equipment and it indicates if the batteries should be checked or a battery fault is present.","Check that all fans are working properly.","Check all the fuses, replace if necessary.","Check the thyristors of the charger."],"Annually":["A complete check-up can be done only by qualified personnel certified by UPS Supplier.","Check the status of the batteries through regular test (no supply and temporarily load)","Check the maintenance by-pass switch","Check the operation of the UPS in both cases, once the electricity is ON and the other when electricity is OFF","Check Fans and Ventilation of the UPS","Check if no permanent fault appears at its control panel."]}},"EL-06":{"name":"Lighting And Small Power","frequencies":{"General Instructions":["Prepare a “Log Book”, complete with all necessary forms to record the work carried out and any special notes.","Ensure that details of lighting installations, luminaires (make, type, date of installation, size and type of lamps) and any other relevant data are listed in the Log Book.","Defects noted during inspection checks and tests shall be noted in the logbook.","Dangerous defects shall be reported directly to the user, and the affected luminaire is to be disconnected from the electrical supply, and reported to the management.","Remedy minor defects using tools and materials readily available.","Refer to suggested lamp life guide at the end of this schedule.","Harsh abrasive cleaners and organic solvents should not be used for cleaning lighting units.","Staining of aluminium reflectors and yellowing of plastic reflectors can sometimes be removed by pre-cleaning with metal polish or a mild abrasive paste. Painted or stove enamelled surfaces must not be abraded to remove stains or to restore colour"],"Weekly":["Visually inspect all luminaires to ensure that they remain clean.","Check all lighting units and replace any failed lamps, using same type, size and rating.","Correct any defective floodlight/luminaire immediately. Replace worn seals or gaskets and broken glass fronts or covers where required."],"Monthly":["Carry out tasks as detailed Weekly.","Check all circuits for proper function and correct any defective ones immediately (breakers are ON, power is available to all circuit outlets and visual inspection of wiring, fixing, support, etc.).","Clean all luminaires and floodlights externally only with a damp cloth or sponge. An antistatic solution can be used.","Simulate mains failure condition on non-maitained emergency lighting units by putting off the power supply for a short period, to ensure correct functioning. Correct or replace any defective unit immediately.","Ensure correct operation of remote or local control where applicable.","Check incandescent lighting fixtures and relamp at 2000 hours running time as applicable to type of lamps."],"Bi-Annually":["Carry out tasks as detailed for Monthly.","Check local switches (were provided) for correct operation and check security of switches and plates. Correct any defects.","Check cable and terminal exterior conditions to luminaires or floodlights. Replace any defective equipment. Correct as necessary or replace devices.","Visually inspect socket outlets and weatherproof plates for broken, damaged or deteriorated parts.","Inspect disconnect switches for proper fixation, loose springs, breaks or cracks in insulation, signs of flash over, clamps and straps, loose connections, blades and contacts, locking and interlocking mechanism, cable insulation for signs of overheating. Correct as necessary."],"Annually":["Carry out tasks as detailed for Bi-Annually.","Re-lamp all fluorescent luminaires and metal halide floodlight in public spaces using same type, size and rating of lamps respectively.","Dispose of all lamps in a clean and safe professional manner. (Discharge lamps contain toxic substances. Wear protective gloves for this task).","Check security of all fixings, suspensions, poles, supports and cable termination, etc. and correct any defects.","Clean down all luminaires using compatible cleaning agent, damp cloth and rinsing where necessary, then dry up with dry cloth.","Examine lamp holders, sockets, fuses, fuse carriers or holders, control gear, cables and terminations, and internal wiring for signs of overheating and corrosion. Replace any defective component.","Check insulation resistance of socket outlet circuits (taking a minimum of two socket outlets) using a megger 500V. (Insulation resistance should not be less than 0.5 megohms). Check continuity of earth conductors.","Test insulation resistance of disconnects switch circuit and continuity of earth conductors.","Carry out painting of all supports, brackets and poles.","Re-lamp all lighting fixtures with high pressure mercury vapour lamps (below 150W only) using same type, size and rating of lamps where applicable in public areas after every 1000 hours, elsewhere when 20% of lamps are burnt."],"Two-yearly":["Carry out tasks as detailed for Bi-annually.","Test insulation resistance of all lighting circuits selected on random basis (shall not be less than 0.5 megohms) earth continuity and check condition of insulation, conduits, flexible conduits, and connections at junction boxes and at luminaires.","Re-lamp all high pressure sodium fixtures and luminaires (150W and over) using same type, sizing and rating of lamps"]}},"EL-07":{"name":"Earthing System","frequencies":{"Bi-Annually":["Check security of connections to main earth bar and tighten as necessary.","Check the integrity of all bonding connections and ensure that they remain secure and tight.","Check the integrity of the main neutral earthing connection at the L.V. switchgear neutral or at the transformer neutral. Ensure that a false leakage tripping will not occur.","Test electrode resistance between main earth bar and the electrode at the substation (once during the winter and once during the summer).","Inspect all the earthing installation for damage, deterioration and corrosion; check the conductor fixings for security, the connections for tightness and the continuity of earthing conductors.","Clean out all inspection pits and ensure lids fit correctly, and are appropriately marked as initially installed."]}},"EL-08":{"name":"Lightning Protection  System","frequencies":{"Bi-Annually":["Check the fixings of conductors and components for security and check the installation for damage, deterioration and corrosion.","Ensure bonding of the lightning protection system to the main earth bars","Check and verify that metallic structures are bonded to the lightning protection installation.","Test the electrical continuity of the conductors, bonds and joints.","Measure the resistance to earth of each earth rod or group of earth rods when disconnected from the installation. Compare the measured resistance with previous test results and investigate any significant change in resistance.","Measure the resistance of the installation o earth from random points in the installation. The resistance to the general mass of earth from any point of the complete installation should not normally exceed 10 ohms.","Record the situation of the installation, the measured earth electrode resistance, the individual earth rods or group of earth rods and the highest resistance measured at random points on the installation.","Clean out all inspection pits and ensure concrete lids fit correctly.","Inspect vertical down conductors and earth terminations. Check that conductors are securely fixed to the structure.","Check by air terminals, connections at air terminals or structures behaving as air terminals"]}},"EL-09":{"name":"Elevators","frequencies":{"Monthly":["Ride car, observing starting and stopping, operation of doors, check for unusual noises and abnormal temperature rises. Report to office if any major repair to be carried out.","Check condition of pit and clean if necessary. Keep car top clean.","General inspection of machine, sheaves, worm and gear motor, brake, relays, selector, etc.","Empty drip pan. Note: OIL SHOULD NOT BE REUSED.","Observe brake operation, check brake linings, adjust brake when necessary.","Observe brake operation, check brake linings, adjust brake when necessary.","Inspect governor working parts and lubricate, and check governor switch.","If rails are lubricated check condition and lubrication.","Check lubrication of governor tension sheave.","Clean sills and tracks and lubricate.","Check interlocks and rope switches.","Check indicators, arrival gong, etc."],"Quarterly":["Carry out tasks as Monthly.","Check main line switch fuses for heating.","Check compensating chain hitches when used.","Check E-landing/PAB switches.","Check levelling both directions.","Observe thrust bearings and end play.","Observe worms and gear for end play and check bearings.","Check hoist and governor ropes and lubricate when required.","Clean cam support and check fastenings.","Check for tightness of fish plate bolts, anchors bolts, etc.","Replace gear oil for new installations.","Equalize rope tensions on new installations.","Check gear oil level and fill up.","Check alarm bell system.","Check emergency switch.","Check safety parts and lubricate.","Check adjustments of car shoes.","Check counterweight to buffer clearance and adjust.","Check oil in case of oil buffers.","Check safety rays if used."],"Bi-Annually":["Carry out tasks as Quarterly.","Check buttons and switches in car operating panel.","Emery all the sills if required.","Check overload settings.","Check and adjust overload when used.","Check all resistance tubes.","Check and set all the relays timings.","Seal all oil leakages.","Check and adjust door operator, cams and switches.","Check alignment of door operator linkages.","Check entrance door rollers and adjust eccentric rollers when required.","Check door shoes, replace if required."],"Annually":["Carry out tasks as Bi-annually.","Clean motor armature and MG sets with blower or vacuum.","Check armature and motor clearances.","Check motor and MG set connections.","Lubricate guide shoe stems.","Check and clean fuse and holders.","Check deflector, car and counterweight sheaves are tight on shafts, sound spoke and rims with hammer for cracks.","Check hall button contacts, springs, wiring, clean and lubricate as required.","Check car steadying clamps.","Check clearances for car safety shoes.","Check wear, insulation, handing and junction box connections of travelling cables.","Clean and check guide rails, cams and fastenings.","Inspect limit switches and lubricate pins and rollers.","Carry out safety test on no load.","Cut and remould hoist ropes to maintain counterweight to buffer clearance.","Check the hoist ropes for broken wire and lubricate if required.","Check and clean the sleeve and plunger of the electro-magnetic brake and readjust the brake.","Carry out complete readjustments if required."]}},"EL-10":{"name":"Escalators","frequencies":{"Monthly":["Inspect the escalator in general for visible damages and usury.","Check the good functioning of the stop switches.","Check the good operation of the control panel.","Check the regular and silent travel of the steps.","Inspect the play between two consecutive steps, and between the steps and the plinths.","Check the alignment of the steps grooves.","Inspect the combs for any broken teeth, and check the tightness of the bolts.","Inspect the plinths for any damages.","Check the play between the step and the guide.","Check the synchronism in travel between the handrail and the steps.","Check the handrail guides.","Check the good functioning of the handrail entry switches, inspect the brushes.","Lubricate the step chains.","Inspect the steps traversing under the comb plate.","Drive station: - Check the good functioning of the security switches. - Check the cleanness - Inspect for any oil leakage. - Check the regular and silent operations.","Measure the breaking distance and adjust if necessary. Inspect the break pads.","Check the oil level of the automatic lubricator."],"Bi-Annually":["Carry out tasks as Monthly.","Inspect the fixation of the steps to the guides.","Inspect the cleanness of the guide rails.","Inspect the play between the rolling devices in the guide rails.","Inspect the step chain tension device.","Inspect the handrail drive unit.","Inspect the handrail adjusting device.","Inspect the oil level in the reducer.","Inspect the position of the handrail to the guide rail."]}},"EL-11":{"name":"Dimming Controls","frequencies":{"Annually":["Check dimming and switches modules within the dimming panel.","Check the setting of all presets switches regarding the scenes and channels.","Check the interfaces with other systems such as fire alarm.","Check overheating and the ventilation of the room housing the dimming panel.","Clean using appropriate means the accumulated dust in the panels.","Check all electrical connection."]}},"EL-12":{"name":"Power factor correction capacitors","frequencies":{"Monthly":["Check the connection of capacitor bank to switchboards.","Check the good functioning of the switching of capacitor banks based on the variation of the loads.","Check the good operation of its control panel.","Test and inspect the improvement of power factor.","Clean the accumulated dust using appropriate cleaning means."],"Annually":["Check all reactors","Check all contactors","Check all cables and connection","Check manufacturer and installation settings","Check alarm history","Check out the right settings of the circuit breakers and fuses ratings according to the capacitor range."]}},"EL-13":{"name":"Motor Control Centre","frequencies":{"Annually":["Bolted connections should be tight. Discoloration, excessive corrosion, embrittled or discolored insulation may indicate an overheated connection.","Inspect all cables for tight connections and ample support.","Inspect control wiring for signs of wear and damage. Replace wire wherever doubtful.","Examine resistors and other devices prone to over heating.","Open all hinged doors and remove bolted panels.","Clean insulation thoroughly.","Withdraw and clean all draw-out components.","Clean the stationary portion of the switchgear by wiping with a Clean cloth. Use dry, compressed air in inaccessible areas.","Remove the covers of all panel devices where possible. Check wiring for secure connections. Clean contacts on relays and switches wherever necessary. Replace covers.","Remove air filters when used. Flush with clean water if necessary. Coat filters with Randolf Products’, Super Coat Adhesive or equivalent."]}},"EL-14":{"name":"Central Battery Inverter","frequencies":{"Annually":["Carry out tasks as Annually","Inspect all battery connections (battery to battery, and battery to terminal block) for the presence of corrosion. Clean and retighten all connections to factory specifications","Check and recalibrate the charger output voltage and current settings","Check the input and output parameters.","Check the cooling fans","Exercise all circuit breakers","Run a system performance check by simulating an input power outage and discharging the batteries to 87.5% of nominal voltage","During the system performance check, take periodic battery readings to determine battery array capability for stated system run time","Verify the operation of all installed options and remote panels","Clean the inside and outside of all system cabinets","Provide a list of any and all items that could possibly prevent the unit from performing its intended function during a power outage"]}},"EL-15":{"name":"Transfer switches","frequencies":{"Monthly":["Test the transfer switch’s automatic control system","Check the operation of manual by pass.","Inspect the cleanness of the switch."]}},"EL-16":{"name":"Medium Voltage Generator (Generator Plant)","frequencies":{"Daily":["Check air starting motor lubricator oil level.","Drain air tank moisture and sediment.","Check cooling system coolant level.","Inspect/Replace/lubricate driven equipment.","Inspect engine air cleaner service indicator.","Clean engine air precleaner.","Check engine oil level.","Drain fuel system primary filter/water separator.","Drain fuel tank water and sediment.","Check governor actuator oil level. 11.00 Inspect instrument panel."],"Every 50 Hours or Weekly":["Inspect/replace zinc rods."],"Every 250 Service Hours or 6 Weeks":["Test air shutoff.","Clean air starting motor lines screen.","Test/Add cooling system supplemental additive.","Obtain engine oil sample.","Check governor actuator linkage.","Check oil mist detector"],"Every 500 Service Hours or 3 Months":["Inspect engine mounts.","Check engine protective devices.","Clean/Replace oil mist detector"],"Every 1000 Service Hours or 6 Months":["Analyze cooling system coolant.","Inspect/Adjust engine valve lash.","Inspect engine valve rotators.","Lubricate barring device.","Inspect engine air cleaner service indicator.","Check engine mounts.","Change engine oil filter.","Inspect exhaust piping.","Replace fuel system secondary filter.","Clean/Inspect magnetic pickups.","Lubricate prelube pump"],"Annually":["Drain aftercooler condensation.","Inspect/Adjust engine valve lash.","Inspect engine valve rotators.","Clean/Replace oil mist detector.","Analyze cooling system coolant.","Clean air starting motor lubricator bowl.","Inspect starting motor.","Calibrate engine protection devices."]}},"EL-17":{"name":"Medium    Voltage    Starters    (VFD    and    Auto Transformer)","frequencies":{"Daily":["Check that all meters and indicators are functioning correctly. Note readings and compare with those taken previously.","Check alarm indicators on the front compartment of the switchgear and transformer cabinet, carry out any corrective action as necessary.","Check for overheating, vibration and undue noise etc., and report to the Management for correction or repair immediately. Carry out repair as necessary.","Visually inspect indicator lamps and display units, replace any faulty ones as necessary, or check any wire disconnection.","Check warning and indication labels are securely in position"],"Bi-Annually":["Clean and free from dust inside and outside the switchgear or transformer cabinet, one at a time; using compressed air and a suitable plastic nozzle.","Check the battery and charger (following the charger instruction).","Check the electrical and mechanical operation of the MV switchgear and transformer with OFF or ON load, following the manual instructions.","Visual inspection, correction and replacement if needed for water cooling unit, power capacitors, other capacitors, Fiber optic cables and cable connections."],"Annually":["Carry out tasks as described Bi-Annually.","The switchgear and transformer rooms shall be kept as clean and free from dust as possible. All accumulations of dust inside the switchgear and the transformer cabinet should be removed by blowing with compressed air or vacuum cleaner, using plastic nozzles. Finish by wiping with cloth moistened in alcohol.","Check all control and power cables and busbar joints.","Check all bolts are well tightened with a torque wrench.","Check the damping of cable bundles and that no cable is passing in sharp edges or corners.","Check all fixing components especially: the cover of busbar compartment, door access, tumbler, motor drive, transformer cabinet, protection relay, auxiliary relay, indicators, push buttons and selector switches.","All metering and protection units should be checked."]}},"EL-18":{"name":"Structured Cabling Network (SCN)","frequencies":{"Weekly":["Inspect reports from operator on any malfunction or special management requirements.","Sort out equipment tanks from on-site tasks and all specialist staff for immediate attendance in case of SCN link failures or disorders including but not limited to the following: - Breaks or fault of cables in horizontal or backbone SCN. - Breaking of Work area telecommunication connectors. - Faults of termination hardware elements in mounting racks or telecommunications facilities. - Undetected errors or cable system failures","Move/Add/Change support","Carry out immediate repair of failures on SCN link(s) reported."],"Monthly":["Carry out Tasks as Monthly","Visual inspection – Control Physical continuity of cable system components."],"Quarterly":["Carry out tasks as Monthly.","Check BDF, IDF and server rooms for any SCN broken parts or defects.","Inspect connections for any defects, poor connections, loose wires, and broken parts. Correct or repair immediately.","Inspect power supply, tighten connections, measure voltage.","Check UPS outputs as per manufacturer recommendations.","Inspect, clean and check the UTP/Fiber links, access features as per schedule of assignment.","Prepare a logbook such that each SCN link grade and servicing is recorded.","Check the mounting of wall/ceiling type devices sets and cable connections.","Check and inspect SCN links for loose connections, damages or faults. Tighten if necessary and check all couplings, connectors and cable insulation. Do any relative repair."],"Bi-Annually":["Carry out tasks as Quarterly","Dusting telecommunications outlets in order to protect electrical characteristics from dust content.","Dusting telecommunications connectors of work areas in order to protect electrical properties of cable against dust content"],"Annually":["Carry out tasks as Bi-annually.","Rerun patch cords and cross connect wires in order to provide rerun of patch and equipment cords and cross connect wires, and easy adm eparation of pergolas","Check all Bolts and Nuts if it was tightened properly (Greased all Threads)","Apply paint to manufacture specific pain coats to match existing","Regularly repair & replace units that are damaged or missing & evidence of replacement.","Submit a written report of all findings to the consultant/ owner.","For further information, refer to supplier and manufacturer’s instructions."]}},"HA-LS-06":{"name":"Walls","frequencies":{"Bi-Annually":["Initiate proper traffic control safety procedures at jobsite.","Check and repair any cracks and damages.","Check paint for cracking, peeling, breaking down falling down, deterioration, and repair defected areas.","Check paint for any change of appearance, change of color, soiling, staining etc.… and repair.","Repaint all the walls each every five years or as needed.","For wall cladding please refer to [STONE CLADDING PMI no. HA-LS-0X]","Submit a written report of all findings to the consultant/ owner.","For further information, refer to supplier and manufacturer’s instructions."]}},"HA-LS-07":{"name":"Flag Poles","frequencies":{"Quarterly":["Initiate proper traffic control safety procedures at jobsite.","Check for all fixation.","Check and replace all parts cleats, finials, pulley systems, halyards (whether external or internal), base plates and flag if it’s corroded or damaged.","Check all Bolts and Nuts if it was tightened properly (Greased all Threads).","Check for smooth running of halyard system and replace halyard in cease of deflective functioning.","Check and painting aluminum or steel poles to renew appearance.","Check and change soiled flags for clean.","Submit a written report of all findings to the consultant/ owner.","For further information, refer to supplier and manufacturer’s instructions."]}},"HA-LS-08":{"name":"Built In Furniture","frequencies":{"Bi-Annually":["Initiate proper traffic control safety procedures at jobsite.","Check joints.","Check for any cracks.","Check and replace units that are loose, chipped, broken, stained, or otherwise damaged or if units do not match adjoining units, install in fresh mortar or grout, pointed appropriate to eliminate the evidence of replacement.","Check & apply sealer regularly.","Submit a written report of all findings to the consultant/ owner.","for further information, refer to supplier and manufacturer’s instructions."]}},"HA-LS-09":{"name":"Fountains","frequencies":{"Quarterly":["Initiate proper traffic control safety procedures at jobsite.","Visually inspect & repair for brick or concrete cracks.","Remove and replace units that are loose, chipped, broken, stained, or otherwise damaged or if units do not match adjoining units.","Install new units to match adjoining units; install in fresh mortar or grout, pointed to eliminate evidence of replacement.","Check and repair the mortar or grout with matching pointing.","Check and adjust the elevation of fountains.","Submit a written report of all findings to the consultant/ owner.","for further information, refer to supplier and manufacturer’s instructions."]}},"HA-LS-10":{"name":"Way Findings","frequencies":{"Quarterly":["Initiate proper traffic control safety procedures at jobsite.","Check regularly fasteners and anchors to guarantee secure attachment as per manufacturer’s recommendations.","Inspect that all signs be level, plumb and at correct heights, with sign surfaces free of distortion, discoloration or any other defects in appearance, and repair as to manufacturer’s recommendations.","Check and amend any failure including the deterioration of metal and polymer finishes beyond normal weathering, including pitting and corrosion.","Check and amend any failure including the deterioration of embedded graphic image colors, including excessive fading, non-uniform fading.","Verify joints exposed to weather to exclude water penetration; repair if any failure.","Submit a written report of all findings to the consultant/ owner..","For further information, refer to supplier and manufacturer’s instructions."]}},"HA-LS-11":{"name":"Fences","frequencies":{"Bi-Annually":["Initiate proper traffic control safety procedures at jobsite.","Check conditions of handrails, gates and fences, and make necessary repairs.","Check regularly fasteners and anchors to guarantee secure attachment as per manufacturer’s recommendations. Tighten loose elements.","Check paint for signs of rust, cracking, peeling, breaking down, falling down, deterioration, and repair defected areas.","Touch-Up Painting: Clean field welds, bolted connections, and abraded areas of shop paint, and paint exposed areas with same material used for shop painting. Apply by brush or spray to provide a minimum dry film thickness of 2.0-mils. Apply paint to manufacture specific paint coats to match existing.","Fabricate joints exposed to the weather to exclude water or provide weep holes.","All play fields fences surrounding athletic courts to be checked regularly for wear and-tear and repaired or replaced as needed.","Check fences latching and locking operation.","Check, adjust and lubricate fence’s door closures. Lubricate door hinges – using door hinge lubrication as per manufacturer’s recommendations","Check and repair/replace units that are damaged or missing ad install in manner as o riginal was installed and eliminate evidence of replacement","Submit a written report of all findings to the consultant/ owner.","for further information, refer to supplier and manufacturer’s instructions."]}},"HA-LS-12":{"name":"Stabilized Sand","frequencies":{"Annually":["Initiate proper traffic control safety procedures at jobsite.","Check and repair cracks.","Check and remove/replace the stabilized surfacing damaged or defective or does not meet the requirement. As per specifications & Manufacturer’s recommendation.","Check stabilized surfacing as clean and level as possible by removing surface stains, spillage of materials.","Submit a written report of all findings to the consultant/ owner.","for further information, refer to supplier and manufacturer’s instructions."]}},"HA-LS-13":{"name":"Carpark Shade Structure Finish","frequencies":{"Bi-Annually":["Initiate proper traffic control safety procedures at jobsite.","Inspect shade fabric regularly.","Check for any damages caused by sun, wind, etc.… and repair","Check for fixation, cables, etc… to guarantee secure attachment as per manufacturer’s recommendations.","Submit a written report of all findings to the consultant/ owner.","for further information, refer to supplier and manufacturer’s instructions."]}},"HA-LS-14":{"name":"Synthetic Rubber Tiles","frequencies":{"Bi-Annually":["Initiate proper traffic control safety procedures at jobsite.","Check joints between tiles and repair defected ones.","Check for any cracks/ damages and replace defected ones.","Check level and adjust when necessary.","Submit a written report of all findings to the consultant/ owner.","for further information, refer to supplier and manufacturer’s instructions."]}},"HA-LS-15":{"name":"Play Equipment","frequencies":{"Quarterly":["Initiate proper traffic control safety procedures at jobsite.","Insure equipment’s stability, safety, reliability and correct functioning by regular inspections.","Ensure that foundations and other hard objects are adequately covered by safety surfacing at all times.","Repair or replace loose or missing components and close equipment that creates a hazard users.","Repair or replace damaged, defects, worn down, missing components. Tighten loose connections. Grease or oil adequately.","Ensure shock-absorbing surfaces are operational, clean and safe.","Correct safety hazards immediately or prohibit access until the problem is corrected. Guarantee a safe play environment.","Replenish all worn paint or other surfacing routinely with manufacturer authorized coatings. All wooden elements to be checked and repaired in case of rot or fungi infestation.","Replace joints that show severe corrosions or heavy wear and tear.","Apply preventive maintenance: treat and seal as per manufacturer’s recommendations.","Athletic courts hoops and nets to be checked regularly for wear-and –tear and repaired or replaced as needed.","Submit a written report of all findings to the consultant/ owner.","For further information, refer to supplier and manufacturer’s instructions."]}},"ME-01":{"name":"Centrifugal Water Chillers","frequencies":{"Safety Precautions":["The Safety Code for Mechanical Refrigeration ANSI/ASHRAE 15-1978 contains the recognized standards to assure the safe installation, operation and inspection of refrigeration systems. The purpose of this Code is to establish reasonable safeguards to life, limb, health, and property.","It is important that those responsible for the installation, operation and maintenance of this system be familiar with this Code.","Only experienced, qualified personnel should install, operate or maintain refrigeration equipment. They should be familiar with and adhere to local safety regulations and procedures.","All refrigerants are potentially hazardous and should be treated with care.","Dangerous voltages are present in the electrical components which can cause serious injury, electrocution and equipment damage. To avoid serious injury and/or equipment damage, all equipment must be de-energized, disconnected and isolated before any adjustments, servicing, wiring parts replacement, or any other acts requiring physical contact with the electrical or mechanical working components of the equipment. This must be done to prevent accidental contact with live or moving parts. It is rec","Ensure that all equipment doors are closed and protective covers are in place, except when maintenance is being performed by qualified personnel, to prevent electrical shock and personal injury.","Safety guards must be in place after any service and before operating the equipment.","Precautions must be taken to avoid contact with any surfaces that could cause skin burns.","Under no circumstances should an attempt be made to remove a component or cover on a unit which forms part of refrigeration circuit before making certain that no pressure is present on the refrigerant side of the item.","For the protection of personnel and property, the refrigerant must be removed from any section or component of the system before any refrigerant retaining part is loosened. Pump out as much refrigerant as possible from the section to be opened. Make sure control valves are opened where necessary to avoid trapping refrigerant. Do not depend on solenoid valves as isolation valves while making repairs.","When opening any pressurized component, care must be taken to relieve the pressure in a safe manner.","It is sometimes necessary to discharge small amounts of refrigerant from the section to be serviced. Be sure that the rate of discharge can be easily controlled and that it can be shut-off quickly if necessary. Discharge of refrigerant to the atmosphere should be avoided. Whenever possible, refrigerant should be transferred to a container approved for this purpose by applicable safety codes and standards. Follow refrigerant manufacturer's recommendations when transferring refrigerant.","Never discharge refrigerant into an area that does not have sufficient ventilation or where an open flame or electrical spark is present.","Always have an observer nearby when working on any part of a refrigeration system so that help is available in an emergency.","Under no circumstances should personnel be allowed to smoke while servicing or repairing systems using fluorinated hydrocarbon refrigerants. Such refrigerants when passing through the lighted end of a cigarette produce phosgene gas which is poisonous.","Avoid spilling liquid refrigerant on skin or getting it into the eyes. Use safety goggles. Wash any spills from the skin with soap and water. If any enters the eyes, immediately flush eyes with water and consult a physician.","Do not attempt to repair or recondition any relief valve when corrosion or build- up of foreign material (rust, dirt, scale etc.) is found within the valve body or mechanism. Replace the valve.","Double check that coupling nut wrenches, dial indicators or other items have been removed before rotating any shaft.","Use care when working near or in line with a compressed spring. Sudden release of the spring can cause it and objects in its path to act as projectiles which may cause serious injuries.","Do not step on refrigerant lines. Broken lines can whip about and cause serious injuries.","Be aware that certain automatic start arrangements can engage the starter. Open the disconnect ahead of the starter in addition to shutting off the machine or pump.","In addition to the above read the manufacturer operation and maintenance manual for other safety precautions, and follows the manufacturers maintenance procedure."],"Weekly":["Mark the oil level on the reservoir sight glass, and observe the level each week while the machine is shut down. If level goes below the lower sight glass, the oil re-claim system will need to be checked for proper operation. If additional oil is required follow the manufacturer procedure for adding oil."],"Monthly":["Carry task as detailed for weekly.","Check for refrigerant leakage. Repair or adjust refrigerant level if necessary. Follow manufacturer’s recommended procedures in performing the process.","Check oil pumps for correct operations. Check pressure gauges valves, oil piping, refrigerant piping, temperature indicators, flows indicators. Report on conditions.","Check chilled and condenser water connections, valves and accessories for leakage, alignment, and damage. Report on conditions.","Check guide vane linkage for developed slack. If slack is detected follow manufacturer procedures for eliminating the slack.","Check contact seal. If oil is leaking between the contact sleeve and the packing gland, the O-ring should be checked and replaced following manufacturer procedures.","Check the motor rotation as indicated by the manufacturer operation and maintenance manual.","Check the oil pressure and compressor stop as indicated by the manufacturer operation and maintenance manual.","Check hot alignment of compressor with heat exchangers, gear, and driver. The alignment may be affected by the operating temperatures of the various components. Refer to the manufacturer maintenance manual for procedure.","Clean screens, louvers and air openings from any accumulated build-up of lint, dust, following the procedure set forth and the maintenance manufacturers manuals. Cleaning with water is not recommended. Manual or compressed air cleaning is preferred.","Check the lubrication system and make sure its functioning properly uses proper grade of oil maintained at recommended temperature and pressure.","Check bearings and gears for signs of wear. Excessive wearing can be sometimes detected thru increased vibration or increased bearing temperature.","Check all machine switches for proper functioning, and report conditions.","Compressor motor connection and all electrical connections: Tighten all terminal connections and main cable connections.","Control canter: vacuum the cabinet to eliminate dust built up. In the event of machine control malfunction refer to the manufacturer trouble shooting guide section for control checks and adjustments.","To ensure machine protection, the control test automated test should be done once per month.","Check the operation of the compressor motor and report any defects.","Clean motor from dirt and dust build-up and report motor conditions. Follow the recommendations of manufacturers for cleaning.","While electric motors are out of operation clean any buildup of dust, lint that could restrict the cooling air movement. Cleaning with water is not recommended. Manual or compressed air cleaning is preferred."],"Quarterly":["Carry out tasks as detailed for Monthly.","Inspect the starting equipment: inspect starter, contact surfaces for wear or pitting on mechanical type starters. Follow the manufacturer’s instructions for replacement or repair.","Starting equipment: vacuum or blow off accumulated debris with a high velocity, low pressure blower.","Starting equipment: turn power off and retighten all power connections"],"Bi-Annually":["Carry out tasks as detailed for quarterly.","Motor bearings: the oil reservoir of the self-lubricated bearing should be drained and refilled every 6 months. More frequent changes may be needed if severs oil discoloration or contamination occurs. Follow procedure set forth in the manufacturer’s maintenance manual. Note: use oil recommended by the manufacturers"],"Annually":["Carry out task as detailed for Bi-annually","Changing oil filter: change the oil filter annually or when the machine is opened for repair. Follow the procedure indicated by the manufacturer.","Oil reclaim filter: to be changed once per year or more often if filter conditions indicate a need for replacement. Change this filter with the cooler/condenser compressor vessel at 0 psig by transferring the refrigerant charge to the utility vessel.","Refrigerant filter: change the filter with the machine pressure at 0 psig by transferring the refrigerant to the utility vessel. A moisture indicating sight glass is located beyond this filter to indicate the volume and moisture in the refrigerant. If the dry eye indicates moisture, locate the source of water immediately by performing a through leak check.","Refrigerant float system: inspect as per Manufacturer recommendation or when utility vessel is opened for service. Transfer the refrigerant into the cooler vessel, or into a storage tank. Remove the float access covers, clean the chambers and valve assembly.","Make sure that all openings are free from obstruction and replace the cover gaskets as necessary.","Compressor coupling: clean and inspect the gear teeth in the compressor end coupling for wear. If teeth are worn, replace the tapered coupling hub, sleeve and O-ring. Install new gaskets.","Cooler and condenser: inspect and clean the cooler tubes and report conditions. Cleaning should be done as indicated by the manufacturers’ machine manual.","Cooler and condenser: inspect the entering and leaving chilled water temperature sensors for signs of slime or scale. Replace the sensor if corroded and remove any scale if found.","Condenser: check the pressure of the condenser; if the pressure is high check the condenser refrigerant temperature against the leaving condenser water temperature. If this reading is more than what the difference is supposed to be than the water may be duty or water flow may be incorrect. Repair as necessary.","Check and calibrate against the pressure gage reading. Refer to the manufacturer’s instructions manual for procedures.","Temperature sensors: check and calibrate temperature sensors. Refer to the manufacturer’s instruction manual for procedures."]}},"ME-02":{"name":"Ultraviolet Sterilizers","frequencies":{"Safety Precautions":["The following safety requirements are mandatory. Failure to carefully follow these requirements can cause injury to the operator and damage to the UV unit.","Never look at lighted blue ultra-violet lamps. Never operate the ultra-violet lamps outside the UV treatment chamber. UV lamp exposure can severely burn and damage eyes and skin.","Properly ground the UV treatment unit. Failure to properly ground the unit can result in sever electric shock hazard.","Provide water tight piping and compression nuts seals. Failure to do so can promote leakage and cause damage to electrical components, as well as, create electric hazards to operating personnel.","Disconnect power before servicing the unit. The UV lamps and electrical components are operated with high voltage electrical power. Only properly qualified personnel should attempt service.","Check pump strainers for large debris. Lubricate lid \"O\" ring before refitting and do not over tighten.","Check flow rate through the U.V. unit. Take water sample to be analyzed so that actual performance of sterilizer and efficiency are measured and verified.","Clean exterior surface of the U.V. unit according to manufacturer's recommendations2.","Log unit recording hours run, number of bleed clean cycles; flow through the U.V. unit and conductivity.","Check that all indicator lamps are operational. Repair as necessary."],"Monthly":["Carry out tasks as detailed for Weekly.","Disconnect water and electrical services and drain U.V. sterilizer.","Carefully remove quartz sleeve and clean using mild soap and hot water or a mild abrasive-cleaning agent.","Clean sensor window.","Return unit to normal operating conditions.","Inspect for overhead piping leaks. Correct and report as necessary."],"Annually":["Carry out tasks as detailed for Monthly.","Replace U.V. bulbs after 8,000 hours of use."]}},"ME-03":{"name":"Vertical split case water Pump","frequencies":{"Monthly":["Check pump operation via control panel. Report findings.","Check pump operation for undue noise and vibration. Report findings.","Check bearing temperature with an accurate temperature device; ensure it is below 180°F3. If hot inspect for over lubrication or misalignment.","Check the direction of rotation.","Check grease lubricated bearings for moisture and oxidation. If any contamination is present, remove and clean bearings. Grease up again with the proper type grease as recommended by the manufacturer.","Inspect bearings as per Manufacturer’s recommendation.","Ensure correct operation of all control panel indicator lamps. Replace any faulty lamp as necessary.","Tighten all terminal connections and main cable in the motor and pro-star."],"Quarterly":["Carry out tasks as detailed for Monthly.","Check for leaks at fittings and around flanges and connections. Repair any leak and replace any defective part.","Examine and test for full and free travel, checking for any leakage.","Check the screen of the strainer for build-up of solid material. Clean as required.","Check operation of valves. Valves should be fully closed then fully opened (Note the number of turns to fully close, so that valve can be reset to its original position). If operation of valve is stiff, lubricate as necessary, repeat opening and closing until clear, and then return valve to its original position.","Ensure correct operation.","Check for inadequate suction, discharge and shut-off heads against commissioning data.","Check for inadequate lubrication and overheated bearings4. Inspect lubricating system. Repair as necessary.","Check grease lubricated bearings for saponification. Inspect grease for whitish colour. If this occurs, wash bearings with a bearing cleaning solvent and replace the grease with the proper type as recommended by the manufacturer.","Check for end play of shaft. Report on condition, and advice on any necessary remedial work.","Check for presence of dirt, moisture and other accumulations. Clean as necessary.","Check for noisy running. Determine cause & repair as necessary.","Check holding down bolts for rigidity and security.","Check for evidence of strain on pipes and pump casing.","Check and ensure correct operation of all flexible connections, repairing or advising on the necessity of replacing damaged components.","Check condition of all associated insulation and covering. Repair and report any defects.","Inspect all piping supports for soundness and effective support of load.","Check and record motor running current5.","Inspect and tighten the electrical terminals.","Check wiring insulation & flexible connections. Secure & tighten as required.","Check high discharge pressure switch and calibrate if necessary."],"Bi-Annually":["Carry out tasks as detailed for Quarterly.","Check shaft or shaft sleeve for scoring and eccentricity. Repair or replace as necessary.","Check / tighten main cable terminal connections and monitoring / sensing circuits at the RTD terminal on the motor and in the pro-star relay all through."],"Annually":["Carry out tasks as detailed for Bi-Annually.","Calibrate all pressure and temperature gauges.","Check and tighten as required, report on condition of holding down bolts.","Remove rotating element and inspect for wear. Replace defective parts.","Clean out stuffing box piping. Remove any deposit or scaling.","Check seals and bearings for any damage. Adjust or replace as necessary.","Inspect pump casing and report any defect.","Test IR insulation resistance of stator windings, between phases and phase to earth using a 2500V megaohmmeter (preferably motor driven) for 60 sec. immediately after the shutdown of the machine, whilst the windings are hot and dry. The temperature should be recorded and IR measurements converted to a base temperature for future comparison. Always disconnect all voltage sources, surge arrestors, capacitors, or other low insulation sources before making a test. Lead-in cables can be tested as par","Clean dust and dirt on the motor stator.","Examine and report condition of all associated wiring facility and wiring, ensuring security of termination.","Inspect and clean all circuit breaker contact surfaces.","Check and clean enclosures, switches and push buttons.","Carry out tasks as detailed for Annually.","Clean out and renew the grease. An un-vented bearing should be packed only half full. (Sealed bearings need no attention for 5 years.)","Retighten all RTD alarm connections and test."]}},"ME-04":{"name":"Horizontal split case water Pump","frequencies":{"Monthly":["Check pump operation via control panel. Report findings.","Check pump operation for undue noise and vibration. Report findings.","Check bearing temperature with an accurate temperature device; ensure it is below 180°F. If hot inspect for over lubrication or misalignment.","Check the direction of rotation.","Check grease lubricated bearings for moisture and oxidation. If any contamination is present, remove and clean bearings. Grease up ag
