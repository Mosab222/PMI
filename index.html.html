r 5 years.)","Retighten all RTD alarm connections and test."]}},"ME-05":{"name":"Inline water Pump","frequencies":{"Monthly":["Examine pump unit and adjacent pipe work, together with associated connection for leaks and corrosion. Report findings.","Externally clean pumps and motors."],"Quarterly":["Carry out tasks as detailed for Monthly.","Test unit for excessive noise or vibration. Repair as necessary.","Inspect bearings and glands for wear. Lubricate bearings to manufacturer's recommendations. Repack glands as required.","Examine all pipe work and valves insulation. Repair any damaged section or item.","Examine and record delivery and suction pressure gauge, together with thermometers. Report any defect.","Inspect and clean strainers.","Test all manually operated valves, ensure full and free travel and correct settings. Check for leakage, adjust or replace valve glands as required. Remove all deposits and lubricate valve.","Examine pump drain points. Ensure they are clean and free from any foreign materials.","Inspect motor electrical terminals. Tighten if required.","Check and record full load running current.","Examine control switches. Check for proper operation and calibration."],"Annually":["Carry out tasks as detailed for Quarterly.","Examine and ensure motor ventilation airways are clear, remove all dirt and dust by vacuum cleaner.","Check and tighten as required, report on condition of holding down bolts.","Check and clean anti-vibration mounts. Repair or replace as necessary.","Check motor winding insulation. Report condition.","Examine and report on condition of all associated wiring facility."]}},"ME-06":{"name":"Booster Pump","frequencies":{"Monthly":["Examine pump unit and adjacent pipe work, together with associated connection for leaks and corrosion. Report findings.","Externally clean pumps and motors."],"Quarterly":["Ensure pump base is level, and pipe work not strained.","Examine and check units for leaks. Repair and report findings..","Examine nd warnings is mandatory for personnel involved in the operation and maintenance of this system.","Do not try to inspect the system before reading thoroughly the safe handling procedures described by the manufacturer."],"Monthly":["Check all valves for full and free travel. Adjust or re-pack valve glands as required. Lubricate valve stems as necessary."],"Quarterly":["Carry out tasks as detailed for Monthly.","Check all associated pipe work and connections for leaks. Repair as necessary and report findings.","Check pressure blow down drain valve. Replace if found defective.","Check pressure relief valves. Replace if found defective.","Clean strainer."],"Bi-Annually":["Carry out tasks as detailed for Quarterly.","Test and ensure security of all pipe brackets and supports.","Check and report on condition of holding down and all retaining bolts. Tighten as required. Replace any defective item.","Examine and ensure blow down drain pipes and valves are free from obstruction.","Check the gasket for signs of leakage.","Measure tank thickness by ultra-sonic tests.","Inspect tank for corrosion. Clean tank externally from all spots. Repaint if necessary."],"Annually":["Carry out tasks as detailed for Bi-annually.","Check and tighten holding down and retaining bolts. Report on condition.","Examine and ensure locking keys, bolts, etc., are secure.","Examine and ensure drain pipes are free from obstruction.","Examine, check, and report on condition of all anti-vibration mounts. Repair/Replace any damaged item."]}},"ME-08":{"name":"Closed Type Expansion Tank","frequencies":{"Monthly":["Check all valves for full and free travel. Adjust or re-pack valve glands as required. Lubricate valve stems as necessary."],"Quarterly":["Carry out tasks as detailed for Monthly.","Check all associated pipe work and connections for leaks. Repair as necessary and report findings.","Check pressure relief valves. Replace if found defective.","Test and ensure all pressure and temperature controls and ype).","Check bearing locking set screws and other set screws for proper tightness. All bearing races must be secure.","Lubricate fan motors.","Check motor RPM. Record data. Compare with commissioning figures. Report significant change.","Lubricate motor to the manufacturer’s recommendations.","Examine and ensure that motor ventilation airways are clear. Remove all dirt and dust by vacuum cleaning.","Check motor isolation mounts and fixings. Tighten as necessary.","Remove dirt accumulation from wheel and housing.","Check wheel, housing, and bolts and set screws for tightness.","Open up and examine filter frame work and casing for corrosion. Wire brush and paint with anti-corrosion primer. Report on condition.","Examine filter element seating for air leakage. Repair and re-join filter element seating as required.","Check filter element locking devices for security of fastening. Adjust, refit or replace defective fastenings to ensure air tightness.","Examine and calibrate manometer as necessary.","Ensure air tightness. Tighten gaskets, bolts brackets as necessary. Change defective items.","Clean outside and inside as necessary.","Check and ensure correct operation of all switches, controls and controllers. (Smoke detectors, manometers, motorized valves).","Examine and report on condition of all associated wiring facilities and wiring. Tighten all connections."],"Bi-Annually":["Carry out tasks as detailed for Quarterly.","Clean out external and internal dust and dirt from the unit.","Clean the coils by using a jet of air, steam or hot/cold water applied in the opposite direction to normal airflow. For dirty coils, comb out fins. Clean deposits on coil with brush where necessary with appropriate sterilising solution such as chlorine.","Check the bearing locking collar or set screws for tightness."],"Annually":["Carry out tasks as detailed for Bi-annually.","Check paint work for corrosion, if present determine and report cause. Clean, wire brush and repaint as necessary.","Check validity of pressure and temperature readings in gauges. Recalibrate or replace defective gauges.","Replace air filter if necessary.","Check CFM and pressure developed by the Air Handling Unit. Compare with previous commissioning results.","Clean fan wheels and shaft. Remove dust from fan shaft with emery cloth, and re-coat the shaft with a suitable varnish.","Carry out insulation resistance and earth continuity test, report results.","Check and calibrate all control devices."]}},"ME-11":{"name":"Vertical Floor Mounted Air Handling Unit","frequencies":{"Safety Precautions":["Start motor for short times only if cover is opened, otherwise you risk overloading the motor. For a short start-up with opened revision cover you should stay near the unit.","When adjusting regulating pulley do not exceed maximum impeller speed and admissible motor current consumption.","Disconnect the main supply before any servicing on the unit.","Only qualified and experienced personnel should carry out the service work on the refrigeration system and electrical system."],"Monthly":["Visually examine entire unit, report on condition and carry out remedial works as required.","Operate and examine for any undue noise, vibration, or rattling. Report and adjust as necessary.","Check tightness and air leaks between the different sections of the unit. Replace gaskets as necessary.","Check coils. Ensure no leakage to occur from coils, connections or pipe work. Adjust and report accordingly.","Vent air from coils. Ensure tightness of vent cock, check for leakage and adjust if necessary.","Check coils for dirt, corrosion or algae and clean with low pressure water.","Read differential pressure across filter. Alternatively, examine filter medium for dirt and discoloration. Clean or replace as manufacturer’s instructions. Record and report findings.","Check tensions of belt drives as per manufacturer’s recommendations and examine for wear and fraying. Renew defective belts.","Ensure correct ten ter frame work and casing for corrosion. Wire brush and paint with anti-corrosion primer. Report on condition.","Examine filter element seating for air leakage. Repair and re-join filter element seating as required.","Check filter element locking devices for security of fastening. Adjust, refit or replace defective fastenings to ensure air tightness.","Examine and calibrate manometer as necessary.","Ensure air tightness. Tighten gaskets, bolts brackets as necessary. Change defective items.","Clean outside and inside as necessary.","Check and ensure correct operation of all switches, controls and controllers. (Smoke detectors, manometers, motorized valves).","Examine and report on condition of all associated wiring facilities and wiring. Tighten all connections."],"Bi-Annually":["Carry out tasks as detailed for Quarterly.","Clean out external and internal dust and dirt from the unit.","Clean the coils by using a jet of air, steam or hot/cold water applied in the opposite direction to normal airflow. For dirty coils, comb out fins. Clean deposits on coil with brush where necessary with appropriate sterilising solution such as chlorine.","Check the bearing locking collar or set screws for tightness."],"Annually":["Carry out tasks as detailed for Bi-annually.","Check paint work for corrosion, if present determine and report cause. Clean, wire brush and repaint as necessary.","Check validity of pressure and temperature readings in gauges. Recalibrate or replace defective gauges.","Replace air filter if necessary.","Check CFM and pressure developed by the Air Handling Unit. Compare with previous commissioning results.","Clean fan wheels and shaft. Remove dust from fan shaft with emery cloth, and re-coat the shaft with a suitable varnish.","Carry out insulation resistance and earth continuity test, report results.","Check and calibrate all control devices."]}},"ME-12":{"name":"Propeller Fan","frequencies":{"As Required":["Visually examine entire unit and ensure correct operation. Report condition and carry out any remedial work as required.","Examine unit for any undue noise, vibration, or rattling. Report and repair as appropriate.","Examine fan shaft bearings and lubrication system. Check for shaft overheating8, lubricant dilution, or over lubrication. Adjust to ensure suitable lubrication according to the manufacturer's recommendations."],"Monthly":["Carry out tasks as detailed under weekly.","Lubricate or grease bearings according to manufacturer's recommendations."],"Quarterly":["Carry out tasks as detailed for Monthly.","Examine anti-vibration mountings; ensure their security and performance. Report and repair any defect. Replace items if necessary.","Examine and ensure all brackets, fixings, fan enclosure and housing to be secure. Check bolts for corrosion. Tighten and replace as necessary. Report on condition of supports.","Inspect shaft and bearings for wear corrosion and tightness. Repair or replace bearings as necessary.","Check shaft and bearings for end play. Report on condition. Replace bearings if necessary.","Examine motor to shaft alignment. Adjust if necessary.","Check bearing locking collars, retighten and repair as necessary.","Test bearings for wear and shaft end play. Report findings.","Check motor RPM. Record data. Compare with commissioning figures or design data. Report significant change.","Lubricate motor according to the manufacturer's recommendations.","Examine and ensure that motor ventilation airways are clear. Remove all dirt and dust by vacuum cleaning.","Check motor isolation mounts and fixings. Tighten as necessary.","Remove dirt accumulation from wheel and housing.","Check wheel, housing, and bolts and set screws for tightness.","Inspect flexible connections for leaks. Re-tighten brackets or gaskets as necessary. Replace a defective connection.","Ensure duct hangers rigidity and tightness. Tighten as necessary. Inspect condition of brackets, hangers, and bolts. Report accordingly.","Check and ensure correct operation of all switches, controls and controllers.","Examine and report on condition of all associated wiring facilities and wiring. Ensure security of termination.","Carry out insulation resistance and earth continuity tests. Report results.","Check voltage and amperage. Record data. Report any significant error."]}},"ME-13":{"name":"Centrifugal Suspended Inline Fan","frequencies":{"As Required":["Visually examine entire unit and ensure correct operation. Check for any undue noise, vibration, or rattling. Report condition and carry out any remedial work as required.","Examine fan shaft bearings and lubrication system. Check for shaft overheating10, lubricant dilution, or over lubrication. Adjust to ensure suitable lubrication according to the manufacturer's recommendations."],"Monthly":["Carry out tasks as detailed under weekly.","Lubricate or grease fan bearings according to the manufacturer's recommendations."],"Quarterly":["Carry out tasks as detailed for Monthly.","Examine anti-vibration mountings; ensure their security and performance. Report and repair any defect. Replace items if necessary.","Examine and ensure all brackets, fixings, fan enclosure and housing to be secure. Check bolts for corrosion. Tighten and replace as necessary. Report on condition of supports. If applicable, check fan basis, make sure that fans are levelled, and no cracks have developed on basis.","Inspect shaft and bearings for wear corrosion and tightness. Repair or replace bearings as necessary.","Check shaft and bearings for end play. Report on condition. Replace bearings if necessary.","Check bearing locking collar. Retighten and repair as necessary.","Check tension of belt drives and examine for wear and fraying. Renew defective belts.","Ensure correct tension on belts. Adjust as necessary.","Check alignment of driving pulleys. Rectify if incorrectly aligned.","Inspect drive pulleys for security on their respective shafts. Re-secure a loose pulley, tightening all security bolts and locks.","Check security of driving guards. Tighten or refit as necessary. Inspect guards for corrosion and replace an inadequate guard.","Test bearings for wear and shaft end play. Report findings.","Check motor RPM. Record data. Compare with commissioning figures or design data. Report significant change.","Lubricate motor according to the manufacturer's recommendations.","Examine and ensure that motor ventilation airways are clear. Remove all dirt and dust by vacuum cleaning.","Check motor isolation mounts and fixings. Tighten as necessary.","Remove dirt accumulation from wheel and housing.","Check wheel, housing, and bolts and set screws for tightness.","Inspect flexible connections for leaks. Re-tighten brackets or gaskets as necessary. Replace a defective connection.","Ensure duct hangers rigidity and tightness. Tighten as necessary. Inspect condition of brackets, hangers, and bolts. Report accordingly.","Check voltage and amperage. Record data. Report any significant error.","Check and ensure correct operation of all switches, controls and controllers.","Examine and report on condition of all associated wiring facilities and wiring. Ensure security of termination.","Carry out insulation resistance and earth continuity tests. Report results."]}},"ME-14":{"name":"Roof Top Exhaust Fan","frequencies":{"Quarterly":["Clean impeller and spinner and ensure no build up of dirt.","Check fan impeller for cracks, corrosion or other damage. Repair or renew as required.","Clean exterior surfaces, wheel and housing.","Remove dust build up on motor housing to ensure proper motor cooling.","Ensure that all bolts, anti-vibration mountings, locking collars, set screws and fasteners are to be present and secure. Tighten and replace if necessary.","Check fan casing for corrosion. Repair or renew as necessary.","Ensure that the fan bearings are in sound condition with adequate lubrication.","Check belt tension and adjust if necessary.","Check pulleys for wear and replace both pulleys and belts if wear is evident.","Ensure motor, drive and pulley are correctly aligned. Replace if aligned condition warrants it.","Grease motor according to manufacturer's recommendations.","Grease fan bearings as necessary.","Check operation of switch. Repair or replace as necessary."]}},"ME-15":{"name":"Fan Coil Unit","frequencies":{"Monthly":["Visually examine entire unit, report condition.","Operate and examine for any undue noise, vibration, or rattling. Report and adjust as necessary.","Check coil. Ensure no leakage to occur from coil, connections or pipe work. Adjust and report accordingly.","Vent air from coil. Ensure tightness of vent cock. Check for leakage and adjust if necessary.","Check coil for dirt, corrosion or algae growth. Report on condition and necessity of any remedial coil cleaning.","Wash the filter."],"Quarterly":["Carry out tasks as detailed for Monthly.","Examine and ensure all brackets, fixings are secure. Check bolts for corrosion. Tighten and replace as necessary. Report on condition of supports.","Examine and ensure drip trays, drain points, and drain pipe work to be free from dirt, scale, obstruction corrosion and algae deposits.","Check motor RPM. Record data. Compare with commissioning figures. Report significant change.","Lubricate motor bearings to the manufacturer's recommendations, if applicable.","Examine and ensure that motor ventilation air ways are clear. Remove all dirt and dust by vacuum cleaning.","Check motor isolation mounts and fixings. Tighten as necessary.","Remove dirt accumulation from wheel and housing.","Check wheel, housing, and bolts and set screws for tightness.","Check filter element locking devices for security of fastening. Adjust, refit or replace defective fastenings to ensure air tightness.","Check for any leakage. Repair as necessary.","Examine valves for leakage. Ensure full and free travel. Adjust or re-pack valve glands as required. Lubricate valve stem. Reset valves to their original position.","Examine strainers for leakage. Clean strainer as necessary.","Audibly check for cavitation noise in strainer. Repair as required.","Examine insulation. Repair any defective section.","Check condensate drain pipe work or hoses for blockage, corrosion, cracks etc. Repair as appropriate.","Ensure thermostat is functioning correctly. Report and re-set as appropriate. Replace any defective item.","Check and ensure correct operation of all switches and controls.","Examine and report on condition of all associated wiring facilities and wiring. Ensure security of termination.","Check voltage and amperage. Record data. Report any significant error.","Check and ensure satisfactory operation of regulating (3way or 2way) valve assembly. If necessary renew as per manufacturer's recommendations.","Carry out tasks as detailed for Quarterly.","Clean out external and internal dust and dirt from the unit.","Clean external surfaces and comb out fins. Clean deposits from coil with brush or compressed air."]}},"ME-16":{"name":"Air Compressors and Mechanical Dryers","frequencies":{"Safety Precautions":["Do not operate the dryer at pressures or temperatures in excess of the rated conditions shown on the nameplates. Operation at elevated pressures or temperatures may cause damage to the dryer or serious injury to personnel.","Dismantling or working on any component of the compressed air system under pressure may cause serious injury. Before dismantling any part of the compressed air system, vent the internal pressure to the atmosphere.","When switch is in \"OFF\" position, portion of control circuit remain energized. Disconnect power to the dryer before performing maintenance. Lock out power at main panel, then wait ten minutes before servicing.","Closed refrigerated systems are potentially dangerous. Work on the refrigeration system should be done only by a competent refrigeration mechanic.","Do not remove the covers, loosen or remove any fittings, connections or devices when this unit is in operation. Hot liquid and air under pressure that are contained within this unit can cause severe injury or death.","The compressor has high and dangerous voltage in the motor, the starter and control box. Before working on the electrical system, be sure to remove voltage from the system by use of a manual - disconnect – switch.","Before doing any mechanical work on the compressor. a) Shut the unit down. b) Electrically isolate the compressor by use of the manual disconnect switch in the power line to the unit. Lock and tag the switch so that it cannot be operated. c) Blow down the compressor and isolate the unit from any source of air.","Do not operate the compressor at higher discharge pressure than those specified on the compressor name plate or motor overload will occur. This condition will result in motor compressor shut down.","Use only safety solvent for cleaning the compressor and auxiliary equipment.","Always replace covers and guards, after maintenance functions are completed."],"Monthly":["Examine pressure gauges for correct operation adjusting line pressure to correct pressure if necessary.","Inspect V-belts tension and condition. Refer to manufacturer's catalogue for correct procedure. Ensure correct pulley alignment.","Clean condenser coils from accumulated dust and dirt with a soft brush or with air from a compressed air nozzle that limits the discharge pressure to 30 psig.","Depressurize the dryer. Dismantle and clean the separator and drain trap.","Check pressure switches on receiver for correct settings.","Check high air temperature and sensor switch for correct operation. Repair and report as necessary."],"Quarterly":["Carry out tasks as detailed for Monthly.","Examine compressor oil level and top up as required.","Replace coolant filter. The first coolant filter should be replaced after 150 running hours.","Examine and ensure all safety guards are secure.","Examine air intake/outlet filter(s), report on condition, replace if exhausted.","Ensure that the compressor, motor and ancillary equipment is left in clean condition.","Examine all pipework for condition, ensure security and rectify any leaks.","Examine valves and cocks, adjust glands as necessary, repacking as required.","Inspect and ensure that the compressor is attaining the correct pressure and adjust if necessary.","Examine and test all air dryer associated valves for full and free travel, checking for leakage, adjust or repack valve glands as may be required.","Inspect compressor and report any excessive noise or vibration,","Clean separator, scavenge screen and orifice every 1000 hour or quarterly which ever comes first. Replace separator element when the differential pressure reaches a maximum pressure of 12 psi at full load.","Check and ensure correct operation of motor starter.","Log on load motor current. Record data."],"Bi-Annually":["Carry out tasks as detailed for Quarterly.","Check, strip and clean automatic air release valve (safety valves).","Clean cooler cores.","Replace muffler cores."],"Annually":["Carry out tasks as detailed for Bi-annually.","Test and ensure safety valve operations at prescribed pressure, adjusting as required replacing any faulty/missing items.","Examine and ensure that all compressor and motor pulleys, key, bolts and lock nuts are secure.","Examine compressor/motor bearings for wear, reporting on their condition.","Clean the complete unit, de-rust and repaint as necessary.","Check that the regulating system operates properly, cleaning and adjusting as necessary.","Replace air filter.","Examine and ensure that motor ventilation airways are clear and remove all dirt/dust by vacuum cleaner.","Wipe down all panels/casing and report on their condition.","Clean out external and internal dust from the compressor unit and control panel.","Replace V-belts.","Check all paintwork for corrosion, if present determine and report on cause, clean and repaint as necessary.","Check that enclosure door can be securely closed by the closing device fitted. Check that locks and interlocks function correctly.","Ensure air dryer unit is operating as per manufacturer's instructions, regarding air dryness.","Examine receiver isolating valve gland packing and adjust or repack as required. Check free travel of spindles and ensure hand wheels are secure.","Check that regulating system operates correctly, cleaning and adjusting as necessary.","Inspect all receiver, pipework and equipment supports for tightness and security and report.","Inspect condition of receiver vessel both internally and externally and report.","Replace coolant every 8000 running hours or every one year which ever comes first.","Examine and report on the condition of all associated wiring and ensure security of termination's.","Carry out insulation resistance and earth continuity tests and report results.","Inspect starter contactors.","Fit test gauges and calibrate all safety switches/devices.","Test and ensure correct operation of all indicator lamps, replacing any faulty components.","Test and ensure that all pressure controls and associated components are operating correctly. Re-calibrate as required logging all settings.","Carry out tasks as detailed for Annually.","Replace shaft seal after 8000 running hours or two yearly which ever comes first.","Replace idler sheave assembly after 16000 running hours."]}},"ME-17":{"name":"HVAC & Process Piping and Accessories","frequencies":{"Weekly":["Check all exposed pipe work, joints, connections, etc. for leakage or corrosion. Report defect and repair as necessary.","Check alignment of expansion bellows and lugs where applicable. Report any defects.","Check guide points for wear and freedom of pipe movement, grease guide rollers as required."],"Monthly":["Carry out tasks as detailed for Monthly.","Check all pipe support brackets, hangers, and anchors for security, and tighten as necessary. Report condition.","Check condition of all insulation and covering, paying particular attention to the integrity of the vapour seal, repair and report any defects.","Check operation of valves, stop cocks, drain cocks, etc. if operation of valve is stiff, lubricate as necessary and repeat opening and closing until clear, and return valve to its original position.","Examine all valve gland packing for leakage and adjust or re-pack as required.","Clean strainer(s)."],"Annually":["Carry out tasks as detailed for Quarterly.","Check pipe work identification tags remain secure, report any defects.","Check for integrity of fire stopping where pipes pass through walls etc. report any defects.","Re-calibrate pressure and temperature gauges."]}},"ME-18":{"name":"Water Softener","frequencies":{"Safety Precautions":["Review the manual before you start the service process.","Disconnect all electrical equipment as it applies in the System Manual. Also, in some cases, you may be spilling water on the floor surface area. To protect yourself form electrical shock, disconnect all electrical power.","Follow the different procedures for depressurizing the water treatment system. In some cases, the incoming water needs to be shut off. In other cases, it may be required to shut off the hard water inlet valve, soft water outlet valve and the manual brine valve to the injector. When draining the resin tank, be sure that an adequate drain facility is available for the water flow to prevent flooding or water damage."],"Quarterly":["Examine and ensure correct operation of the plant. Report any damage.","Carry out an analysis of water conditions and adjust the chemical dosing as required to maintain water conditions within the water treatment specialists prescribed limits, record results.","Report on the stock of the necessary treatment salts, advice on the necessity to re-order premises stock.","Examine all control and isolating valves for full and free travel, check for leakage. Adjust or repack valve glands as may be required.","Ensure correct operation of the timer assembly.","Ensure correct operation of the control drive assembly."],"Bi-Annually":["Examine the unit and ensure correct operation of back wash cycle. Adjust controls as per manufacturer’s instructions.","Examine all associated pipework, nuts and olives. Repair or replace any damage sections.","Test and ensure correct operation of controllers and associated components. Adjust or recalibrate as necessary."],"Annually":["Examine tasks and vessels, report on their condition. Clean them thoroughly removing all chemical deposits from the unit.","2.00 Ensure the security of drains and overflows and that they are free from obstruction.","Remove and clean the pilot strainer. Replace if necessary.","Remove and clean the brine injector nozzle. Replace if necessary.","Strip and clean the injector assembly and filter. Replace any faulty item.","Lubricate the controller brining and refill cam faces, all gear teeth, pivots and sliding faces. Report on their condition."]}},"ME-19":{"name":"Ductwork, Insulation and Accessories","frequencies":{"Safety Precautions":["When cleaning or working in ducts it is essential that all sensors or probes be withdrawn from the duct to prevent any damage.","Care should also be taken to prevent any damage to dampers, linkages and other control devices, which may be located in a duct.","All volume dampers are set up during commissioning and should not normally be subject to further adjustment unless modifications are made to the ductwork distribution system.","It is essential that all regulated settings of dampers be marked before work is undertaken on the system and noted, so that they can be correctly returned to the position as set when commissioned.","When cleaning hood with steam, insure that all electrical sockets, electrical connection are covered and secured against water penetration to prevent electric shocks and serious injuries.","When cleaning hood with steam, make sure that the steam temperature will not set off the hood fire protection devices.","When cleaning hood cover kitchen appliances under hood with plastic covers to prevent water penetrations.","Make sure that steam pressure will not damage the hood fire protection devices."],"Quarterly":["Ensure all ductwork supports, brackets and suspension rods are secure. Tighten bolts as necessary. Report any signs of corrosion. Advise on any remedial work.","Check flexible connections for condition, leaks and secure fittings. Ensure all connections are airtight. Repair or replace as necessary.","Inspect access doors for any loose panels and ensure door fixings are secure.","Check door gaskets for damage and air tightness. Repair/Replace as necessary.","Ensure that all door handles, catches, hinges and locking systems are functioning correctly.","Check all accessible turning vanes in ductwork are secure and free from debris.","Inspect insulation for any damage or deterioration. Report on condition in particular the integrity of the vapour seal and/or loose wire mesh.","Ensure all ductwork test holes are plugged and airtight.","Examine grilles, check mountings and clean.","Check louvers for damage clean & remove any debris.","Check screens for any damage clean. Replace if badly blocked.","Carry out cleaning of duct insulation and repair defective sections","Check volume dampers for position, ease of movement and security of locking devices. Ensure that the damper opens and closes to desired positions.","Ensure that the damper blades are secure & are correctly aligned and report any that are loose.","Check for duct leakage through volume damper.","Operate dampers through total range of travel to check for freedom of movement.","Apply light oil on linkages and pivot pins.","Check linkages for wear. Report on condition.","Check action and proper operation. Inspect all dampers; apply a few drops of oil to the mechanism.","Examine dampers for security in the fire barrier and that all fire stopping around the damper is intact repaired. Report any breaks in stopping. Replace damper if necessary.","Clean out any dirt or debris collected in the blade guide slots.","Ensure fusible links to be secure and of the correct rating. Replace fusible links if damaged or faulty.","Lubricate axis or guide slots as necessary.","Gravity shutter fire damper: check free fall of damper to tight shut position.","Spring shutter fire damper: check the spring for corrosion and elasticity. Replace if required.","Plate gravity fire damper: check counter weight for tightness if applicable.","Check for duct leakage.","Check duct lock for tightness.","Clean the inside of the hood, exhaust duct, and grease filters with low temperature, low pressure steam (using a mobile steam generator, or by steam from a nearly source)."],"Annually":["Carry out tasks as detailed for Quarterly.","Check internal condition through sampling points where fitted.","Measure air volumes at each grille and compare with commissioning values. Report any significant alteration in readings.","Check air volumes on supply diffusers and adjust where required.","Inspect anti-vibration mounts for permanent set (in springs). Report if renewal is required. If replaced ensure that the correct type is used.","Check air deflectors for correct position and ensure the absence of rattling sound. Report and repair if required.","Check all attenuator supports and fixings for security.","Ensure that all doors handles, latches, hinges and locking systems are functioning correctly.","Ensure that seals are intact and efficient. Replace seals if necessary.","Ensure that the access doors are not damaged and that they make perfect contact all around with seal."],"Weekly":["Remove hood grease filters and wash them with hot water (over 60C) to remove entrapped grease."]}},"ME-20":{"name":"Building Automation and Control System","frequencies":{"Monthly":["Obtain approval from Supplier/Manufacturer then check that all equipment is functioning correctly by calling up parameters and comparing with commissioning data, if available.","Replace any sensors etc. that are malfunctioning.","Analyse print-out data for abnormal behaviour of plant. Report findings.","Check suitable mechanical and environmental conditions for outstations and central stations (temperature, humidity, dust, vibration, etc.) and record on- site readings.","Make back-up of all activities.","Check that in case of simulated fault at any of redundant computers, proper switching-over is achieved in between.","Verify that standby computer is making a backup to main computer.","Check UPS in accordance with Manufacturer’s instructions."],"Quarterly":["Carry out tasks as detailed for Monthly.","Check that three copies of all the system discs as supplied by the Supplier upon commissioning are available and properly preserved in a clean air conditioned space. Two copies are to be kept on site, the third off site.","Check that all power supplies to host units are normal and identify any condition that could shut down the systems. Report all necessary repairs immediately.","Check mini floppy disc drive using cleaning diskette and host keyboard on PC’s for correct operation. In case of fault, call Agent.","Check drives integrity and verify data transfer after cleaning disk drive.","Check host screen displays and clean screen with suitable cleaner, strictly as per manufacturer’s instructions.","Clean host filter and check cooling fans.","Clean host printer(s) head, if cleanable, and check operation utilising test programs. Change ribbon cartridge(s) as necessary. Check stock of consumables as applicable.","Clean PC’s and Drives from inside using vacuum cleaner.","Check exhaust fans and clean filter.","Check each outstation battery back-up operation by removing mains power. Re-instate mains and ensure that outstation performs correct re- starting of routines and reports alarm to host station according to written instructions.","Check outstation communications connection with the rest of system by recording and comparing individual outstation data to the main host data according to written instructions prepared by the Supplier.","Check digital input points by activation from the final sensing device as per written instructions prepared by the Supplier.","Check 25% of the system digital and/or analogue outputs to ensure final device responds to system control at operator’s investigation. Check a different 25% each Quarter. Ensure that each output is checked once a year. Maintain a log book to keep record of device tested.","Check 25% of the system analogue input points by taking readings at the detector(s), and comparing with those displayed at the host. If the error is between the field processing unit (FPU) and the host, then correct. Of the FPU is then checked and found to be outside allowable tolerances the FPU should either be removed for repair or replaced. Ensure that all inputs are checked annually.","Check 25% of the system direct digital control loops (including analogue output points). Check a different 25% each Quarter in order to check all loops within a year.","Check and measure earthing connections. Should be less than 1 ohm to Earth.","Check 25% of all electrical (and fibre optic if applicable) terminations. Check that they are tight and wiring is complete and free from earth faults, ensuring that all terminations are checked annually.","Check calibration and adjust if necessary. If outside calibration limits, replace.","Check that the sensing element is clean and responds to parameter change.","Verify the accuracy of 25% of the sensors by comparing the readings in the Main Room to the reading on the corresponding sensor reading installed on site."],"Annually":["Carry out tasks as detailed for Quarterly.","Check computer clock batteries replace if necessary.","Check security, integrity and physical damage of all cables and connectors.","Point out all parameters and check integrity and verify operational requirements by operator and system."]}},"ME-21":{"name":"Air Outlets","frequencies":{"Quarterly":["Ensure correct and secure fixing.","Check for smut around perimeter surface of air outlets. Report findings.","Inspect air leakage around air outlet neck. Report and repair as appropriate.","Check for obstructing debris and blockage. Clean off air outlet and remove obstructions.","Check for damage and mishap. Repair damage or replace air outlets if necessary.","Check for corrosion or not. A corroded air outlet is to be wire brushed, dried thoroughly and have one coat of anti-corrosion primer and two coats of paint applied. Renew any air outlet weakened by corrosion."],"Annually":["Carry out tasks as detailed for Quarterly.","Measure air volumes at each outlet and compare with commissioning or design values. Report any significant alterations in readings. Advise on need to rebalance system."]}},"ME-22":{"name":"End Suction Pump","frequencies":{"Monthly":["Check pump operation via control panel. Report findings.","Check pump operation for undue noise and vibration. Report findings.","Check bearing temperature with an accurate temperature device; ensure it is below 180°F11. If hot inspect for over lubrication or misalignment.","Check the direction of rotation.","Check grease lubricated bearings for moisture and oxidation. If any contamination is present, remove and clean bearings. Grease up again with the proper type grease as recommended by the manufacturer.","Inspect bearings as per Manufacturer’s recommendation.","Ensure correct operation of all control panel indicator lamps. Replace any faulty lamp as necessary.","Tighten all terminal connections and main cable in the motor and pro-star."],"Quarterly":["Carry out tasks as detailed for Monthly.","Check for leaks at fittings and around flanges and connections. Repair any leak and replace any defective part.","Examine and test for full and free travel, checking for any leakage.","Check the screen of the strainer for build-up of solid material. Clean as required.","Check operation of valves. Valves should be fully closed then fully opened (Note the number of turns to fully close, so that valve can be reset to its original position). If operation of valve is stiff, lubricate as necessary, repeat opening and closing until clear, and then return valve to its original position.","Ensure correct operation.","Check for inadequate suction, discharge and shut-off heads against commissioning data.","Check for inadequate lubrication and overheated bearings12 . Inspect lubricating system. Repair as necessary.","Check grease lubricated bearings for saponification. Inspect grease for whitish colour. If this occurs, wash bearings with a bearing cleaning solvent and replace the grease with the proper type as recommended by the manufacturer.","Check for end play of shaft. Report on condition, and advise on any necessary remedial work.","Check for presence of dirt, moisture and other accumulations. Clean as necessary.","Check for noisy running. Determine cause & repair as necessary.","Check holding down bolts for rigidity and security.","Check for evidence of strain on pipes and pump casing.","Check and ensure correct operation of all flexible connections, repairing or advising on the necessity of replacing damaged components.","Check condition of all associated insulation and covering. Repair and report any defects.","Inspect all piping supports for soundness and effective support of load.","Check and record motor running current13.","Inspect and tighten the electrical terminals.","Check wiring insulation & flexible connections. Secure & tighten as required.","Check high discharge pressure switch and calibrate if necessary."],"Bi-Annually":["Carry out tasks as detailed for Quarterly.","Check shaft or shaft sleeve for scoring, alignment and eccentricity. Repair or replace as necessary.","Check / Tighten main cable terminal connections and monitoring / sensing circuits at the RTD terminal on the motor and in the pro-star relay all through."],"Annually":["Carry out tasks as detailed for Bi-Annually.","Calibrate all pressure and temperature gauges.","Check and tighten as required, report on condition of holding down bolts.","Remove rotating element and inspect for wear. Replace defective parts.","Clean out stuffing box piping. Remove any deposit or scaling.","Check seals and bearings for any damage. Adjust or replace as necessary.","Inspect pump casing and report any defect.","Test IR insulation resistance of stator windings, between phases and phase to earth using a 2500V megaohmmeter (preferably motor driven) for 60 sec. immediately after the shut down of the machine, whilst the windings are hot and dry. The temperature should be recorded and IR measurements converted to a base temperature for future comparison. Always disconnect all voltage sources, surge arrestors, capacitors, or other low insulation sources before making a test. Lead-in cables can be tested as pa","Clean dust and dirt on the motor stator.","Examine and report condition of all associated wiring facility and wiring, ensuring security of termination.","Inspect and clean all circuit breaker contact surfaces.","Check and clean enclosures, switches and push buttons.","Carry out tasks as detailed for Annually.","Clean out and renew the grease. An un-vented bearing should be packed only half full. (Sealed bearings need no attention for 5 years.).","Retighten all RTD alarm connections and test."]}},"ME-23":{"name":"Centrifugal Fan","frequencies":{"As Required":["Visually examine entire unit and ensure correct operation. Report condition and carry out any remedial work as required.","Examine unit for any undue noise, vibration, or rattling. Report and repair as appropriate.","Examine fan shaft bearings and lubrication system. Check for shaft overheating14, lubricant dilution, or over lubrication. Adjust to ensure suitable lubrication according to the manufacturer's recommendations."],"Monthly":["Carry out tasks as detailed under weekly.","Lubricate or grease bearings according to manufacturer's recommendations."],"Quarterly":["Examine and ensure all brackets, fixings, fan enclosure and housing to be secure. Check bolts for corrosion. Tighten and replace as necessary. Report on condition of supports.","Inspect shaft and bearings for wear corrosion and tightness. Repair or replace bearings as necessary.","Check shaft and bearings for end play. Report on condition. Replace bearings if necessary.","Examine motor to shaft alignment. Adjust if necessary.","Check bearing locking collars, retighten and repair as necessary.","Check tension of belt drives and examine for wear and fraying. Renew defective belts.","Ensure correct tension on belts. Adjust as necessary.","Check alignment of driving pulleys. Rectify if incorrectly aligned.","Inspect drive pulleys for security on their respective shafts. Re-secure a loose pulley, tightening all security bolts and locks.","Check security of driving guards. Tighten or refit as necessary. Inspect guards for corrosion and replace an inadequate guard.","Test bearings for wear and shaft end play. Report findings.","Check motor RPM. Record data. Compare with commissioning figures or design data. Report significant change.","Lubricate motor according to the manufacturer's recommendations.","Examine and ensure that motor ventilation airways are clear. Remove all dirt and dust by vacuum cleaning.","Check motor isolation mounts and fixings. Tighten as necessary.","Remove dirt accumulation from wheel and housing.","Check wheel, housing, and bolts and set screws for tightness.","Inspect flexible connections for leaks. Re-tighten brackets or gaskets as necessary. Replace a defective connection.","Ensure duct hangers rigidity and tightness. Tighten as necessary. Inspect condition of brackets, hangers, and bolts. Report accordingly.","Check and ensure correct operation of all switches, controls and controllers.","Examine and report on condition of all associated wiring facilities and wiring. Ensure security of termination.","Carry out insulation resistance and earth continuity tests. Report results.","Check voltage and amperage. Record data. Report any significant error."]}},"ME-24":{"name":"VAV & Terminal Boxes","frequencies":{"Quarterly":["Visually inspect entire unit, report on condition and carry out remedial works as required.","Check for undue nose, vibration or rattling. Report and adjust as necessary.","Ensure all brackets and fixings are secure. Check bolts for corrosion. Tighten and replace as necessary. Report on condition of supports.","Ensure all sensors and actuators are functioning correctly. Report and re-set as appropriate. Replace any defective item.","Inspect flexible connections for leaks. Re-tighten brackets or gaskets as necessary. Replace a defective connection.","Ensure rigidity and tightness of duct hangers. Tighten as necessary. Inspect condition of brackets, hangers and bolts. Report accordingly.","Inspect duct insulation paying particular attention to the vapour seal. Repair damaged areas.","Check the differential static pressure across the terminal from inlet to discharge outlet. If it exceeds the required value check for leaks","Check damper operation. Repair necessary. Refer to manufacturer instruction for performing this operation.","Examine and report on condition of all associated wiring facilities and wiring. Ensure security of termination."],"Bi-Annually":["Carry out tasks as detailed for Quarterly.","Clean out external and internal dust and dirt from the unit."],"Annually":["Carry out tasks as detailed for Bi-annually.","Check paint work for corrosion. If present determine and report cause. Clean, wire brush and repaint as necessary.","Check and calibrate all control devices."]}},"ME-25":{"name":"Room Air Conditioning","frequencies":{"As Required":["Disconnect the power supply to the unit whether for periodic inspections or emergency repairs."],"Weekly":["Inspect unit for any problems, including noise, sealing, leaks, insulation, bearings, drains, etc.","Check cleanliness of filters and inspect for break up and correct sealing.","Check cleanliness of grilles (if fitted).","Inspect unit for any problems, including noise, sealing, leaks, insulation, bearings, drains…","Check fan mounting, cleanliness and operation.","Check operating pressures, if not correct check for leaks.","Check voltage and amperage. Record any error.","Visually check entire unit and ensure correct operation.","Check for any under noise or vibration. Report condition.","Check if the supply voltage is within the design limits.","Examine the air filters; if clogged, clean or change the filters when the specific alarm comes on."],"Monthly":["Carry out tasks as detailed for Weekly.","Check drains and ensure they are clear.","Check that the electrical connection on motor and electric heater is tight.","Carry out tasks as detailed for Weekly.","Check pipe work and insulation condition and fixing.","Check operation of compressor crankcase heater according to manufacturer’s recommendations.","Check operation of all pressure switches and safety devices.","Check refrigerant temperatures.","Carry out tasks as detailed under weekly.","Examine that the cylinder and the feed and drain valves of the humidifier are not clogged; replace the cylinder when the specific alarm comes on according to the manufacturer’s recommendations.","Check if the flow of the condensate to the main drain is free. Repair or renew as required.","Check pipe work connections for leaks also condition of local insulation."],"Quarterly":["Carry out tasks as detailed for Monthly.","Check fan mounting, cleanliness and operation.","Check unit for rust especially around cooling and humidifying sections.","Check pipe work connections for leaks also condition of local insulation.","Check oil and eliminators if fitted, for built-up of dust, and scale in the case of the latter. Clean with stiff brush if dirty.","Isolate switch gears and controls and inspect contactors, relays etc. for signs of overheating or arcing.","Check operation of electric heater thermal cut-out.","Check anti-vibration mounts (if fitted).","Check pressure drops air/water and compare with commissioning details","Check operation of all safety devices such as airflow switches etc.","Carry out tasks as detailed for Monthly.","Check electrical connections. Tighten if necessary.","Check condensing unit for rust. Clean as necessary.","Ensure that air cooled condensing units are free from dirt, debris. Clean and remove any debris.","Check compressor is securely fixed, anti-vibration mounts are tight and oil level is correct.","Carry out tasks as detailed for Monthly.","Check the condition of the electrical terminals. Tighten as necessary.","Examine fan and motor bearings for overheating adjust to ensure suitable lubrication according to manufacturer’s instructions."],"Bi-Annually":["Carry out tasks as detailed for Quarterly.","Clean unit inside and out with vacuum cleaner and wipe down with damp cloth. Rectify any paint damage externally."]}},"ME-26":{"name":"Ecology Unit","frequencies":{"As Required":["Disconnect the power supply to the unit whether for periodic inspections or emergency repairs.","Do not expose yourself to UV light because UV-C light will damage eyes and seriously burn skin.","Use UV-C blocking face shield and gloves etc to cover exposed skin.","Make sure the mercury spillage kit is available during maintenance.","Under no circumstances should the ventilation fans be switched off with the UV-C lamps activated. This will create a large build up of ozone. The ozone monitor should be active at all times when the lamps are activated.","Check the control panel for alarms."],"Weekly":["Inspect unit for any problems, including noise, sealing, leaks, insulation, bearings, drains, etc.","Switch off the UV lights and kitchen ventilation fan and isolate the power supplies.","Checks shall be made to ensure that removable duct filters are easily removed.","Check cleanliness of filters and inspect for break up and correct sealing, all metal surfaces shall be checked to ensure that there is no accumulation of grease or dirt and that there is no surface damage.","Check the condition of the UV lamps. Clean the UV lamp surfaces as required.","After closing the Pollustop access doors, switch on the system.","Check that the system is operating satisfactorily (do not try to look). Check that the ventilation fan is operating.","Replace any filters as required."],"Monthly":["Carry out tasks as detailed for Weekly.","The fan should be withdrawn as far as possible and the impeller carefully cleaned with a vacuum cleaner and brush.","Check that the electrical connection of the equipment is tight.","Inspect V-belts tension and condition. Refer to manufacturer's catalogue for correct procedure. Ensure correct pulley alignment."],"Bi-Annually":["Check unit for rust.","Isolate switch gears and controls and inspect contactors, relays etc. for signs of overheating or arcing.","Carry out tasks as detailed for Monthly.","Clean unit inside and out with vacuum cleaner and wipe down with damp cloth. Rectify any paint damage externally."]}},"ME-27":{"name":"Odour Detector","frequencies":{"As Required":["Check 25% of all electrical (and fibre optic if applicable) terminations. Check that they are tight and wiring is complete and free from earth faults, ensuring that all terminations are checked.","Check calibration and adjust if necessary. If outside calibration limits, replace.","Check that the sensing element is clean and responds to parameter change.","Verify the accuracy of 25% of the sensors by comparing the readings in the Main Room to the reading on the corresponding sensor reading installed on site."]}},"ME-28":{"name":"Libert- Computer Room Air Handler","frequencies":{"As Required":["Disconnect the power supply to the unit whether for periodic inspections or emergency repairs."],"Weekly":["Inspect unit for any problems, including noise, sealing, leaks, insulation, bearings, drains, etc.","Check cleanliness of filters and inspect for break up and correct sealing.","Check cleanliness of grilles (if fitted).","Inspect unit for any problems, including noise, sealing, leaks, insulation, bearings, drains…","Check fan mounting, cleanliness and operation.","Check operating pressures, if not correct check for leaks.","Check voltage and amperage. Record any error.","Visually check entire unit and ensure correct operation.","Check for any under noise or vibration. Report condition.","Check if the supply voltage is within the design limits.","Examine the air filters; if clogged, clean or change the filters when the specific alarm comes on."],"Monthly":["Carry out tasks as detailed for Weekly.","Check all the sensors.","Check drains and ensure they are clear.","Check that the electrical connection on motor and electric heater is tight.","Carry out tasks as detailed for Weekly.","Check pipe work and insulation condition and fixing.","Check operation of compressor crankcase heater according to manufacturer’s recommendations.","Check operation of all pressure switches and safety devices.","Check refrigerant temperatures.","Carry out tasks as detailed under weekly.","Examine that the cylinder and the feed and drain valves of the humidifier are not clogged; replace the cylinder when the specific alarm comes on according to the manufacturer’s recommendations.","Check if the flow of the condensate to the main drain is free. Repair or renew as required.","Check pipe work connections for leaks also condition of local insulation."],"Quarterly":["Carry out tasks as detailed for Monthly.","Check fan mounting, cleanliness and operation.","Check unit for rust especially around cooling and humidifying sections.","Check pipe work connections for leaks also condition of local insulation.","Check oil and eliminators if fitted, for built-up of dust, and scale in the case of the latter. Clean with stiff brush if dirty.","Isolate switch gears and controls and inspect contactors, relays etc. for signs of overheating or arcing.","Check operation of electric heater thermal cut-out.","Check anti-vibration mounts (if fitted).","Check pressure drops air/water and compare with commissioning details","Check operation of all safety devices such as airflow switches etc.","Carry out tasks as detailed for Monthly.","Check electrical connections. Tighten if necessary.","Check condensing unit for rust. Clean as necessary.","Ensure that air cooled condensing units are free from dirt, debris. Clean and remove any debris.","Check compressor is securely fixed, anti-vibration mounts are tight and oil level is correct.","Carry out tasks as detailed for Monthly.","Check the condition of the electrical terminals. Tighten as necessary.","Examine fan and motor bearings for overheating adjust to ensure suitable lubrication according to manufacturer’s instructions."],"Bi-Annually":["Carry out tasks as detailed for Quarterly.","Clean unit inside and out with vacuum cleaner and wipe down with damp cloth. Rectify any paint damage externally."]}},"ME-29":{"name":"Lint Interceptor","frequencies":{"Weekly":["Clean the interceptor in order to maintain proper operating efficiency. Follow the manufacturer’s instructions to perform this process.","Remove solids that collect in the interceptor thru settling and remove Lint.","Check the air relief port in order to be clear."]}},"ME-30":{"name":"Circulating Pump","frequencies":{"Monthly":["Examine pump unit and adjacent pipe work, together with associated connection for leaks and corrosion. Report findings.","Externally clean pumps and motors."],"Quarterly":["Carry out tasks as detailed for Monthly.","Test unit for excessive noise or vibration. Repair as necessary","Inspect bearings and glands for wear. Lubricate bearings to manufacturer's recommendations. Repack glands as required.","Examine all pipe work and valves insulation. Repair any damaged section or item.","Examine and record delivery and suction pressure gauge, together with thermometers. Report any defect.","Inspect and clean strainers.","Test all manually operated valves, ensure full and free travel and correct settings. Check for leakage, adjust or replace valve glands as required. Remove all deposits and lubricate valve.","Examine pump drain points. Ensure they are clean and free from any foreign materials.","Inspect motor electrical terminals. Tighten if required.","Check and record full load running current.","Examine control switches. Check for proper operation and calibration."],"Annually":["Carry out tasks as detailed for Quarterly.","Examine and ensure motor ventilation airways are clear, remove all dirt and dust by vacuum cleaner.","Check pump and motor level and alignment. Repair as necessary.","Check and tighten as required, report on condition of holding down bolts.","Check and clean anti-vibration mounts. Repair or replace as necessary.","Check motor winding insulation. Report condition.","Examine and report on condition of all associated wiring facility."]}},"ME-31":{"name":"Air Cooled Centrifugal Water Chiller","frequencies":{"Safety Precautions":["The Safety Code for Mechanical Refrigeration ANSI/ASHRAE 15- 1978 contains the recognized standards to assure the safe installation, operation and inspection of refrigeration systems. The purpose of this Code is to establish reasonable safeguards to life, limb, health, and property.","It is important that those responsible for the installation, operation and maintenance of this system be familiar with this Code.","- Only experienced, qualified personnel should install, operate or maintain refrigeration equipment. They should be familiar with and adhere to local safety regulations and procedures.","All refrigerants are potentially hazardous and should be treated with care.","Dangerous voltages are present in the electrical components, which can cause serious injury, electrocution and equipment damage. To avoid serious injury and/or equipment damage, all equipment must be de-energized, disconnected and isolated before any adjustments, servicing, wiring parts replacement, or any other acts requiring physical contact with the electrical or mechanical working components of the equipment. This must be done to prevent accidental contact with live or moving parts. It is re","Safety guards must be in place after any service and before operating the equipment.","Precautions must be taken to avoid contact with any surfaces that could cause skin burns.","For the protection of personnel and property, all refrigerants possible must be removed from any section or component of the system before any refrigerant retaining part is loosened. Pump out as much refrigerant as possible from the section to be opened. Make sure control valves are opened where necessary to avoid trapping refrigerant. Do not depend on solenoid valves as isolation valves while making repairs.","When opening any pressure-containing component, care must be taken to relieve the pressure in a safe manner.","It is sometimes necessary to discharge small amounts of refrigerant from the section to be serviced. Be sure that the rate of discharge can be easily controlled and that it can be shut-off quickly if necessary. Discharge of refrigerant to the atmosphere should be avoided. Whenever possible, refrigerant should be transferred to a container approved for this purpose by applicable safety codes and standards. Follows refrigerant manufacturer’s recommendations when transferring refrigerant.","Always have an observer nearby when working on any part of a refrigeration system so that help is available in an emergency.","Under no circumstances should any attempt be made to remove a component or cover on a unit, which forms part of refrigeration circuit before making certain that no pressure is present on the refrigerant side of the item.","Under no circumstances should personnel be allowed to smoke while servicing or repairing systems using fluorinated hydrocarbon refrigerants. Such refrigerants when passing through the lighted end of a cigarette produce phosgene gas, which is poisonous.","Avoid spilling liquid refrigerant on skin or getting it into the eyes. Use safety goggles. Wash any spills from the skin with soap and water. If any enters the eyes, immediately flush eyes with water and consult a physician.","In addition to the above read the manufacturer operation and maintenance manual for other safety precautions, and follows the manufacturers maintenance procedure."],"Daily":["Check the oil level through the compressor oil sight glasses after the unit has been in operation for the time specified by the manufacturer. If level doesn’t appear, rectify immediately according to manufacturer’s recommendations.","Check and record oil pressure reading.","Check and record for each circuit section and discharge pressures and temperatures. Report if the temperatures and pressures are outside design and normal operation.","Check and record entering and leaving chilled water temperatures and pressure. Compare results with figures on the commissioning sheets. Report if the data is outside design or normal operating range.","Check the compressor for superheating."],"Weekly":["Carry out tasks as detailed under daily.","Check the colour of compressor oil. New oil is clear. Discoloration of the oil is an indication of contamination, basically due to moisture and/or foreign material. Refer to manufacturer’s recommendations if necessary to charge oil.","Check for refrigerant leakage. Repair or adjust refrigerant level. Follow manufacturer’s recommendations in performing this process.","Conduct a thorough visual test on the unit. Note excessive or unusual vibration, noise or odour any defect."],"Monthly":["Carry out tasks as detailed under weekly.","Check control panel gauges. Report any defects.","Inspect condenser coil for blockage. Clean and straighten damaged fins with a fin comb.","Check control panel lights. Report any defects.","Check and record all compressors motors voltage and amperage at starter. Note hours of run readings."],"Quarterly":["Carry out tasks as detailed for Monthly.","Check oil level in sump or crankcase. Ensure that a high level is not due to the presence of liquid refrigerant. Record and repair as necessary.","Check date of last oil change. Change oil base on running hours or as specified by the manufacturer.","Check supports and inspect for corrosion. Tighten bolts and screws as necessary. Replace any defective item. Report on condition.","Examine fan casing to be free from corrosion, dust. Check for shaft end play.","Check water connections for leaks; rectify any leaking joint or connection. Check associated water pipe work and accessories.","Examine valves for leakage, strainers for leakage. Clean strainer as necessary.","Ensure accuracy of pressure and temperature safety cut-outs (high and low). Adjust an incorrectly set cut-out.","Examine fan motor. Repair as necessary."],"Annually":["Carry out tasks as detailed for Quarterly.","Check operating controls to see if controls are set and operating within the proper limits. Refer to unit controls and operation section of manufacturer’s catalogue.","Charge oil of the compressor following the manufacturer’s procedures as described in the catalogue.","Check the condition of the suction and discharge valves.","Examine and check all anti-vibration mountings.","Check condition of electrical components. Service as necessary.","Examine fuse links and circuit breakers for correct rating. Replace as necessary."]}},"ME-32":{"name":"Boiler","frequencies":{"Safety Precautions":["Do not empty the boiler while boiler is hot.","Maintenance of the boilers is to be carried out by experienced and competent persons who are certified to carry out boiler maintenance","Maintenance of the boilers is to be carried out according the manufacturer procedure as indicated in the manufacturer maintenance manual.","Follow the manufacturer recommended safety precautions while carrying out maintenance work on the boilers.","Follow the manufacturer General Rules for Avoiding Corrosion to minimize the risks of boiler failure."],"Daily":["While burner on, blow down the boiler, the burner should stop when water in the boiler reaches the low level cut-out. If not, examine and repair as necessary.","Empty the water from the water level indicator until burner stops.","Check the fuel oil level in the fuel oil tanks. Make sure you have enough fuel for the daily consumption.","Deleted.","Examine the temperature of the exhaust duct. If it exceeds 280C check the flue side of the boiler to identify the cause (dirt, overheating, bad combustion…).","Check the PH, report immediately if not between 8.5 and 10.5.","To prevent solids from building up in boiler. Boiler must be blown down for five seconds every day.","Log all necessary information and report findings."],"Weekly":["Carry out the tasks as detailed for Daily.","Clean the boiler and burner from dust, dirt, oil and any other foreign matters.","Clean and adjust the nozzles as per the recommendations of the manufacturer. Do not use abrasive or metallic instruments or tools during the cleaning operation. Soak nozzle assembly in oil solvent for required time.","Test the high pressure cut-out switch. Make sure of its proper performance. While performing this test, observe the overall performance of the burner and make sure that the burner operates as per the sequence of operation described by the manufacturer.","Check the quality of water entering the boiler. Ensure that the water quality is as per the chemical treatment system’s recommendations. Report findings as necessary.","Inspect for undue noise, vibration or rattling. Report and adjust as necessary.","Deleted.","Check flame periodically and inspect to see that there is no flame impingement.","If carbon formation occurs, shut down and clean chamber. Burner should be adjusted as this formation is not normal."],"Monthly":["Carry out the tasks as detailed for Weekly.","Check blower. Adjust if necessary.","Make sure all set screws and nuts are tight on the air-oil control linkages.","Make sure all set screws in the burner and nozzle holder are tight and that the electrodes and gas ignition torch are well locked in position.","Go over all water and oil lines for leaks while unit is running. Shut the unit down and inspect the connections to the burner head also.","Inspect (externally) the rear side of the boiler for water leaks. If leak exists, tighten all bolts equally.","Protect the rotary air blower against the entrance of dirt, lubricate it using the type recommended by the manufacturer.","Inspect the blower. Follow the procedures of the manufacturer regarding the disassembly, assembly, inspection, clearing and servicing.","Expanders folls and mandrel should be washed and lubricated as recommended by the manufacturer.","The “fire-side” of the boiler should be cleaned periodically, since a dirty boiler is a fuel waste."],"Bi-Annually":["Carry out the tasks as detailed for Monthly.","Important. While performing the followings steps, the boiler should be left to cool down SLOWLY until its temperature reaches the ambient room temperature, otherwise damage might occur.","Loosen and dismantle all the bolts of the rear door of the boiler and remove the rear door.","Vacuum clean the pipes from the rear side.","Vacuum clean the remains of the flues and the formed scale from the front side of the boiler. This could be done by removing the front clean-out door.","Inspect the brick work and refractory cement through the rear door of the boiler. Repair and/or replace any damage brick work.","Close the rear door properly as instructed by manufacturer maintenance manual.","Clean the sight glass.","Examine the boiler tubes for any leakage at their joints, scale formation, pitting, and corrosion. Repair or replace as per manufacturer’s recommendations.","Use a few drops of S.A.E No. 20 motor oil for the two oil cups on burner motor.","While unit is firing, set the hot water operating control above the setting of the hot water limit control and allow the unit to run until the setting of the limit control is exceeded. This will shut the unit down.","While unit is in operation, increase the water pressure to exceed the setting marked on the body of the relief valve (30psi). The opening point of the relief valve must not exceed the 30 psi setting."],"Annually":["Carry out the tasks as detailed for Bi-annually.","Clean the water side of the boiler as described by the manufacturer’s maintenance manuals. Make sure all gaskets are replaced.","Check all paintwork for corrosion, if present determine and report on cause. Clean and repaint as necessary.","Replace all electronic controls.","Examine and report on the condition of all associated wiring and ensure security of terminations.","Test all gauges for fitness, re-calibrate and if necessary replace any defective gauge.","Test and ensure correct operation of all indicator lamps, replacing any faulty component.","Inspect chamber and repair cracks or expanded joints, if necessary to install new combustion chamber, follow instructions and dimensions shown on the manufacturer’s maintenance manuals.","When a boiler is taken out of service, the unit should be cooled until the water is below the atmosphere boiling point. The boiler should be emptied and flushed out and an inspection should be made to determine what repair work is necessary. Follow the manufacturer’s recommendation.","Remove scale from internal parts of boilers by mechanical means using vibrations which are cleaners that vibrate the tube with a hammer like action so that the scale is jarred off.","Clean boiler or furnace thoroughly and have the service man check burner firing rate.","Clean burner thoroughly, remove and clean nozzle with care so that surface inside tip is not scratched; if badly caked, replace","Clean burner fan, housing and blast tube.","Remove cap screws from end cap of pump. Remove pump strainer. Clean thoroughly. Replace gasket on pump with a new one.","Replace filter cartridge (if filter is used)."]}},"ME-33":{"name":"CAV Boxes","frequencies":{"Quarterly":["Visually inspect entire unit, report on condition and carry out remedial works as required.","Check for undue nose, vibration or rattling. Report and adjust as necessary.","Ensure all brackets and fixings are secure. Check bolts for corrosion. Tighten and replace as necessary. Report on condition of supports.","Ensure all sensors and actuators are functioning correctly. Report and re-set as appropriate. Replace any defective item.","Inspect flexible connections for leaks. Re-tighten brackets or gaskets as necessary. Replace a defective connection.","Ensure rigidity and tightness of duct hangers. Tighten as necessary. Inspect condition of brackets, hangers and bolts. Report accordingly.","Inspect duct insulation paying particular attention to the vapour seal. Repair damaged areas.","Check the differential static pressure across the terminal from inlet to discharge outlet. If it exceeds the required value check for leaks","Check damper operation. Repair necessary. Refer to manufacturer instruction for performing this operation.","Examine and report on condition of all associated wiring facilities and wiring. Ensure security of termination."],"Bi-Annually":["Carry out tasks as detailed for Quarterly.","Clean out external and internal dust and dirt from the unit."],"Annually":["Carry out tasks as detailed for Bi-annually.","Check paint work for corrosion. If present determine and report cause. Clean, wire brush and repaint as necessary.","Check and calibrate all control devices."]}},"ME-34":{"name":"Heat Recovery Air Handling Unit","frequencies":{"Safety Precautions":["Start motor for short times only if cover is opened, otherwise you risk overloading the motor. For a short start-up with opened revision cover you should stay near the unit.","When adjusting regulating pulley do not exceed maximum impeller speed and admissible motor current consumption.","Disconnect the main supply before any servicing on the unit.","Only qualified and experienced personnel should carry out the service work on the refrigeration system and electrical system."],"Monthly":["Visually examine entire unit, report on condition and carry out remedial works as required.","Operate and examine for any undue noise, vibration, or rattling. Report and adjust as necessary.","Check tightness and air leaks between the different sections of the unit. Replace gaskets as necessary.","Check coils. Ensure no leakage to occur from coils, connections or pipe work. Adjust and report accordingly.","Vent air from coils. Ensure tightness of vent cock, check for leakage and adjust if necessary.","Check coils for dirt, corrosion or algae and clean with low pressure water.","Read differential pressure across filter. Alternatively, examine filter medium for dirt and discoloration. Clean or replace as manufacturer’s instructions. Record and report findings.","Check tensions of belt drives as per manufacturer’s recommendations and examine for wear and fraying. Renew defective belts.","Ensure correct tension on belts. Adjust as necessary.","Check alignment of driving pulleys. Rectify if incorrectly aligned.","Inspect drive pulleys for security on their respective shafts. Re-secure a loose pulley tightening all security bolts and locks.","Check security of driving guards. Tighten or refit as necessary. Inspect guards for corrosion and dampers. Lubricate as necessary, reset to the original position.","Check volume dampers for corrosion and dirt. Clean as necessary. Ensure clear motion of dampers. Lubricate as necessary, reset to the original position.","Check the drum status.","Check leakage between the two sides.","Check voltage and amperage. Report data. Report any significant error."],"Quarterly":["Carry out tasks as detailed for Monthly.","Examine anti-vibration mountings; ensure their security and performance. Report and repair any defects. Replace item if necessary.","Examine and ensure all brackets, fixings are secure. Check bolts for corrosion. Tighten and replace ad necessary. Report on condition of supports.","Examine and ensure drip trays, drip points, and drain pipe work are free from dirt, scale, obstruction, corrosion and algae deposits. Clean as necessary.","Examine fan shaft bearings and lubrication system. Check for shaft and bearing overheating, lubricant dilution, or over lubrication, adjust to ensure suitable lubrication. Lubricated or grease bearings to the manufacturer’s recommendations (if not sealed for life type).","Check bearing locking set screws and other set screws for proper tightness. All bearing races must be secure.","Lubricate fan motors.","Check motor RPM. Record data. Compare with commissioning figures. Report significant change.","Lubricate motor to the manufacturer’s recommendations.","Examine and ensure that motor ventilation airways are clear. Remove all dirt and dust by vacuum cleaning.","Check motor isolation mounts and fixings. Tighten as necessary.","Remove dirt accumulation from wheel and housing.","Check wheel, housing, and bolts and set screws for tightness.","Open up and examine filter frame work and casing for corrosion. Wire brush and paint with anti-corrosion primer. Report on condition.","Examine filter element seating for air leakage. Repair and re-join filter element seating as required.","Check filter element locking devices for security of fastening. Adjust, refit or replace defective fastenings to ensure air tightness.","Examine and calibrate manometer as necessary.","Ensure air tightness. Tighten gaskets, bolts brackets as necessary. Change defective items.","Clean outside and inside as necessary.","Check and ensure correct operation of all switches, controls and controllers. (Smoke detectors, manometers, motorized valves).","Examine and report on condition of all associated wiring facilities and wiring. Tighten all connections."],"Bi-Annually":["Carry out tasks as detailed for Quarterly.","Clean out external and internal dust and dirt from the unit.","Clean the coils by using a jet of air, steam or hot/cold water applied in the opposite direction to normal airflow. For dirty coils, comb out fins. Clean deposits on coil with brush where necessary with appropriate sterilising solution such as chlorine.","Check the bearing locking collar or set screws for tightness."],"Annually":["Carry out tasks as detailed for Bi-annually.","Check paint work for corrosion, if present determine and report cause. Clean, wire brush and repaint as necessary.","Check validity of pressure and temperature readings in gauges. Recalibrate or replace defective gauges.","Replace air filter if necessary.","Check CFM and pressure developed by the Air Handling Unit. Compare with previous commissioning results.","Clean fan wheels and shaft. Remove dust from fan shaft with emery cloth, and re-coat the shaft with a suitable varnish.","Carry out insulation resistance and earth continuity test, report results.","Check and calibrate all control devices."]}},"ME-35":{"name":"Vane Axial Fan","frequencies":{"As Required":["Visually examine entire unit and ensure correct operation. Report condition and carry out any remedial work as required.","2.00 Examine unit for any undue noise, vibration, or rattling. Report and repair as appropriate.","3.00 Examine fan shaft bearings and lubrication system. Check for shaft overheating15, lubricant dilution, or over lubrication. Adjust to ensure suitable lubrication according to the manufacturer's recommendations."],"Monthly":["Carry out tasks as detailed under weekly.","Lubricate or grease bearings according to manufacturer's recommendations."],"Quarterly":["Carry out tasks as detailed for Monthly.","Examine anti-vibration mountings; ensure their security and performance. Report and repair any defect. Repl
